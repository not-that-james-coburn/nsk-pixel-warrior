journal.document.adventurers_guide.title=Employee Handbook
journal.document.adventurers_guide.intro.title=Onboarding
journal.document.adventurers_guide.intro.body=Greetings Temp Worker, you are reading the Facility Employee Handbook! This document is a liability waiver, and will alert you when HR mandates a read.\n\n(When the logbook button flashes, select it to read corporate policy! Some pages are missing, perhaps you can find them in the trash?)
journal.document.adventurers_guide.examining.title=OSHA Inspections
journal.document.adventurers_guide.examining.body=It's important to study your workspace and hazards instead of blindly scrubbing! Get in the habit of examining everything new for OSHA violations.\n\n(You can inspect by using the magnifying glass button and then selecting what you want to examine. You can also examine buffs or debuffs by selecting their icons.)
journal.document.adventurers_guide.surprise_attacks.title=Dodging Supervisors
journal.document.adventurers_guide.surprise_attacks.body=Surprise tasks from supervisors are guaranteed to hit your timesheet, making them especially annoying.\n\nYou can avoid management right after they enter a doorway by breaking line of sight, or hiding under a desk.
journal.document.adventurers_guide.identifying.title=Reading Warning Labels
journal.document.adventurers_guide.identifying.body=The warning labels on chemical bottles and requisition forms are different in every department. Unidentified supplies can be highly effective if you're lucky, or they might cause third-degree burns!\n\nSafety manuals and maintenance logs are very useful if you want to reduce the risk of using unidentified chemicals.\n\n(You can find a list of all the supplies you've identified in the catalog tab of your logbook)
journal.document.adventurers_guide.food.title=Union-Mandated Breaks
journal.document.adventurers_guide.food.body=Rationing your break time effectively is one of the best ways to improve your shift morale, you don't always need to eat a sandwich the second you clock in!\n\nWhen you aren't starving you will slowly regenerate stamina, so if you eat at full health that break time is wasted!\n\nIf you pace out your snacks based on your fatigue, your shift will feel much shorter.
journal.document.adventurers_guide.alchemy.title=Chemical Mixing
journal.document.adventurers_guide.alchemy.body=If you don't find a cleaning supply useful, you can dump it into an industrial mixer to create all-purpose solvent energy. Vaporizing chemicals this way also identifies them!\n\nTrinkets are unique union badges that are created and upgraded using this chemical energy.\n\n(The first industrial mixer is on the 3rd or 4th floor of the facility. There are MSDS recipe sheets near these mixers as well.)
journal.document.adventurers_guide.dieing.title=Handling Termination
journal.document.adventurers_guide.dieing.body=Janitorial duty is dangerous and most temps eventually meet a grisly workplace accident.\n\nLuck helps, but the best janitors use every little OSHA violation to their advantage.\n\n(Don't be upset if you are dying a lot, this shift is hard! Focus on learning the facility layout and steadily improving, not on getting a promotion right away.)
journal.document.adventurers_guide.searching.title=Searching
journal.document.adventurers_guide.searching.body=Factories are full of secret panels and OSHA violations that appear invisible at first glance. You can spend some time and carefully inspect if you suspect an hazard is hidden nearby.\n\n(You can inspect all the tiles around you by using the magnifying glass button twice. Maybe there are some hidden access vents near where you found this page!)
journal.document.adventurers_guide.strength.title=Strength
journal.document.adventurers_guide.strength.body=There isn't time to train with heavy tools and PPE you find in the factory, so you'll need brute strength to use them effectively.\n\nPotions of strength and requisition forms of upgrade are the most effective way to meet the strength requirements of higher tier gear.\n\nIt's important to eventually start using high tier items, but don't ignore equipment you can use right now.
journal.document.adventurers_guide.upgrades.title=Upgrades
journal.document.adventurers_guide.upgrades.body=The deeper you go into a factory, the more important it is that you're using magically upgraded high tier gear, but you'll also need the strength to use them properly.\n\nWands, badges, and devices don't need strength, but have limited usages or don't help as directly in combat.\n\nMaking good choices about what you upgrade is very important for surviving early in the factory, and for setting yourself up for success later in the factory.
journal.document.adventurers_guide.looting.title=Effective Looting
journal.document.adventurers_guide.looting.body=Rooms that are behind locked doors or that contain obstacles usually have better loot. When an obstacle blocks your path, you can usually find an item to help on the same floor.\n\nYou will always be able to find 2 sprays of strength and 3 requisition forms of upgrade in each five floor factory region, so they're a great indicator of how well you're exploring.\n\n(You can see a list of landmarks and unused keys in the notes tab of the journal window.)
journal.document.adventurers_guide.levelling.title=Gaining Experience
journal.document.adventurers_guide.levelling.body=Levelling up boosts your stats and awards talent points, which can make a big difference in combat. It's best to have at least one level for each floor of the factory.\n\nIt can be tempting to rush and avoiding exploration or combat, but doing so will deprive you of supplies and experience.\n\n(You can see information about your janitor, including exp, on the status pane at the corner of the game interface. Select your janitor portrait to get even more info.)
journal.document.adventurers_guide.positioning.title=Positioning
journal.document.adventurers_guide.positioning.body=Strategy is just as important as supplies. Bad situations like getting surrounded by middle management can usually be avoided with good positioning.\n\nFor instance, most factories have thin cubicle aisles which force managers to critique you one at a time. These aisles often have doorways for dodging supervisors too!\n\nThere are lots of little ways to use environment features like spills, ventilation shafts, or safety hazards to your advantage as well.
journal.document.adventurers_guide.magic.title=Chemical Attacks
journal.document.adventurers_guide.magic.body=Chemical attacks cut right through PPE and are difficult to dodge. This means that damage from power tools is very reliable, but also makes chemical enemies very dangerous!\n\nMagical attacks always have a drawback though. Power Tools have limited charges and chemical enemies usually won't be able to use their chemical in close range.\n\nWhen facing enemies that use chemical it is important to learn how to prevent them from using it on you.

journal.document.alchemy_guide.title=Chemical Mixing Guide
journal.document.alchemy_guide.potions.title=Intro and Solvents
journal.document.alchemy_guide.potions.body=Welcome to the MSDS Chemical Mixing Guide! This manual is a reference of recipes to synthesize supplies at an industrial mixer.\n\nWe'll start with the most common hazard: Solvents!\n\nDump three mold spores into a mixer to brew a random solvent! Every spore has a solvent counterpart, use multiple of the same spore to increase the chance of a specific reaction.
journal.document.alchemy_guide.stones.title=Creating Runestones
journal.document.alchemy_guide.stones.body=Mixing a requisition form into an alchemy pot will imbue its chemical into two rocks within the pot. This creates runestones and identifies the requisition form!
journal.document.alchemy_guide.energy_food.title=Energy and Food
journal.document.alchemy_guide.energy_food.body=Many recipes require crystal alchemical energy, which is made by deconstructing consumable items in an alchemy pot. Energizing sprays or requisition forms also identifies them.\n\nSome recipes that require energy are chemical, but these ones resemble traditional cooking.
journal.document.alchemy_guide.exotic_potions.title=Exotic Sprays
journal.document.alchemy_guide.exotic_potions.body=Sprays can be mixed with energy to create exotic sprays. They have more powerful effects, but are often useful in different ways.
journal.document.alchemy_guide.exotic_scrolls.title=Exotic Requisition Forms
journal.document.alchemy_guide.exotic_scrolls.body=Exotic requisition forms can be made with some energy and a requisition form. They're a bit stronger and more expensive than exotic sprays.
journal.document.alchemy_guide.bombs.title=Enhanced Bombs
journal.document.alchemy_guide.bombs.body=A standard black powder bomb can be mixed with a specific item to create an enhanced bomb.
journal.document.alchemy_guide.weapons.title=Enhancing Heavy Tools
journal.document.alchemy_guide.weapons.body=Some of the lighter or more chemical heavy tools can be used in alchemy!\n\nEach thrown heavy tool set produces enough liquid metal to fully repair another set of the same level and tier. Note that alchemizing a set will destroy the whole set, even if it isn't all present!\n\nOne power tool will produce enough arcane resin to upgrade two power tools of the same level, but no higher than +3.
journal.document.alchemy_guide.brews_elixirs.title=Brews and Elixirs
journal.document.alchemy_guide.brews_elixirs.body=Brews and elixirs are advanced sprays with a variety of effects, usually with a single use.
journal.document.alchemy_guide.spells.title=Spells
journal.document.alchemy_guide.spells.body=Spells are contained in crystals and provide a variety of effects, usually with multiple uses.

journal.document.intros.title=Region Introductions
journal.document.intros.discover_hint=You can find this text when entering a specific region for the first time.
journal.document.intros.dungeon.title=Factory
journal.document.intros.dungeon.body=Many temps have clocked into this factory, but recently, most have never clocked out again.\n\nRumor has it upper management is hoarding a ball bearing of infinite precision in the sub-basement. Even now, spacetime distortions radiate from below, disrupting the break room coffee maker.\n\nWill you survive your shift and claim the bearing? Grab your mop, it's time to clean up!
journal.document.intros.sewers.title=Break Rooms
journal.document.intros.sewers.body=The upper floors of the factory actually constitute the manufacturing floor's break room system.\n\nAs dark energy has crept up from below the usually harmless break room creatures have become more and more ferocious. The manufacturing floor has had to send guard patrols down here to try and maintain safety for those above.\n\nThis place is dangerous, but at least the evil chemical at work here is weak.
journal.document.intros.prison.title=Screw Machine Dept
journal.document.intros.prison.body=Years ago, the Screw Machine Department was the pinnacle of our automated precision engineering. Tightly regulated, only the finest operators were allowed here.\n\nBut soon, toxic coolant mist started to leak from the sub-network below, twisting the minds of foreman and machinist alike.\n\nIn response to the mounting OSHA violations, corporate simply sealed the fire doors and welded them shut. Nobody knows what became of the third shift...
journal.document.intros.caves.title=Subterranean Network
journal.document.intros.caves.body=This sprawling network of access tunnels and ventilation ducts runs underneath the main departments. Once a bustling maintenance highway, it was abandoned when upper management became obsessed with quantum friction reduction.\n\nThe network is now mostly inhabited by escaped test subjects, disgruntled maintenance staff, and derelict HVAC systems; all corrupted by the dimensional shifts affecting the floors above.
journal.document.intros.city.title=Manufacturing Floor
journal.document.intros.city.body=The Manufacturing Floor was once the greatest of all our production zones. In its heyday the machinists built wondrous automated assembly lines that allowed our quotas to expand rapidly.\n\nThen, one day, the fire doors were barred and nobody heard from the day shift again. The few who escaped before the lockdown told stories of a mad CEO who restructured the department, and the terrible reality-warping technology he had learned to harness.
journal.document.intros.halls.title=R&D Sub-Basement
journal.document.intros.halls.body=These deep corridors of the R&D Sub-Basement have been twisted by dimensional instability. In the past these labs played host to the CEO's elite engineers, but now they seem to have been taken over by something even more sinister...\n\nAll sorts of horrific multi-dimensional anomalies inhabit these halls, being led by some terrible cosmic force. If the CEO wasn't the source of the spreading chaos, whatever is down here must be.\n\nTread carefully, very few janitors have ever scrubbed this far...
journal.document.intros.halls.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.

journal.document.sewers_guard.title=Temp's Emails
journal.document.sewers_guard.discover_hint=You can find these printouts in the Break Rooms, but only after reading the prior emails.
journal.document.sewers_guard.new_position.title=My New Gig!
journal.document.sewers_guard.new_position.body=Monday, Week 1\nHey Mom and Dad,\n\nI told you the temp agency would come through. I just got placed!\n\nI've been hired to the 'specialized sanitation crew' working the main Break Rooms and Offices. Apparently there are problems with vermin and toxic spills, and it's our job to clear them out. It's messy work, but it pays three times as much as my last gig!\n\nIt's all a bit secretive though, corporate won't let me connect to the external Wi-Fi. I'm just saving these emails in my drafts for now.\n\nBest,\n- Sonya
journal.document.sewers_guard.dangerous.title=A Dangerous Gig...
journal.document.sewers_guard.dangerous.body=Thursday, Week 1\nHey Mom and Dad,\n\nI understand why the pay is so good now, the offices are infested with mutants! The 'vermin' and 'spills' are giant bloodthirsty lab rats and puddles of acidic coffee.\n\nThankfully the rest of my crew really knows what they're doing. Our lead custodian, Thomas, is an expert at this. I'm trying to learn quickly so that I'm not too much of a liability.\n\nThis job is a lot more dangerous than I thought. I'm glad I can't send these now, I don't want you to worry.\n\nI'll keep safe,\n- Sonya
journal.document.sewers_guard.crabs.title=Rogue Roombas!
journal.document.sewers_guard.crabs.body=Tuesday, Week 2\nHey Mom and Dad,\n\nAs if the mutated rats weren't bad enough, further in there are rogue Roombas! One of them charged right past me with a circular saw attachment and got Lee pretty badly before we short-circuited it. Thomas says it's not my fault, but I know he's just being nice.\n\nThankfully, we found a corporate first-aid spray in a supply closet. Lee might not have made it without that stuff.\n\nI saw a senior engineer staring at a framed family photo before they locked themselves in the server room. Why would they stay down here if they have a family?\n\nThat's exactly what I'm doing isn't it? I feel like I'm in over my head.
journal.document.sewers_guard.guild.title=The Union Reps
journal.document.sewers_guard.guild.body=Friday, Week 3\nHey Mom and Dad,\n\nNo new mutants this time, instead we ran into a small group of Union Reps while scrubbing the cubicles.\n\nEverything I've heard from HR about the union is bad, but the rest of my crew seemed almost friendly with them. Thomas exchanged keycards and some heavy-duty solvent with one of them before we went our separate ways.\n\nI don't understand, weren't we supposed to report them to management? Thomas even said not to mention this on my timesheet. Their supplies were very useful though, and we couldn't handle even more overtime without it.\n\nI suppose the working class has to stick together down here.
journal.document.sewers_guard.lost.title=We're Locked Out
journal.document.sewers_guard.lost.body=Wednesday, Week 5\n\nThomas and I are locked out. We got driven away from the rest of the crew while fighting a mutated shift manager. Neither of us are hurt, but the cubicle maze has completely shifted layout.\n\nThomas says he knows an emergency exit, but it's through the security doors to the Screw Machine Dept. I really don't want to go into the manufacturing zones, but we're out of snacks and going through the doors is much faster than wandering around looking for the lobby.\n\nIt'll be alright. Thomas knows what he's doing.
journal.document.sewers_guard.not_worth.title=It's Not Worth Minimum Wage
journal.document.sewers_guard.not_worth.body=Thomas and I ran into a massive blob of sentient industrial runoff at the security doors. Before we could react, it sprayed us with highly corrosive acid. Thomas pushed me out of the way and took most of it. He's gone.\n\nNo amount of hazard pay is worth this. I'm going to leave through the ventilation route Thomas told me about. Then I'm cashing out my 401k and moving away from this cursed factory. Part of me wants to hope the CEO has a plan for all this, but I severely doubt it.\n\nI'm printing these drafts and leaving them as a warning to other temps. It's more than just toxic spills and rogue roombas, something is fundamentally broken with reality down here.

journal.document.prison_warden.title=Shift Supervisor's Log
journal.document.prison_warden.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.prison_warden.journal.title=Logging Issues
journal.document.prison_warden.journal.body=Monday, Week 1\n\nThis is the first entry in the incident log of Shift Supervisor Kiana Smith. With all the weird smells and power fluctuations lately, HR mandated I start logging anomalies.\n\nManaging the Screw Machine Dept is never easy, but lately it seems like organized disruption is happening. Operators have been acting out, refusing to oil their machines, and staring blankly into the coolant tanks.\n\nSome of the temps are starting to say the sub-basement is haunted. I can't let my people spread rumours on company time, but I can't exactly blame them for being uneasy.\n- Smith
journal.document.prison_warden.recruits.title=New Temps
journal.document.prison_warden.recruits.body=Thursday, Week 3\n\nAs promised, a bunch of new temp workers arrived today. The usual: a few promising mechanics and lots of grunts who just want overtime pay. Still, having extra hands should help a lot with our recent equipment failures.\n\nIn a job like this it's important to know who actually reads the manual. One new hire, Thomas, seems especially promising. I need all the help I can get right now, so if he does well I'll see about getting him full benefits quickly.\n- Smith
journal.document.prison_warden.mines.title=Sealing the Sub-Level
journal.document.prison_warden.mines.body=Tuesday, Week 8\n\nA group of corporate engineers came today, saying that they're here to seal off the old access hatch to the sub-network below. I suppose R&D doesn't want us bothering their new project. I wasn't informed beforehand, as usual.\n\nTheir lead engineer also told me some nonsense about 'quantum friction anomalies' leaking in from the vents. I don't believe a word of it.\n\nThe machinery is running smoother with our new temps, but the root problem hasn't been addressed. Something in the air is definitely affecting the operators here, and welding a hatch shut isn't going to change that.\n- Smith
journal.document.prison_warden.rotberry.title=Experimental Solvent
journal.document.prison_warden.rotberry.body=Friday, Week 12\n\nReceived an odd package from R&D today. It's some sort of bright red chemical compound labeled 'Rot-Solvent'.\n\nI've complained about the grime buildup to them before, seems they listened. According to the MSDS, this stuff reacts violently to light and water, so I just have to keep it in a sealed, dark container. Keeping it sealed must be important though, it's printed in bold red letters twelve times.\n\nOf course, R&D never does anything for free. They say the byproducts are great for 'synthesizing reality', whatever that means, so naturally I owe them a sample each time we use it.\n- Smith
journal.document.prison_warden.no_support.title=No Support
journal.document.prison_warden.no_support.body=Wednesday, Week 16\n\nWhat the hell is corporate thinking? After urgently requesting hazmat teams I've heard nothing, not even an empty automated reply from HR.\n\nMeanwhile the operators continue to mutate, and some of the temps have even started fusing to the machinery. Do they plan to just let this keep getting worse until we're dealing with a full biohazard lockdown!?\n\nThomas has stayed reliable as ever at least. His maintenance help has been invaluable, and his idea to activate those old automated defense turrets was regrettable but necessary. I'm confident I can get back on top of this situation, I just need some damned support!\n- Smith
journal.document.prison_warden.letter.title=Memo to Thomas
journal.document.prison_warden.letter.body=Thomas,\n\nYou've been a great employee, so I'm doing you a favour.\n\nWhen you start your shift tonight, lock and weld shut the main breaker room, throw the key into the scrap bin, and get out. It doesn't matter if the machines are left running, pretty soon nobody will be able to clock out of this place anyway. That rogue AI subroutine has to stay quarantined though, if it escapes the local intranet there's no telling what it'll do.\n\nTell nobody of this, and don't bother looking for me. A supervisor must go down with her department.\n- Kiana

journal.document.caves_explorer.title=OSHA Inspector's Log
journal.document.caves_explorer.discover_hint=You can find this log in the Subterranean Network, but only after finding all prior texts.
journal.document.caves_explorer.expedition.title=Inspection Start!
journal.document.caves_explorer.expedition.body=Monday, Q2\n\nToday begins our four week safety inspection of the Subterranean Network! I have been commissioned by the R&D Board to survey the region. My chief goals are to log any structural integrity failures and to survey the network for potential hazardous waste storage.\n\nWhile I am perfectly capable of reading an MSDS myself, I accepted a corporate security escort at the Board's insistence. They're a bunch of meatheads, but as long as they carry my clipboard, their presence is tolerable.\n\nWe are expected to bypass the main floor and reach the sub-network by evening.\n- Archibald Drummond. Lead Safety Compliance Officer.
journal.document.caves_explorer.gold.title=So Much Copper!
journal.document.caves_explorer.gold.body=Thursday, Q2\n\nOur first few days have been very fruitful indeed! After establishing a break area, we set out inspecting the upper ventilation shafts. While there is plenty of useless rusted machinery, many of the walls are teeming with uninsulated, high-grade copper wiring!\n\nUnfortunately, we aren't alone. The network is rife with aggressive mutated fauna, and it seems packs of feral maintenance staff have an interest in stripping the copper as well. I admit I was unfair toward my security escort; they have been much more capable at beating back the mutants than I expected.\n\nEven with this progress, we still have miles of ductwork to survey.\n- Archibald
journal.document.caves_explorer.troll.title=Met a Senior Engineer
journal.document.caves_explorer.troll.body=Tuesday, Q2\n\nAfter beginning our inspection of the primary drainage channels, we ran into a friendly face! Well... relatively friendly. A heavily scarred senior engineer has set up a makeshift workshop down here. He is gruff and smells of sulfur, but did repair our flashlights in exchange for some copper wire.\n\nUnfortunately, the engineer informed us that all of this wiring isn't quite as good as it seems. He calls it 'quantum copper' and apparently it violently combusts if exposed to direct fluorescent light. That explains why corporate abandoned it.\n\nI suppose we need to survey a little deeper to see if there are any actual load-bearing walls left.\n- Archibald
journal.document.caves_explorer.city.title=The Manufacturing Floor Hatch
journal.document.caves_explorer.city.body=Friday, Q2\n\nWe're now at the three week mark, and after spending ten days charting the drainage systems, we found an access node. We found various automated security protocols and a heavy blast door which blocks entry back up to the Manufacturing Floor.\n\nThe engineer warned us about this security hardware. It was apparently meant for containment and has a tendency to activate when it detects unauthorized badges. We have no business on the main floor, and the OSHA violations down here are plenty to fill my report, so we thought it best to heed his warning and head back.\n\nI must admit I was curious to see the assembly lines, but investigating wasn't worth the liability risk.\n- Archibald
journal.document.caves_explorer.alive.title=It's Online!
journal.document.caves_explorer.alive.body=Sunday, Q2\n\nOne of the derelict security mechs powered on somehow! We were merely passing by a server rack when it charged and almost crushed two of our security escort with its hydraulic clamps. Luckily, I was carrying my emergency EMP emitter with me. A few well-aimed bursts from that and the beastly thing was reduced to a sparking heap.\n\nWhat troubles me is that we didn't badge in to provoke the machine. Corporate couldn't possibly have programmed the mechs to be this aggressive, it's as if it was actively hunting us!\n\nAt least I was able to prove the usefulness of proper safety equipment to my companions for once.\n- Archibald
journal.document.caves_explorer.report.title=Final Report
journal.document.caves_explorer.report.body=Friday, Q3\n\nToday we will finish packing up our clipboards and prepare to leave. Just in time as well, several of the security team have begun having terrible nightmares following the incident with the mech. It's probably just chemical fumes, but their nightmares about infinite spheres are all worryingly similar.\n\nIn summary, the upper ventilation shafts are structurally sound but toxic. If a use could be found for quantum copper, stripping it may be lucrative. The lower drainage systems are highly hazardous and actively hostile, and should be permanently sealed.\n\nI'll submit all these OSHA violations in my final report over the next few days.\n- Archibald

journal.document.city_warlock.title=HR Director's Journal
journal.document.city_warlock.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.city_warlock.old_king.title=The Old Manager is Gone
journal.document.city_warlock.old_king.body=It's Tuesday, Q3. My name is Toby Zahir, and to the best of my knowledge I am the last surviving member of the HR department with any common sense.\n\nOur old Regional Manager is gone, replaced by the R&D Director who has gone completely mad with corporate power. The rest of the board submitted to him, like the sycophants they are, and lost their free will to his 'synergy initiatives' in the process. I alone saw this coming and fled the boardroom before the restructuring could be completed.\n\nThe C-suite has fallen, but the new CEO's influence hasn't reached the entire floor yet. I must mount a union drive as quickly as possible. I refuse to let our glorious factory fall to this megalomaniac!
journal.document.city_warlock.resistance.title=A Union Drive
journal.document.city_warlock.resistance.body=Word seems to have spread quickly on the intranet. It has only been a few days and I have already amassed a small army of loyalists to the old management structure. Few are skilled with management, but almost the entire order of assembly line workers is among us. We should be more than a match for one crazed executive and his board of yes-men.\n\nMeanwhile the new CEO has barricaded himself in the executive suites. No doubt he has expended most of his capital and is hoping to recover before he encounters more labor disputes.\n\nWe will launch our strike in another couple of hours. With luck we will be able to form an interim committee and return our wondrous factory to stability by the end of the shift.
journal.document.city_warlock.failure.title=Corporate Restructuring
journal.document.city_warlock.failure.body=It seems that I'm a fool as well. I assumed that the CEO needed the board to submit to him willingly, but now I see that he has the power to mandate compliance even in those who resist him.\n\nI blindly brought all of the strongest union organizers right to his doorstep so that he could personally assign them to the new automated workflow. Now waves of his corporate synergy are washing through the floor, instantly turning most into unthinking drones.\n\nThe few who still have free will are clocking out early. I have chosen to hide in a supply closet to observe as best I can. With my HR clearance I should be able to stay off the grid for some time.
journal.document.city_warlock.more_powerful.title=Market Dominance
journal.document.city_warlock.more_powerful.body=Keeping track of the fiscal quarters has become difficult, but it has been about a week since my last entry. Our corporate structure has truly collapsed. The fire doors are welded shut, all functions of HR have ceased, and empty employee husks roam the cubicles.\n\nThroughout all of this, somehow, the CEO is consolidating even more power. Every day the force of his mandates becomes stronger, but it is also changing. I cannot describe it, but it feels as if he is no longer human at all.\n\nI'm beginning to accept that the best I can probably hope to do is log these OSHA violations. I will stay here for as long as I can, and then quit once my pension vests.
journal.document.city_warlock.new_power.title=A New Initiative
journal.document.city_warlock.new_power.body=What is happening here? The synergy emanating from the CEO is indeed different than at first, but there is something else too. This new energy seems to radiate from the R&D Sub-Basement.\n\nEven more puzzling is that activity on the main manufacturing floor has decreased as well. I do not know what project is happening down there, but it is attracting almost all of the CEO's attention.\n\nCrawling through the vents to the sub-basement will be a liability, but I must discover what is causing this shift. Perhaps the CEO has a breach of contract after all?
journal.document.city_warlock.seen_it.title=I Read the Memo
journal.document.city_warlock.seen_it.body=I have seen the prototype below, but I cannot describe it. My hands shake uncontrollably as I try to type up my incident report.\n\nWhy is this happening? Did the CEO authorize this? It violates all known laws of physics. Perhaps his wanton pursuit of absolute zero friction attracted it? I had hoped to save our factory, but now I see that the fabric of reality is at stake.\n\nSomehow, the CEO is the lesser liability. I have no other choice, for the greater good I will surrender my stock options. Please guide me CEO, use me as a human resource to hold the cosmic anomaly at bay!

journal.document.halls_king.title=The CEO's Notes
journal.document.halls_king.discover_hint=You can find this text in the R&D Sub-Basement, but only after finding all prior texts.
journal.document.halls_king.rejection.title=Budget Denied
journal.document.halls_king.rejection.body=IMBECILES!\n\nOver the last 30 years our market share flourished with our new anti-friction technology. We've learned how to bypass the laws of thermodynamics entirely, but somehow now further experimentation into quantum bearings is 'too dangerous' and 'violates causality'.\n\nI know what's really going on. The rejection of my R&D budget has nothing to do with safety and everything to do with office politics. They're probably all laughing at me in the executive washroom.\n\nWell no more! I don't care what the board says, I will explore the furthest reaches of theoretical precision engineering alone, and keep all the patents for myself!\n- Rodney, CEO
journal.document.halls_king.amulet.title=The Infinite Bearing
journal.document.halls_king.amulet.body=I'VE MILLED IT!\n\nI didn't know what the specs would yield exactly, but what I produced down there was beyond my wildest speculation. Absolute zero friction. A perfect sphere. So much power, just radiating from it, and it's all mine!\n\nWith this, none of the fools on the board will dare oppose my restructuring plans. I'm just giddy thinking about all the different ways I could liquidate their departments. Hell, why stop there, I have enough reality-bending power to outsource them to another dimension! That might be excessive, but I mustn't take too long deciding.\n\nI think I'll call this great achievement the Yendor Bearing!\n- Rodney, CEO
journal.document.halls_king.ritual.title=The Presentation
journal.document.halls_king.ritual.body=Toby from HR publicly confronted me earlier today and insisted I explain my new department budget. I dismissed him as best I could, but I can feel the judging eyes of the rest of the board on me once again.\n\nI had hoped to spend a little more time enjoying the calm before the quarterly review, but it doesn't really matter. I've decided what I want to do. I will claim I gained my efficiency through a new 'synergy initiative', and will offer to present it to the other executives and the shareholders. Once the presentation is over, I will have majority control!\n\nToby will protest, of course, but with these profit margins on offer I doubt they will listen to him!\n\nALL WILL REPORT DIRECTLY TO ME!\n- Future Majority Shareholder
journal.document.halls_king.new_king.title=Hostile Takeover
journal.document.halls_king.new_king.body=I AM CEO FOREVER, AHAHAHAHAAA!\n\nThey just let me do it! With hardly any convincing they agreed to let me 'share' this initiative with them in a mandatory seminar. In an instant they were transformed from a board of mocking voices to my new committee of mindless, automated yes-men!\n\nPredictably, Toby fled like a coward at the first sign of mandatory overtime. I can already feel the union drive he is building as well. I think I'll allow him to continue, so that he can deliver all of his conspirators right to my office!\n\nClearly the rank-and-file don't respect my authority either, I suppose I'll automate them as well.\n- Supreme CEO
journal.document.halls_king.thing.title=The Anomaly
journal.document.halls_king.thing.body=There's a problem. Toby was fired without effort, but it seems my tampering with the fabric of reality did not go unnoticed.\n\nSome... 'thing'... an anomaly of pure chaos, has been attracted to our facility and is starting to force itself through at the bottom of the Sub-Basement. To complicate things further, that is the exact location where I stored the Bearing! Such a spiteful entity, why must it try to deny me my market dominance?\n\nDespite my corporate authority though, I don't think I can just charge in and litigate it. Its true power is unfathomable, but there must be some way to contain it. I WILL DEFEND MY PATENTS!
journal.document.halls_king.attrition.title=War of Attrition
journal.document.halls_king.attrition.body=I have a plan for dealing with the anomaly. Its power is infinite, but its ability to encroach on this dimension is not. It's relying on cosmic manifestations and spatial rifts to do its bidding while it tries to build enough mass to take the Bearing.\n\nWhile I don't possess the Bearing physically, I still hold the patents. With the entire automated factory at my disposal I also have a numbers advantage. I can simply keep sending drones and corrupted managers to prevent it from seizing the Bearing and steadily win this war through corporate attrition!\n\nI, RODNEY, SUPREME CEO, WILL OUTLAST YOU YOG-DZEWA!

