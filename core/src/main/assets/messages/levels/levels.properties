###features
levels.features.chasm.chasm=Ventilation Shaft
levels.features.chasm.yes=Yes, I know what I'm doing
levels.features.chasm.no=No, I changed my mind
levels.features.chasm.jump=Do you really want to jump down the ventilation shaft? You're not a ferret, a fall that far will be painful.
levels.features.chasm.ondeath=You plummeted to a workplace fatality...
levels.features.chasm.rankings_desc=Died on Impact



###rooms
levels.rooms.special.magicalfireroom$eternalfire.desc=A wall of dense, bright green chemical fire is here, completely violating OSHA regulations. It's so dense that you can't move through it, and it melts anything that gets too close. It shows no signs of burning out naturally, you'll need to use some industrial solvent or coolant to extinguish it.

levels.rooms.special.sentryroom$sentry.name=automated security turret
levels.rooms.special.sentryroom$sentry.desc=This security turret seems to be positioned here to guard the executive supplies at the other end of this room. It will fire beams of highly concentrated laser-light at you if you step in its scanning area.\n\nIt's immune to most janitorial supplies and its thermal sensors see right through camouflage, but its old capacitors take a while to charge before firing.\n\nSomehow the turret only wants to fire on you, probably because your employee badge expired.
levels.rooms.special.sentryroom$sentry.discover_hint=You can find this malfunctioning hardware anywhere in the factory.

levels.rooms.special.toxicgasroom$toxicvent.name=chemical vent
levels.rooms.special.toxicgasroom$toxicvent.desc=A careless temp worker must have ruptured this chemical line during the incident. It's still spewing toxic gas into the room and shows no signs of stopping. You'll need some heavy-duty PPE if you want to clean up this room.

levels.rooms.special.weakfloorroom$hiddenwell.name=Distant well
levels.rooms.special.weakfloorroom$hiddenwell.desc=You can just make out a well in the depths below, perhaps there is something down there?

levels.rooms.quest.ambitiousimproom$questentrance.name=Vault Entrance
levels.rooms.quest.ambitiousimproom$questentrance.desc=This ominous pit seems to be the entrance to some ancient dwarven vault. A magical barrier prevents entry, you can walk over top of it as if there was floor here.

levels.rooms.quest.blacksmithroom$questentrance.name=Mine entrance
levels.rooms.quest.blacksmithroom$questentrance.desc=This ladder leads to an old mine just below the blacksmith's workshop.

levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritual marker
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=A painted marker for some dark ritual. Candles are usually placed on the four corners.

levels.rooms.quest.massgraveroom$bones.name=Mass grave
levels.rooms.quest.massgraveroom$bones.desc=Bones litter the floor, what happened here?

levels.rooms.quest.mineentrance$questexit.name=Mine exit
levels.rooms.quest.mineentrance$questexit.desc=This ladder leads out of the mine, back into the blacksmith's workshop.

###traps
levels.traps.alarmtrap.name=alarm trap
levels.traps.alarmtrap.alarm=The trap emits a piercing sound that echoes throughout the dungeon!
levels.traps.alarmtrap.desc=This trap seems to be tied to a loud alarm mechanism. Triggering it will likely alert everything on the level.

levels.traps.blazingtrap.name=blazing trap
levels.traps.blazingtrap.desc=Stepping on this trap will ignite a powerful chemical mixture, setting a wide area ablaze.

levels.traps.burningtrap.name=burning trap
levels.traps.burningtrap.desc=Stepping on this trap will ignite a chemical mixture, setting the surrounding area aflame.

levels.traps.chillingtrap.name=chilling trap
levels.traps.chillingtrap.desc=When activated, chemicals in this trap will rapidly freeze the air around its location.

levels.traps.confusiontrap.name=confusion gas trap
levels.traps.confusiontrap.desc=Triggering this trap will set a cloud of confusion gas loose within the immediate area.

levels.traps.cursingtrap.name=cursing trap
levels.traps.cursingtrap.curse=Your worn equipment becomes cursed!
levels.traps.cursingtrap.desc=This trap contains the same malevolent magic found in cursed equipment. Triggering it will curse some items in the immediate area.

levels.traps.disarmingtrap.name=disarming trap
levels.traps.disarmingtrap.disarm=Your weapon is teleported away!
levels.traps.disarmingtrap.desc=This trap contains very specific teleportation magic, which will warp the weapon of its victim to some other location.

levels.traps.disintegrationtrap.name=disintegration trap
levels.traps.disintegrationtrap.one=The trap disintegrates your %s!
levels.traps.disintegrationtrap.some=The trap disintegrates some of your %s!
levels.traps.disintegrationtrap.ondeath=You were killed by the disintegration trap...
levels.traps.disintegrationtrap.desc=When triggered, this trap will lance the nearest target with beams of disintegration, dealing significant damage and destroying items.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.distortiontrap.name=distortion trap
levels.traps.distortiontrap.desc=Built from strange magic of unknown origin, this trap will summon all manner of creatures to this location.

levels.traps.explosivetrap.name=explosive trap
levels.traps.explosivetrap.desc=This trap contains some powdered explosive and a trigger mechanism. Activating it will cause an explosion in the immediate area.

levels.traps.flashingtrap.name=flashing trap
levels.traps.flashingtrap.desc=On activation, this trap will ignite a potent flashing powder stored within, temporarily blinding, crippling, and injuring its victim.\n\nThe trap must have a large store of powder, as it can activate many times without breaking.

levels.traps.flocktrap.name=flock trap
levels.traps.flocktrap.desc=Perhaps a joke from some amateur mage, triggering this trap will create a flock of magical sheep.

levels.traps.frosttrap.name=frost trap
levels.traps.frosttrap.desc=When activated, chemicals in this trap will rapidly freeze the air in a wide range around its location.

levels.traps.gatewaytrap.name=gateway trap
levels.traps.gatewaytrap.desc=This special teleportation trap can activate an infinite numbers of times and always teleports to the same location.

levels.traps.geysertrap.name=geyser trap
levels.traps.geysertrap.desc=When triggered, this trap will cause a geyser of water to spew forth, damaging fiery enemies, knocking away all nearby characters, dousing fires, and converting the surrounding terrain to water.

levels.traps.gnollrockfalltrap.name=gnoll rockfall trap
levels.traps.gnollrockfalltrap.desc=This rockfall trap is made with some form of magical assistance. When triggered, it will cause rocks to loosen and immediately fall from above in a 5x5 area around it. Due to the softer rocks in the area, it won't deal as much damage as a regular rockfall trap, but your armor also won't be effective against it. Rocks also won't fall in locations with an adjacent barricade, as they help hold the ceiling up.\n\n_This trap can't tell friend from foe, and so is just as harmful to the gnolls as it is to you._

levels.traps.grimtrap.name=grim trap
levels.traps.grimtrap.ondeath=You were killed by the blast of a grim trap...
levels.traps.grimtrap.desc=Extremely powerful destructive magic is stored within this trap, enough to instantly kill all but the healthiest of heroes. Triggering it will send a ranged blast of lethal magic towards the nearest character.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.grippingtrap.name=gripping trap
levels.traps.grippingtrap.desc=This trap latches onto the feet of whoever trigger it, damaging them and slowing their movement.\n\nDue to its simple nature, this trap can activate many times without breaking.

levels.traps.guardiantrap.name=guardian trap
levels.traps.guardiantrap.alarm=The trap emits a piercing sound that echoes throughout the dungeon!
levels.traps.guardiantrap.desc=This trap is tied to a strange magical mechanism, which will summon guardians and alert all enemies on the floor.
levels.traps.guardiantrap$guardian.name=summoned guardian
levels.traps.guardiantrap$guardian.desc=This blue apparition seems to be a summoned echo of one of the dungeon's stone guardians.
levels.traps.guardiantrap$guardian.desc_weapon=While the statue itself is almost incorporeal, the _%s_ it's wielding looks real.
levels.traps.guardiantrap$guardian.discover_hint=You can find this enemy with a specific trap.

levels.traps.oozetrap.name=ooze trap
levels.traps.oozetrap.desc=This trap will splash out caustic ooze when activated, which will burn until it is washed away.

levels.traps.pitfalltrap.name=pitfall trap
levels.traps.pitfalltrap.triggered_hero=The ground starts to give way around you!
levels.traps.pitfalltrap.triggered=The ground starts to give way around the triggered trap!
levels.traps.pitfalltrap.no_pit=the ground is too solid for a pitfall trap to work here.
levels.traps.pitfalltrap.desc=This trap is connected to a large trapdoor mechanism, and shortly after it is triggered anything near it will slip right through the ground and fall! It won't work in areas with especially solid floors though.

levels.traps.poisondarttrap.name=poison dart trap
levels.traps.poisondarttrap.ondeath=You were killed by the poison dart trap...
levels.traps.poisondarttrap.desc=A small dart-blower must be hidden nearby, activating this trap will cause it to shoot a poisoned dart at the nearest target.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.rockfalltrap.name=rockfall trap
levels.traps.rockfalltrap.ondeath=You were crushed by the rockfall trap...
levels.traps.rockfalltrap.desc=This trap is connected to a series of loose rocks above, triggering it will cause them to come crashing down over the entire room! If the trap isn't in a specific room, rocks will fall in an area around the trap instead.\n\nThankfully the trigger mechanism isn't hidden.

levels.traps.shockingtrap.name=shocking trap
levels.traps.shockingtrap.desc=A mechanism with a large amount of energy stored into it. Triggering this trap will discharge that energy into a field around it.

levels.traps.stormtrap.name=storm trap
levels.traps.stormtrap.desc=A mechanism with a massive amount of energy stored into it. Triggering this trap will discharge that energy into a large electrical storm.

levels.traps.summoningtrap.name=summoning trap
levels.traps.summoningtrap.desc=Triggering this trap will summon a number of this area's monsters to this location.

levels.traps.teleportationtrap.name=teleportation trap
levels.traps.teleportationtrap.desc=Whenever this trap is triggered, everything around it will be teleported to random locations on this floor.

levels.traps.tengudarttrap.desc=Tengu has clearly been preparing for a fight. This trap will activate a hidden dart blower which will shoot a poison dart at the nearest thing that isn't Tengu.\n\nThe trap is so well made that the trigger mechanism is impossible to detect without magical aid. However the trap is visible for a moment when it is being set.

levels.traps.toxictrap.name=toxic gas trap
levels.traps.toxictrap.desc=Triggering this trap will set a cloud of toxic gas loose within the surrounding area.

levels.traps.trap.discover_hint=You can find this trap randomly in the dungeon. Each region has different traps that may appear.
levels.traps.trap.rankings_desc=Killed by: %s

levels.traps.corrosiontrap.name=corrosive gas trap
levels.traps.corrosiontrap.desc=Triggering this trap will set a cloud of deadly acidic gas loose within the immediate area.

levels.traps.warpingtrap.name=warping trap
levels.traps.warpingtrap.desc=This trap is similar to a teleportation trap, but will also cause the hero to lose their knowledge of the floor's layout!

levels.traps.weakeningtrap.name=weakening trap
levels.traps.weakeningtrap.desc=Dark magic in this trap sucks the energy out of anything that comes into contact with it. Powerful enemies may resist the effect, however.

levels.traps.worndarttrap.name=worn dart trap
levels.traps.worndarttrap.ondeath=You were killed by the worn dart trap...
levels.traps.worndarttrap.desc=A small dart-blower must be hidden nearby, activating this trap will cause it to shoot at the nearest target.\n\nDue to its age it's not very harmful though, it isn't even hidden...



###levels
levels.cavesbosslevel.wires_name=Exposed wiring
levels.cavesbosslevel.wires_desc=The ground is partially dug up here, showing some large exposed wires. They must be connecting the various electrical machines together.\n\nThe wires must have some current running through them. If DM-300 steps here it may be able to draw power from them.
levels.cavesbosslevel.energy_desc=The ground here is sparking with electricity, and is harmful to step on. _The sparks seem to be gravitating in a certain direction..._ perhaps they lead to the power source?
levels.cavesbosslevel.gate_name=Metal gate
levels.cavesbosslevel.gate_desc=A heavy blast door that blocks the path into the main manufacturing floor. The control box in the center is producing a loud humming noise, connected to the rogue machinery nearby. Perhaps dismantling DM-300 will short the circuit and open the door?
levels.cavesbosslevel.gate_desc_broken=The door must have been connected to DM-300 in some way, as the locking mechanism blew when DM-300 short-circuited. Now it's stuck open.
levels.cavesbosslevel.water_desc=With all the electricity around here water might not always be safe...

levels.citybosslevel.throne_name=Executive Chair
levels.citybosslevel.throne_desc=This impressively ergonomic chair is the seat of the regional manager, now taken over by a power-mad CEO.\n\nThere seems to be some mechanical parts to the chair, the CEO may have additional bureaucratic authority when sitting on it.
levels.citybosslevel.summoning_name=Pneumatic dispatch tube
levels.citybosslevel.summoning_desc=This large dispatch tube connects directly to the HR department, which is practically radiating with corporate synergy.\n\nThe CEO uses these tubes to rapidly deploy middle management to the floor. The tube's pressure must build for a few turns before the employee appears, and the type of employee is telegraphed by the color of the incoming capsule.

levels.caveslevel.grass_name=Bioluminescent mold
levels.caveslevel.high_grass_name=Mutated fungi
levels.caveslevel.water_name=Coolant fluid
levels.caveslevel.entrance_desc=The service ladder leads back up to the main manufacturing floor.
levels.caveslevel.exit_desc=The service ladder leads deeper into the subterranean network.
levels.caveslevel.high_grass_desc=Overgrown mutated fungi block the view.
levels.caveslevel.wall_deco_desc=Some exposed wiring and copper piping run along the wall.
levels.caveslevel.bookshelf_desc=Who put a filing cabinet in the access tunnels?
levels.caveslevel.region_deco_name=Industrial Support Beam
levels.caveslevel.region_deco_desc=A massive steel I-beam, heavily oxidized but still holding the ceiling up. You can see bundles of thick networking cables running along the top.

levels.citylevel.water_name=Industrial runoff
levels.citylevel.high_grass_name=Aggressive corporate ferns
levels.citylevel.entrance_desc=The fire doors lead back to the previous department.
levels.citylevel.exit_desc=The fire doors lead forward into the next department.
levels.citylevel.deco_desc=The linoleum flooring is completely torn up here.
levels.citylevel.sp_desc=Thick, mildly stained corporate carpeting covers the floor.
levels.citylevel.statue_desc=The display model depicts a perfectly spherical ball bearing.
levels.citylevel.bookshelf_desc=Rows of OSHA manuals and technical specifications fill the filing cabinet.
levels.citylevel.region_deco_name=Overheating Server Rack
levels.citylevel.region_deco_desc=A server rack emitting a bright green, solid-looking chemical flame. It's definitely not supposed to do that.

levels.citylevel.upcoming_quest_intro_title=Developer Message
levels.citylevel.upcoming_quest_intro_body=The next major update to Shattered Pixel Dungeon will feature an overhaul to the quest given by the Ambitious Imp! This quest will task you with raiding an ancient dwarven vault, that you're currently standing on top of the entrance for.\n\nCurrently the new quest area is pretty empty, but you're welcome to go down and look around, both to test the new area and give early feedback!\n\nOne of the quest's mechanics is that none of your items will come with you, so when descending you'll temporarily lose your items and _will be given an escape crystal that lets you return._ Hunger and regeneration effects will also be paused.\n\n- Evan
levels.citylevel.upcoming_quest_intro_yes=Descend into the vault
levels.citylevel.upcoming_quest_intro_no=Stay here

levels.hallslevel.water_name=Slag
levels.hallslevel.grass_name=Smoldering synthetic turf
levels.hallslevel.high_grass_name=Melting plastic foliage
levels.hallslevel.statue_name=Structural column
levels.hallslevel.water_desc=It looks like molten metal, but it's cooled slag and probably safe to touch.
levels.hallslevel.statue_desc=The column is reinforced with what looks suspiciously like compressed human resources. Yikes.
levels.hallslevel.bookshelf_desc=Top secret R&D files are smoldering in the filing cabinet.
levels.hallslevel.region_deco_name=Collapsed ductwork
levels.hallslevel.region_deco_desc=A huge section of HVAC ducting that collapsed from the ceiling under its own weight.


levels.level.hidden_trap=A hidden %s activates!
