levels.level.chasm_desc=You can't see the bottom.
levels.level.water_desc=In case of burning step into the water to extinguish the fire.
levels.level.entrance_desc=The security doors lead back to the previous sector.
levels.level.exit_desc=The security doors lead forward into the next sector.
levels.level.embers_desc=Embers cover the floor.
levels.level.high_grass_desc=Dense vegetation blocks the view.
levels.level.locked_door_desc=This door is locked, you need a matching key to unlock it.
levels.level.crystal_door_desc=This locked door is made of magical crystal. You can see through, but you'll need a crystal key to open it.
levels.level.locked_exit_desc=A security gate blocks the stairs leading further in.
levels.level.barricade_desc=The wooden pallets are firmly stacked and completely dry. Might they burn?
levels.level.inactive_trap_desc=The trap has been triggered before and it's not dangerous anymore.
levels.level.statue_desc=A motivational corporate poster hangs here. It fails to motivate.
levels.level.alchemy_desc=This industrial mixer is filled with a volatile solvent base. Chemicals and supplies can be mixed here to synthesize new solutions!
levels.level.empty_well_desc=The well has run dry.

levels.level$feeling.chasm_title=open floorplan
levels.level$feeling.water_title=flooded department
levels.level$feeling.grass_title=overgrown sector
levels.level$feeling.dark_title=power outage
levels.level$feeling.large_title=sprawling department
levels.level$feeling.traps_title=osha violation
levels.level$feeling.secrets_title=classified floor
levels.level$feeling.chasm_desc=Your work boots squeak loudly across the open floorplan.
levels.level$feeling.water_desc=You hear pipes leaking all around you.
levels.level$feeling.grass_desc=The smell of mold and aggressive spores is thick in the air.
levels.level$feeling.dark_desc=The overhead fluorescents are dead. You hear things scuttling in the dark.
levels.level$feeling.large_desc=The floorplan for this department is unusually sprawling.
levels.level$feeling.traps_desc=This sector has an unusually high density of OSHA violations.
levels.level$feeling.secrets_desc=The layout suggests plenty of hidden R&D access panels here.

levels.mininglevel.wall_desc=A smooth rock wall that's a little softer than usual. You can mine through it with your pickaxe, but it'll take some effort and increase your hunger a bit.
levels.mininglevel.gold_extra_desc=You can probably mine it out with your pickaxe.
levels.mininglevel.crystal_name=Crystal spike
levels.mininglevel.boulder_name=Boulder
levels.mininglevel.crystal_desc=There is a large cluster of crystallized chemical runoff here. It's highly fragile and can easily be shattered with heavy tools, or will break if something is smashed nearby.
levels.mininglevel.boulder_desc=There is a pile of industrial rubble blocking the way. It should be fairly easy to clear with heavy tools.
levels.mininglevel.barricade_desc=The wooden barricade is firmly set and acts as a support for the ceiling.\n\nThis was probably constructed by the gnolls to give some protection against falling rocks. _Any adjacent cells will be protected from rockfall traps and attacks._\n\nIt looks like it would burn just as well as any other barricade.

levels.prisonlevel.water_name=Stagnant machine oil
levels.prisonlevel.empty_deco_desc=There are suspicious chemical burns on the floor.
levels.prisonlevel.bookshelf_desc=This is an overflowing HR filing cabinet. Might it burn?
levels.prisonlevel.region_deco_name=Hazardous Waste Container
levels.prisonlevel.region_deco_desc=A reinforced steel container designed for hazardous materials. It's bolted to the floor and you can't move it.
levels.prisonlevel.region_deco_alt_name=Suspended Engine Block
levels.prisonlevel.region_deco_alt_desc=A massive engine block suspended over the ventilation shaft by a heavy duty chain hoist.

levels.sewerlevel.water_name=Leaking sewage
levels.sewerlevel.empty_deco_desc=Slippery yellowish grime covers the floor.
levels.sewerlevel.bookshelf_desc=The supply closet is packed with useless outdated memos. Might they burn?
levels.sewerlevel.region_deco_name=Chemical Drum
levels.sewerlevel.region_deco_desc=A 55-gallon steel drum plastered with warning labels. It's completely full and far too heavy to move.

levels.vaultlevel$vaultflametrap.name=vault flame vent
levels.vaultlevel$vaultflametrap.desc=This vent seems to be sending up green flames at set intervals. _As this is just a tester area, the flames from the vents won't actually hurt you._