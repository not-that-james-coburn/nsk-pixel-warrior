items.artifacts.driedrose$ghosthero.directed_position_5=I'll head over there.

items.artifacts.driedrose$ghosthero.desc=A frail looking ethereal figure with a humanoid shape. Their power seems tied to the rose you have.\n\nThis lost worker may not be much, they seem to be your only true friend down here.

##back to artifacts
items.artifacts.etherealchains.name=magnetic grapple
items.artifacts.etherealchains.ac_cast=CAST
items.artifacts.etherealchains.rooted=Your chains cannot pull you while you are rooted.
items.artifacts.etherealchains.no_charge=Your chains do not have enough charge.
items.artifacts.etherealchains.cursed=You can't use malfunctioning chains.
items.artifacts.etherealchains.does_nothing=That won't do anything.
items.artifacts.etherealchains.cant_pull=Your chains cannot pull that target.
items.artifacts.etherealchains.cant_reach=Your chains can't reach there.
items.artifacts.etherealchains.inside_wall=Your chains can only pull you through walls, not into them.
items.artifacts.etherealchains.nothing_to_grab=There is nothing to grab there.
items.artifacts.etherealchains.prompt=Choose a location to target.
items.artifacts.etherealchains.desc=These large yet lightweight chains glow with spiritual energy. They can be used to pull you towards terrain, or pull enemies toward you. The ethereal nature of the chains even allows them to extend through walls!
items.artifacts.etherealchains.desc_cursed=The malfunctioning chains are locked to your side, constantly swinging around, trying to trip or bind you.
items.artifacts.etherealchains.desc_equipped=The chains rest around your side, slowly siphoning the spiritual energy of those you defeat. Each charge is a link in the chain, which will extend out exactly one tile.
items.artifacts.etherealchains$chainsrecharge.levelup=Your chains grow stronger!

items.artifacts.holytome.name=holy binder
items.artifacts.holytome.ac_cast=CAST
items.artifacts.holytome.no_spell=You're not able to cast that macro right now.
items.artifacts.holytome.cursed=You cannot use a malfunctioning binder.
items.artifacts.holytome.levelup=Your binder grows stronger!
items.artifacts.holytome.desc=A holy binder that acts as a focus for the Sanitation Priest's divine tech. Using the binder lets the Sanitation Priest cast a variety of technological macros.\n\nThe binder will steadily get more powerful as the Sanitation Priest uses it, giving the Sanitation Priest more maximum charges and slightly increasing the recharging speed.
items.artifacts.holytome.discover_hint=One of the janitorial crew starts with this item.

items.artifacts.hornofplenty.name=lunchbox of holding
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_eat=EAT
items.artifacts.hornofplenty.ac_store=STORE
items.artifacts.hornofplenty.eat=You eat from the lunchbox.
items.artifacts.hornofplenty.prompt=Select some food
items.artifacts.hornofplenty.no_food=Your lunchbox has no food in it to eat!
items.artifacts.hornofplenty.full=Your lunchbox is full of food!
items.artifacts.hornofplenty.reject=Your lunchbox rejects the uncooked blandfruit.
items.artifacts.hornofplenty.maxlevel=Your lunchbox has consumed all the food it can!
items.artifacts.hornofplenty.levelup=The lunchbox consumes your food offering and grows in strength!
items.artifacts.hornofplenty.feed=The lunchbox consumes your food offering.
items.artifacts.hornofplenty.desc=This lunchbox can't be blown into, but instead seems to fill up with food as you adventure and gain experience. You can consume each charge individually as a snack, or eat until you're full.
items.artifacts.hornofplenty.desc_hint=Perhaps there is a way to increase the lunchbox's power by giving it food energy.
items.artifacts.hornofplenty.desc_cursed=The malfunctioning lunchbox has bound itself to your side, it seems to be eager to take food rather than produce it.

items.artifacts.lloydsbeacon.name=gps tracker
items.artifacts.lloydsbeacon.ac_zap=SPRAY
items.artifacts.lloydsbeacon.ac_set=SET
items.artifacts.lloydsbeacon.ac_return=RETURN
items.artifacts.lloydsbeacon.no_charge=Your beacon does not have enough energy right now.
items.artifacts.lloydsbeacon.tele_fail=The teleportation tech fails.
items.artifacts.lloydsbeacon.prompt=Choose a location to spray.
items.artifacts.lloydsbeacon.levelup=Your beacon grows stronger!
items.artifacts.lloydsbeacon.preventing=Strong tech aura of this place prevents you from using the gps tracker!
items.artifacts.lloydsbeacon.creatures=Psychic aura of neighbouring creatures doesn't allow you to use the gps tracker at this moment.
items.artifacts.lloydsbeacon.return=The gps tracker is successfully set at your current location, now you can return here anytime.
items.artifacts.lloydsbeacon.desc=Gps tracker is an intricate technological device which grants the user control of teleportation magics. The beacon can be used to return to a set location, but can also expel bursts of random teleportation tech once it has charged from being equipped. This tech can be directed at a target or at the user themselves.
items.artifacts.lloydsbeacon.desc_set=This beacon was set somewhere on the level %d of Pixel Factory.

items.artifacts.masterthievesarmband.name=sticky fingers glove
items.artifacts.masterthievesarmband.ac_steal=STEAL
items.artifacts.masterthievesarmband.no_charge=Your armband does not have enough charge.
items.artifacts.masterthievesarmband.cursed=You can't use a malfunctioning armband.
items.artifacts.masterthievesarmband.full=Your armband is fully charged!
items.artifacts.masterthievesarmband.prompt=Choose an enemy to target
items.artifacts.masterthievesarmband.no_target=You must target an enemy that is adjacent to you.
items.artifacts.masterthievesarmband.steal_shopkeeper=You can't steal from shopkeepers directly.
items.artifacts.masterthievesarmband.no_steal=That enemy has nothing to steal.
items.artifacts.masterthievesarmband.stole_item=You stole an item: %s.
items.artifacts.masterthievesarmband.failed_steal=You didn't manage to steal anything.
items.artifacts.masterthievesarmband.level_up=Your armband grows stronger!
items.artifacts.masterthievesarmband.desc=This purple velvet armband bears the mark of a master thief. This doesn't belong to you, but it probably didn't belong to its last user either.
items.artifacts.masterthievesarmband.desc_cursed=The malfunctioning armband is bound to your wrist, and somehow your pouch of company scrip seems to be slowly getting lighter...
items.artifacts.masterthievesarmband.desc_worn=You feel power building in the armband on your wrist as you gain experience. You can use this power to steal from shops, or to rob enemies!\n\nRobbing enemies happens instantly, briefly disorients them, and gives you a chance to get whatever loot they have! This power is more effective against unaware enemies. Robbing the same enemy multiple times does not give more chances at loot.

items.artifacts.sandalsofnature.name=botanist's boots
items.artifacts.sandalsofnature.name_1=shoes of nature
items.artifacts.sandalsofnature.name_2=boots of nature
items.artifacts.sandalsofnature.name_3=greaves of nature
items.artifacts.sandalsofnature.ac_feed=FEED
items.artifacts.sandalsofnature.ac_root=ROOT
items.artifacts.sandalsofnature.prompt=Select a seed
items.artifacts.sandalsofnature.levelup=Your footwear surges in size!
items.artifacts.sandalsofnature.absorb_seed=The footwear absorbs the seed, they seem healthier.
items.artifacts.sandalsofnature.no_effect=You must feed a seed to your footwear first.
items.artifacts.sandalsofnature.low_charge=Your footwear don't have enough energy for that.
items.artifacts.sandalsofnature.prompt_target=Select a location
items.artifacts.sandalsofnature.out_of_range=That location is out of range.
items.artifacts.sandalsofnature.desc_1=What initially seem like boots made of twine are actually two plants! They seem very weak and pale, perhaps they need to be given nutrients?
items.artifacts.sandalsofnature.desc_2=The footwear has grown and now more closely resemble two tailored shoes. Some colour has returned to them, perhaps they can still grow further?
items.artifacts.sandalsofnature.desc_3=The plants have grown again and now resembles a pair of solid boots made from bark. The plants seem to have regained their strength, but perhaps they can still grow further?
items.artifacts.sandalsofnature.desc_4=The plants seem to have reached their maximum size, they resemble a pair of armored greaves. The greaves are a deep brown and resemble a very sturdy tree.
items.artifacts.sandalsofnature.desc_hint=You feel more attuned with nature while wearing this artifact.
items.artifacts.sandalsofnature.desc_cursed=The malfunctioning boots are blocking any attunement with nature.
items.artifacts.sandalsofnature.desc_ability=The footwear ripples with the color of the last seed you fed them. They can briefly root into the ground and produce that plant's effect anywhere in a 3 tile radius.\nSeed: _%s_\nCharge needed: _%d%%_
items.artifacts.sandalsofnature.desc_seeds=You have fed the footwear %d seeds.

items.artifacts.skeletonkey.name=master keycard
items.artifacts.skeletonkey.ac_insert=INSERT
items.artifacts.skeletonkey.cursed=You can't use a malfunctioning master keycard.
items.artifacts.skeletonkey.prompt=Choose a target
items.artifacts.skeletonkey.invalid_target=There's nothing to lock or unlock there.
items.artifacts.skeletonkey.lock_no_space=You can't lock a character inside of a door!
items.artifacts.skeletonkey.iron_charges=Opening a regular lock requires 1 charge.
items.artifacts.skeletonkey.gold_charges=Opening a company scrip lock requires 2 charges.
items.artifacts.skeletonkey.lock_charges=Locking a door requires 2 charges.
items.artifacts.skeletonkey.wall_charges=Creating a temporary wall requires 2 charges.
items.artifacts.skeletonkey.crystal_charges=Opening a crystal lock requires 5 charges.
items.artifacts.skeletonkey.wont_open=The key refuses to fit into this lock for some reason.
items.artifacts.skeletonkey.locked_with_key=That door was locked by your master keycard.
items.artifacts.skeletonkey.force_lock=The lock has weakened without your master keycard. You manage to brute force it open.
items.artifacts.skeletonkey.discard=You discard your excess keys.
items.artifacts.skeletonkey.levelup=Your master keycard grows stronger!
items.artifacts.skeletonkey.desc=An important-looking key with a head shaped like a skull. Its teeth seem to be different every time you look at them.
items.artifacts.skeletonkey.desc_worn=This technological key seems to gain power as you use it instead of the factory's regular keys. It can be inserted into almost any of the factory's locks to either open or close them, including doors that were never locked previously.\n\nThe key can even be used on empty space in a cardinal or diagonal direction to 'lock' the air in front of you, creating a 3 tile wide solid wall that lasts for 10 turns. Locking will push away enemies if there is space to do so.
items.artifacts.skeletonkey.desc_cursed=The malfunctioning key seems to be actively avoiding fitting into any lock, and is even making it difficult (but not impossible) for you to use your other keys.
items.artifacts.skeletonkey$keywall.desc=A temporary technological wall has been placed here by the master keycard.

items.artifacts.talismanofforesight.name=security camera feed
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.low_charge=The talisman requires at least 5% charge to scry.
items.artifacts.talismanofforesight.prompt=Choose a location to scan.
items.artifacts.talismanofforesight.levelup=Your Talisman grows stronger!
items.artifacts.talismanofforesight.full_charge=Your Talisman is fully charged!
items.artifacts.talismanofforesight.desc=A smooth stone with strange engravings on it. You feel like it's watching everything around you, keeping an eye out for anything hidden.
items.artifacts.talismanofforesight.desc_worn=When you hold the talisman you feel like your senses are heightened. The talisman is slowly building charge as time passes and when you discover hidden doors or traps.\n\nThe talisman can expend its charge to 'scry' in a cone shape, which reveals all tiles and secrets in the scanned area, and will grant you vision of enemies and items for a short time.
items.artifacts.talismanofforesight.desc_cursed=The malfunctioning talisman is intently staring into you, dulling your senses.
items.artifacts.talismanofforesight$foresight.name=foresight
items.artifacts.talismanofforesight$foresight.uneasy=You feel uneasy.
items.artifacts.talismanofforesight$foresight.desc=You feel very nervous, as if there is nearby unseen danger.

items.artifacts.timekeepershourglass.name=punch clock
items.artifacts.timekeepershourglass.ac_activate=ACTIVATE
items.artifacts.timekeepershourglass.deactivate=You deactivate the time freeze.
items.artifacts.timekeepershourglass.no_charge=Your hourglass hasn't recharged enough to be usable yet.
items.artifacts.timekeepershourglass.cursed=You cannot use a malfunctioning hourglass.
items.artifacts.timekeepershourglass.onstasis=The world seems to shift around you in an instant.
items.artifacts.timekeepershourglass.onfreeze=Everything around you suddenly freezes.
items.artifacts.timekeepershourglass.stasis=Put myself in stasis
items.artifacts.timekeepershourglass.freeze=Freeze time around me
items.artifacts.timekeepershourglass.prompt=How would you like to use the hourglass's tech?\n\nWhile in stasis, time will move normally while you are frozen and completely invulnerable, consumes up to 2 charges at a time.\n\nWhen time is frozen, you can move as if your actions take no time. This can be deactivated at any time by using the hourglass or attacking.
items.artifacts.timekeepershourglass.desc=This large ornate hourglass looks fairly unassuming, but you feel a great power in its finely carved frame. As you rotate the hourglass and watch the sand pour you can feel its tech tugging at you, surely using this tech would give you some control over time.
items.artifacts.timekeepershourglass.desc_hint=The hourglass seems to have lost some sand, if only you could find some...
items.artifacts.timekeepershourglass.desc_cursed=The malfunctioning hourglass is locked to your side, you can feel it trying to manipulate your flow of time.
items.artifacts.timekeepershourglass$timefreeze.name=Time Freeze
items.artifacts.timekeepershourglass$timefreeze.desc=Time is frozen around you, allowing you to perform actions instantly. The effect will last until it is cancelled or your hourglass runs out of charge. Attacking or using tech will break this effect as well.\n\nTurns until charge use: %s.
items.artifacts.timekeepershourglass$sandbag.name=bag of tech sand
items.artifacts.timekeepershourglass$sandbag.levelup=You add the sand to your hourglass.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Your hourglass is filled with technological sand!
items.artifacts.timekeepershourglass$sandbag.no_hourglass=You have no hourglass to place this sand into.
items.artifacts.timekeepershourglass$sandbag.desc=This small bag of fine sand should work perfectly with your hourglass.\n\nIt seems odd that the vending machine dispenser would have this specific item right when you need it...

items.artifacts.unstablespellbook.name=unstable binder
items.artifacts.unstablespellbook.ac_read=READ
items.artifacts.unstablespellbook.ac_add=ADD
items.artifacts.unstablespellbook.blinded=You cannot read from the book while blinded.
items.artifacts.unstablespellbook.no_charge=Your binder is out of energy for now.
items.artifacts.unstablespellbook.cursed=You cannot read from a malfunctioning binder.
items.artifacts.unstablespellbook.prompt=Select a manual
items.artifacts.unstablespellbook.infuse_scroll=You infuse the manual's energy into the book.
items.artifacts.unstablespellbook.unable_scroll=You are unable to add this manual to the book.
items.artifacts.unstablespellbook.unknown_scroll=You're not sure what type of manual this is yet.
items.artifacts.unstablespellbook.desc=This Binder is in surprising good condition given its age. It fizzes and crackles as you move the pages, surging with unstable energy. If you read from this book, there's no telling what macro you might cast.
items.artifacts.unstablespellbook.desc_cursed=The malfunctioning book has bound itself to you, it is inhibiting your ability to use most manuals.
items.artifacts.unstablespellbook.desc_index=The book is incomplete. Its index is currently pointing to the following blank pages:
items.artifacts.unstablespellbook.desc_empowered=The manuals that you've added to the book are glowing with power. You will be able to choose the exotic version of these manual's effects, but at the cost of an additional charge.
items.artifacts.unstablespellbook.read_empowered=The manual you added to the binder surges with energy. You are able to channel either the regular, or exotic version of this manual's effect.\n\nChoosing the exotic variant will cost 2 charges instead of 1.



###bags
items.bags.bag.name=toolbag
items.bags.bag.discover_hint=You can buy this item in a supply closet.

items.bags.potionbandolier.name=canister bandolier
items.bags.potionbandolier.desc=This thick bandolier fits around your chest like a sash, it has many insulated straps on it to hold canister vials, your waterskin, or liquid metal vials.\n\nWhile inside the bandolier, your canisters should be protected from the cold.

items.bags.scrollholder.name=manual holder
items.bags.scrollholder.desc=This tubular container looks like it would hold an astronomer's tools and charts, but your manuals will fit just as well. There's even a few side compartments which would nicely fit macro crystals, arcane styli, and arcane resin.\n\nThe holder doesn't look very flammable, so your manuals should be safe from fire inside it.

items.bags.velvetpouch.name=fanny pack
items.bags.velvetpouch.desc=This small fanny pack can store many small items in it, such as seeds, runestones, and some alchemy ingredients.
items.bags.velvetpouch.discover_hint=One of the janitorial crew starts with this item.

items.bags.magicalholster.name=technological holster
items.bags.magicalholster.desc=This slim holster is made from some exotic animal hide, and possesses powerful tech which lets it store a massive amount of ranged tools.\n\nYou can simply reach into the bag and will always grab the item you were looking for.\n\nDue to the holster's tech, sprayers will charge slightly faster and thrown tools will last slightly longer inside of it.



###bombs
items.bombs.arcanebomb.name=arcane explosive charge
items.bombs.arcanebomb.desc=This explosive charge has been imbued with arcane properties. It will explode into a powerful blast similar to Goo's pumped up attack, dealing _%1$d-%2$d technological damage_ to anything within 2 tiles.
items.bombs.arcanebomb.discover_hint=You can craft this item via alchemy.

items.bombs.bomb.name=explosive charge
items.bombs.bomb.ac_lightthrow=LIGHT & THROW
items.bombs.bomb.snuff_fuse=You quickly snuff the explosive charge's fuse.
items.bombs.bomb.ondeath=The explosion kills you...
items.bombs.bomb.rankings_desc=Killed by an explosion
items.bombs.bomb.desc=A fairly hefty black powder explosive charge. An explosion from this explosive charge deals _%1$d-%2$d damage_ to anything adjacent to it, and will destroy some adjacent terrain or items.
items.bombs.bomb.desc_fuse=It looks like the fuse will take a couple rounds to burn down once it is lit.
items.bombs.bomb.desc_burning=The explosive charge's fuse is burning away, keep your distance or put it out!
items.bombs.bomb$doublebomb.name=two explosive charges
items.bombs.bomb$doublebomb.desc=A stack of two hefty black powder explosive charges, looks like you get one free!

items.bombs.firebomb.name=firebomb
items.bombs.firebomb.desc=This explosive charge has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading sustained flame within 2 tiles.
items.bombs.firebomb.discover_hint=You can craft this item via alchemy.

items.bombs.flashbangbomb.name=flashbang
items.bombs.flashbangbomb.desc=This customized explosive charge will erupt into a blast of light, sound, and electricity when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, an additional 25%% damage from the electricity, and be stunned for 10 turns.
items.bombs.flashbangbomb.discover_hint=You can craft this item via alchemy.

items.bombs.frostbomb.name=liquid nitrogen explosive charge
items.bombs.frostbomb.desc=This explosive charge has been modified to explode in a larger area, dealing _%1$d-%2$d damage_ and spreading a sustained gust of freezing air within 2 tiles.
items.bombs.frostbomb.discover_hint=You can craft this item via alchemy.

items.bombs.holybomb.name=holy explosive charge
items.bombs.holybomb.desc=This explosive charge has been modified to flash holy light in a larger area when it explodes. Anything within 2 tiles will take _%1$d-%2$d damage_ from the explosion, and overworked employee or corrupted enemies will take an additional 50%% damage from the holy light.
items.bombs.holybomb.discover_hint=You can craft this item via alchemy.

items.bombs.noisemaker.name=noisemaker
items.bombs.noisemaker.desc=This customized explosive charge will repeatedly make noise when its fuse runs out. When something touches the explosive charge, it will explode and deal _%1$d-%2$d damage_ to anything within 2 tiles!
items.bombs.noisemaker.desc_burning=The noisemaker is ticking away, it'll explode when something gets near!
items.bombs.noisemaker.discover_hint=You can craft this item via alchemy.

items.bombs.smokebomb.name=smoke explosive charge
items.bombs.smokebomb.desc=This explosive charge has been modified to spew a thick cloud of gas at the same time as exploding. It will deal _%1$d-%2$d damage_ and spread shrouding fog within 2 tiles.
items.bombs.smokebomb.discover_hint=You can craft this item via alchemy.

items.bombs.regrowthbomb.name=regrowth explosive charge
items.bombs.regrowthbomb.desc=This customized explosive charge will splash life-giving liquid everywhere within 3 tiles instead of exploding. The area caught in the blast will rapidly sprout grass and plants. Yourself and any allies caught in the blast will be healed as if they had drank a first-aid spray.
items.bombs.regrowthbomb.discover_hint=You can craft this item via alchemy.

items.bombs.shrapnelbomb.name=scrap metal explosive charge
items.bombs.shrapnelbomb.desc=This explosive charge has been modified with scraps of THE ROGUE ASSEMBLY MACHINE's metal, which will fragment and fly everywhere when it explodes, dealing _%1$d-%2$d damage_ in a huge range around the explosive charge. You had better hide behind something when using it...
items.bombs.shrapnelbomb.discover_hint=You can craft this item via alchemy.

items.bombs.woollybomb.name=woolly explosive charge
items.bombs.woollybomb.desc=This customized explosive charge will create a wide field of technological sheep after exploding. The explosion will deal _%1$d-%2$d damage_ to anything within 2 tiles. The sheep will block movement and persist for a very long time! The sheep will not last as long in the presence of powerful enemies though, and can be manually dispelled sooner by interacting with them.
items.bombs.woollybomb.discover_hint=You can craft this item via alchemy.

###food
items.food.berry.name=factory berry
items.food.berry.eat_msg=That berry was tasty!
items.food.berry.desc=This small berry was found by the Exterminator among the factory's vegetation. It can be eaten quickly, restores a small amount of satiety, and might contain a usable seed!
items.food.berry.discover_hint=You can find this item using a specific janitor talent.

items.food.blandfruit.name=blandfruit
items.food.blandfruit.cooked=cooked blandfruit
items.food.blandfruit.sunfruit=sunfruit
items.food.blandfruit.rotfruit=rotfruit
items.food.blandfruit.earthfruit=earthfruit
items.food.blandfruit.blindfruit=blindfruit
items.food.blandfruit.firefruit=firefruit
items.food.blandfruit.icefruit=icefruit
items.food.blandfruit.fadefruit=fadefruit
items.food.blandfruit.sorrowfruit=sorrowfruit
items.food.blandfruit.stormfruit=stormfruit
items.food.blandfruit.dreamfruit=magefruit
items.food.blandfruit.starfruit=starfruit
items.food.blandfruit.swiftfruit=swiftfruit
items.food.blandfruit.raw=You can't bear to eat it raw.
items.food.blandfruit.desc=So dry and insubstantial, perhaps stewing it with another ingredient would improve it.
items.food.blandfruit.desc_cooked=The fruit has plumped up from its time soaking in the pot and has even absorbed the properties of the seed it was cooked with. It will have the effect of whatever canister the seed corresponded to.
items.food.blandfruit.desc_eat=It looks ready to be eaten!
items.food.blandfruit.desc_throw=It seems pretty volatile, it might be best to throw it.
items.food.blandfruit$chunks.name=blandfruit chunks
items.food.blandfruit$chunks.desc=The blandfruit has exploded on impact, leaving inert chunks behind.\n\nDespite a bit of dirt, these large chunks of cooked blandfruit seem perfectly edible.

items.food.chargrilledmeat.name=microwaved questionable meat
items.food.chargrilledmeat.desc=It looks like a decent steak.
items.food.chargrilledmeat.discover_hint=You can create this using another food item.

items.food.food.name=vending machine snack
items.food.food.ac_eat=EAT
items.food.food.eat_msg=That food tasted delicious!
items.food.food.desc=Nothing fancy here: dried meat, some biscuits - things like that.

items.food.frozencarpaccio.name=frozen questionable meat
items.food.frozencarpaccio.invis=You see your hands turn invisible!
items.food.frozencarpaccio.hard=You feel your skin harden!
items.food.frozencarpaccio.refresh=Refreshing!
items.food.frozencarpaccio.better=You feel better!
items.food.frozencarpaccio.desc=It's a piece of frozen raw meat. The only way to eat it is by cutting thin slices of it. And this way it's surprisingly good.
items.food.frozencarpaccio.discover_hint=You can create this using another food item.

items.food.meatpie.name=leftover pizza
items.food.meatpie.eat_msg=That food was incredible!
items.food.meatpie.desc=A delicious pie filled with savoury meat. This will satiate you far more than any other meal.
items.food.meatpie.discover_hint=You can craft this item via alchemy.

items.food.mysterymeat.name=questionable cafeteria meat
items.food.mysterymeat.eat_msg=That food tasted... strange.
items.food.mysterymeat.hot=Oh it's hot!
items.food.mysterymeat.legs=You can't feel your legs!
items.food.mysterymeat.not_well=You are not feeling well.
items.food.mysterymeat.stuffed=You are stuffed.
items.food.mysterymeat.desc=Eat at your own risk!
items.food.mysterymeat.discover_hint=You can get this item as a drop from certain enemies.
items.food.mysterymeat$placeholder.name=meat

items.food.phantommeat.name=phantom meat
items.food.phantommeat.desc=A large glistening translucent steak, cut from a phantom piranha. This technological meat doesn't need to be cooked and grants a number of defensive benefits in addition to fully satiating you. When eaten it will grant optical camo, barkskin, some healing, and cures many harmful effects.
items.food.phantommeat.discover_hint=You can get this item as a drop from certain enemies.

items.food.pasty.name=microwave burrito
items.food.pasty.fish_name=steamed fish
items.food.pasty.amulet_name=infinite precision ball bearing?
items.food.pasty.egg_name=easter egg
items.food.pasty.rainbow_name=rainbow canister
items.food.pasty.shattered_name=green cake
items.food.pasty.pie_name=pumpkin pie
items.food.pasty.vanilla_name=blue cake
items.food.pasty.cane_name=candy cane
items.food.pasty.sparkling_name=sparkling canister
items.food.pasty.desc=An authentic Cornish microwave burrito with a traditional filling of beef and potato. Delicious!
items.food.pasty.fish_desc=A whole steamed fish, technologically preserved on a bed of greens. It's tradition to save some fish for later around this time of year, so you'll keep some leftovers instead of eating it all at once.\n\nHappy Lunar New Year!
items.food.pasty.amulet_desc=You've finally found it, the technological ball bearing of - wait a minute, this is just a foil-wrapped chocolate made to look like the ball bearing! It won't grant you limitless power, but at least it'll fill you up and give you a little artifact charge.\n\nApril Fools!
items.food.pasty.egg_desc=A great big chocolate egg, wrapped in colorful yellow foil. There's easily enough chocolate here to fill you up, and the sugar might give your artifacts a tiny bit of extra charge.\n\nHappy Easter!
items.food.pasty.rainbow_desc=This colorful canister is a kind of liquid food. In addition to satisfying your hunger, it has a little tech in it which will calm an adjacent non-boss enemy, making them temporarily hesitant to fight you.\n\nHappy Pride!
items.food.pasty.shattered_desc=This large slice of vanilla cake has colorful sprinkles and green frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nShattered Pixel Factory was first released on August 5th 2014. Happy birthday Shattered Pixel Factory!
items.food.pasty.pie_desc=A great big slice of pumpkin pie. Its sweet and spicy flavor will fill you up and give you a tiny bit of healing.\n\nHappy Halloween!
items.food.pasty.vanilla_desc=This large slice of vanilla cake has colorful sprinkles and blue frosting. The cake was made to celebrate years of experience, and will grant a small amount of that experience to you when eaten.\n\nThe original Pixel Factory was first released on December 4th 2012. Happy birthday Pixel Factory!
items.food.pasty.cane_desc=A huge sugary sweet candy cane. It's big enough to fill you up, and the sugar might give your sprayers a tiny bit of extra charge too.\n\nHappy Holidays!
items.food.pasty.sparkling_desc=This sparkling canister is a kind of liquid food. It satisfies hunger and simulates sparkling wine, but isn't actually alcoholic. The warm feeling in your belly will grant a little bit of shielding.\n\nHappy New Year!
items.food.pasty$fishleftover.name=fish leftovers
items.food.pasty$fishleftover.eat_msg=That food tasted ok.
items.food.pasty$fishleftover.desc=Some surplus fish from your previous meal. You can eat it any time you like to restore a little hunger.

items.food.smallration.name=fun-size snack
items.food.smallration.eat_msg=That food tasted ok.
items.food.smallration.desc=It looks exactly like a standard vending machine snack but smaller.
items.food.smallration.discover_hint=You can buy this item in a supply closet.

items.food.stewedmeat.name=boiled questionable meat
items.food.stewedmeat.eat_msg=That food tasted ok.
items.food.stewedmeat.desc=Stewing the meat has cleansed it of any disease or parasites. It should be safe to eat.
items.food.stewedmeat.discover_hint=You can craft this item via alchemy.

items.food.supplyration.name=supply ration
items.food.supplyration.desc=This ration was left in the factory by and for members of the thieves guild. It's specifically designed to be eaten on the go, and aid with general skullduggery.\n\nWhile it doesn't fill you up as much as a regular ration, it can be eaten quickly, provides a little direct healing, and will restore a charge to the Aging Custodian's stealth tarp.
items.food.supplyration.discover_hint=You can find this item using a specific janitor talent.



##journal items
items.journal.documentpage.name=torn page
items.journal.documentpage.desc=A lone page, probably torn from a book of some sort. You'll need to pick it up to read it.

items.journal.alchemypage.name=torn alchemy book page
items.journal.alchemypage.desc=A torn page from a guidebook on alchemy.\n\nMost of the text is too small to read at a distance, but you can make out the title of the page:\n\n_"%s"_

items.journal.guidebook.name=binder of factory mastery
items.journal.guidebook.hint_mobile=Your guidebook has advice for you! Tap the flashing journal button on the top-right to read it.
items.journal.guidebook.hint_desktop=Your guidebook has advice for you! Select the flashing journal button (%s) on the top-right to read it.
items.journal.guidebook.hint_status=Guidebook
items.journal.guidebook.desc=An worker's guidebook, left here by someone who decided factory work wasn't for them! This particular book is technological, and can prompt workers to read a page at the right moment.\n\nDespite that functionality, the book is most popular because of the big words "Don't Panic!" written in large friendly letters on the cover.

items.journal.guidepage.name=torn guidebook page
items.journal.guidepage.desc=A torn page from an factory work guidebook.\n\nMost of the text is too small to read at a distance, but you can make out the title of the page:\n\n_"%s"_

items.journal.regionlorepage$sewers.name=worn letter
items.journal.regionlorepage$sewers.desc=What looks to be a letter, written on a dirt-stained piece of paper. You'll need to pick it up to be able to make out what's written on it.

items.journal.regionlorepage$prison.name=worn journal entry
items.journal.regionlorepage$prison.desc=A journal entry, or some other kind of record, written on an old piece of paper. It seems to have fared better than the letters you found in the sewers, but you'll still need to pick it up to read it.

items.journal.regionlorepage$caves.name=old log entry
items.journal.regionlorepage$caves.desc=What looks to be an entry in an explorer's logbook, preserved surprisingly well despite how old it must be. Pick it up to read it.

items.journal.regionlorepage$city.name=rusted tablet
items.journal.regionlorepage$city.desc=A small rusted metal tablet with a message technologically etched into it. The letters are still clear despite the tablet's age, but you'll have to pick it up to read it.

items.journal.regionlorepage$halls.name=glowing tablet
items.journal.regionlorepage$halls.desc=A small black tablet with glowing green letters etched into it. The glowing letters blur together into a haze at a distance, you'll have to pick it up to read it.


###keys
items.keys.goldenkey.name=warning yellow key
items.keys.goldenkey.desc=The notches on this warning yellow key are tiny and intricate. Perhaps it will open a locked chest?

items.keys.crystalkey.name=Server room keycard
items.keys.crystalkey.desc=The cut surfaces of this crystalline key shimmer in the darkness. Perhaps it will open something made of crystal?

items.keys.ironkey.name=maintenance key
items.keys.ironkey.desc=The notches on this ancient maintenance key are well worn; its leather lanyard is battered by age. What door might it open?

items.keys.wornkey.name=rusted key
items.keys.wornkey.desc=This key is worn and discolored, but looks serious. Probably it can open some serious door nearby.



###potions
items.potions.potion.ac_drink=DRINK
items.potions.potion.turquoise=neon green canister
items.potions.potion.crimson=hazard orange canister
items.potions.potion.azure=safety blue canister
items.potions.potion.jade=bio-hazard green canister
items.potions.potion.golden=warning yellow canister
items.potions.potion.magenta=fuchsia canister
items.potions.potion.charcoal=ash black canister
items.potions.potion.ivory=sterile white canister
items.potions.potion.amber=rusty brown canister
items.potions.potion.bistre=sludge brown canister
items.potions.potion.indigo=deep purple canister
items.potions.potion.silver=chrome canister
items.potions.potion.unknown_desc=This spray bottle contains a swirling colorful liquid. Who knows what it will do when drunk or thrown?
items.potions.potion.harmful=Harmful canister!
items.potions.potion.beneficial=Beneficial canister
items.potions.potion.yes=Yes, I know what I'm doing
items.potions.potion.no=No, I changed my mind
items.potions.potion.sure_drink=Are you sure you want to drink it? In most cases you should throw such canisters at your enemies.
items.potions.potion.sure_throw=Are you sure you want to throw it? In most cases it makes sense to drink it.
items.potions.potion.shatter=The spray bottle shatters and the liquid splashes harmlessly.
items.potions.potion.discover_hint=You can find this item randomly in the factory, or craft it via alchemy.
items.potions.potion$placeholder.name=canister
items.potions.potion$seedtopotion.name=Random Canister

items.potions.potionofexperience.name=canister of overtime
items.potions.potionofexperience.desc=The storied experiences of multitudes of battles reduced to liquid form, this draught will instantly raise your experience level.

items.potions.potionoffrost.name=canister of liquid nitrogen
items.potions.potionoffrost.desc=The chemical contained in this canister will evaporate into a freezing cloud upon exposure to open air.

items.potions.potionofhaste.name=canister of caffeine rush
items.potions.potionofhaste.energetic=You feel energetic!
items.potions.potionofhaste.desc=Drinking this oddly sweet liquid will imbue you with tremendous energy for a short time, allowing you to run at high speeds.

items.potions.potionofhealing.name=first-aid spray
items.potions.potionofhealing.heal=Your wounds begin to close.
items.potions.potionofhealing.desc=This energy drink will rapidly restore your health and instantly cure many ailments.

items.potions.potionofinvisibility.name=canister of optical camo
items.potions.potionofinvisibility.invisible=You see your hands turn invisible!
items.potions.potionofinvisibility.desc=Drinking this canister will render you temporarily invisible. While invisible, enemies will be unable to see you. Physical attacks and technological effects (such as manuals and sprayers) will immediately cancel optical camo.

items.potions.potionoflevitation.name=canister of anti-grav
items.potions.potionoflevitation.float=You float into the air!
items.potions.potionoflevitation.desc=Drinking this curious liquid will cause you to hover in the air, able to drift effortlessly over traps and pits. Throwing this canister will create a cloud of unrefined gas, disorienting anything caught in it.

items.potions.potionofliquidflame.name=canister of flammable aerosol
items.potions.potionofliquidflame.desc=This spray bottle contains an unstable compound which will burst violently into flame upon exposure to open air.

items.potions.potionofmindvision.name=canister of thermal imaging
items.potions.potionofmindvision.see_mobs=You can somehow feel the presence of other creatures' minds!
items.potions.potionofmindvision.see_none=You can somehow tell that you are alone on this level at the moment.
items.potions.potionofmindvision.desc=After drinking this, your mind will become attuned to the psychic signature of distant creatures, enabling you to sense biological presences through walls. Also this canister will permit you to see through nearby walls and doors.

items.potions.potionofparalyticgas.name=canister of stunning foam
items.potions.potionofparalyticgas.desc=Upon exposure to open air, the liquid in this spray bottle will vaporize into a numbing yellow haze. Anyone who inhales the cloud will be paralyzed instantly, unable to move for some time after the cloud dissipates. This item can be thrown at distant enemies to catch them within the effect of the gas.

items.potions.potionofpurity.name=canister of decontamination
items.potions.potionofpurity.freshness=You feel uncommon freshness in the air.
items.potions.potionofpurity.protected=A protective film envelops you!
items.potions.potionofpurity.desc=This technological reagent will quickly neutralize all harmful area-bound effects in a large area. Drinking it will give you temporary immunity to such effects.

items.potions.potionofstrength.name=canister of steroids
items.potions.potionofstrength.msg=Newfound strength surges through your body, you now have %d strength!
items.potions.potionofstrength.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point.

items.potions.potionoftoxicgas.name=canister of industrial solvent
items.potions.potionoftoxicgas.desc=Uncorking or shattering this pressurized glass will cause its contents to explode into a deadly cloud of toxic green gas. You might choose to fling this canister at distant enemies instead of uncorking it by hand.



###brews
items.potions.brews.brew.discover_hint=You can craft this item via alchemy.

items.potions.brews.aquabrew.name=aqua mixture
items.potions.brews.aquabrew.desc=When shattered, this mixture will release a burst of pressurized water at its location. It's only forceful enough to damage fiery enemies, but it also spreads water to nearby terrain, disables traps, douses fires, and knocks back characters near the burst.

items.potions.brews.blizzardbrew.name=blizzard mixture
items.potions.brews.blizzardbrew.desc=When shattered, this mixture will unleash a swirling blizzard which quickly spreads like a gas.

items.potions.brews.causticbrew.name=caustic mixture
items.potions.brews.causticbrew.desc=This mixture will spread corrosive ooze in a wide area around the location it shatters in. Anything caught by the ooze will slowly melt if it can't wash it off in water.

items.potions.brews.infernalbrew.name=infernal mixture
items.potions.brews.infernalbrew.desc=When shattered, this mixture will unleash a raging inferno which quickly spreads like a gas.

items.potions.brews.shockingbrew.name=shocking mixture
items.potions.brews.shockingbrew.desc=When shattered, this mixture will unleash an electrical storm in a wide area around the location it breaks at.

items.potions.brews.unstablebrew.name=unstable mixture
items.potions.brews.unstablebrew.desc=This technological mixture glows with shifting colors of the rainbow.\n\nWhen drank or thrown it will trigger the effect of a random canister. The canister effect will always be beneficial if it is drank, and will always be harmful if it is thrown.

###elixirs
items.potions.elixirs.elixir.discover_hint=You can craft this item via alchemy.

items.potions.elixirs.elixirofarcanearmor.name=energy drink of arcane PPE
items.potions.elixirs.elixirofarcanearmor.desc=This energy drink will grant the drinker a long lasting resistance to technological damage.

items.potions.elixirs.elixirofaquaticrejuvenation.name=energy drink of aquatic rejuvenation
items.potions.elixirs.elixirofaquaticrejuvenation.desc=This energy drink contains the remains of Goo enhanced with a first-aid spray. While it will not provide immediate healing, it will steadily restore a greater amount of health while you are standing in water.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatic healing
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=You have temporarily gained restorative properties similar to that of Goo.\n\nWhile standing in water, you will recover a small amount of health per turn. The effect is paused when you are at full health or are out of water.\n\nHealing left: %d.

items.potions.elixirs.elixirofdragonsblood.name=energy drink of dragon's blood
items.potions.elixirs.elixirofdragonsblood.desc=When consumed, this energy drink will send fiery power coursing through the drinker's veins. This effect will make the drinker immune to fire, and allow them to set enemies aflame with physical attacks.

items.potions.elixirs.elixiroffeatherfall.name=energy drink of feather fall
items.potions.elixirs.elixiroffeatherfall.light=You feel light as a feather!
items.potions.elixirs.elixiroffeatherfall.desc=This energy drink offers a weaker but more controlled anti-grav effect, allowing the drinker to fall great distances without harm for a little while.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=feather fall
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=You are under the effects of a feather fall energy drink, allowing you to fall into chasms without taking damage!\n\nTurns remaining: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=energy drink of honeyed healing
items.potions.elixirs.elixirofhoneyedhealing.desc=This energy drink combines healing with the sweetness of honey. When drank, it will apply the same effect as a first-aid spray and satisfy a small amount of hunger, but it can also be thrown to heal an ally.\n\nCreatures with an affinity for honey might be pacified if this item is used on them.

items.potions.elixirs.elixiroficytouch.name=energy drink of icy touch
items.potions.elixirs.elixiroficytouch.desc=When consumed, this energy drink will allow the drinker to sap the heat from enemies they attack. This effect will make the drinker immune to the cold, and allow them to chill enemies with physical attacks.

items.potions.elixirs.elixirofmight.name=energy drink of might
items.potions.elixirs.elixirofmight.msg=Newfound strength surges through your body, you now have %d strength!
items.potions.elixirs.elixirofmight.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point and temporarily increasing maximum health by %d points. The health boost scales with your maximum health, but will slowly wear off as you gain levels.
items.potions.elixirs.elixirofmight$htboost.name=max health boost
items.potions.elixirs.elixirofmight$htboost.desc=Your body feels unnaturally strong and healthy.\n\nYour maximum health is boosted for an extended period of time. As you gain levels, the boost will steadily fade.\n\nCurrent boost amount: %d.\nLevels remaining: %d.

items.potions.elixirs.elixiroftoxicessence.name=energy drink of toxic essence
items.potions.elixirs.elixiroftoxicessence.desc=When consumed, this energy drink will imbue the drinker with toxic energy. The drinker will continuously spread industrial solvent as they move, and will be immune to industrial solvent and poison for slightly longer than the duration of the effect.



###exotic potions
items.potions.exotic.exoticpotion.turquoise=exotic neon green canister
items.potions.exotic.exoticpotion.crimson=exotic hazard orange canister
items.potions.exotic.exoticpotion.azure=exotic safety blue canister
items.potions.exotic.exoticpotion.jade=exotic bio-hazard green canister
items.potions.exotic.exoticpotion.golden=exotic warning yellow canister
items.potions.exotic.exoticpotion.magenta=exotic fuchsia canister
items.potions.exotic.exoticpotion.charcoal=exotic ash black canister
items.potions.exotic.exoticpotion.ivory=exotic sterile white canister
items.potions.exotic.exoticpotion.amber=exotic rusty brown canister
items.potions.exotic.exoticpotion.bistre=exotic sludge brown canister
items.potions.exotic.exoticpotion.indigo=exotic deep purple canister
items.potions.exotic.exoticpotion.silver=exotic chrome canister
items.potions.exotic.exoticpotion.unknown_desc=This round spray bottle contains a grainy colorful liquid. It seems to be foreign to this land, who knows what it might do when drunk or thrown?
items.potions.exotic.exoticpotion.warning=Do you really want to cancel this canister usage? It will be consumed anyway.
items.potions.exotic.exoticpotion.yes=Yes, I'm positive
items.potions.exotic.exoticpotion.no=No, I changed my mind
items.potions.exotic.exoticpotion.discover_hint=You can craft this item via alchemy.

items.potions.exotic.potionofcleansing.name=canister of cleansing
items.potions.exotic.potionofcleansing.desc=This powerful reagent will render the drinker immune to all harmful status effects for a few turns when quaffed. It can be thrown at a target to cleanse them as well.
items.potions.exotic.potionofcleansing$cleanse.name=cleansed
items.potions.exotic.potionofcleansing$cleanse.desc=This character is temporarily immune to all harmful status effects!\n\nTurns remaining: %s.

items.potions.exotic.potionofcorrosivegas.name=canister of corrosive gas
items.potions.exotic.potionofcorrosivegas.desc=Uncorking or shattering this pressurized glass will cause its contents to explode into a deadly cloud of corrosive rust-colored gas. The gas spreads more quickly than industrial solvent and is more deadly, but also won't last as long.

items.potions.exotic.potionofdragonsbreath.name=canister of dragon's breath
items.potions.exotic.potionofdragonsbreath.prompt=Choose a location to burn
items.potions.exotic.potionofdragonsbreath.desc=This spray bottle contains an unusual compound which bursts into flame shortly after mixing with saliva. Quickly spitting the liquid will allow the user to spew flame from their mouth!

items.potions.exotic.potionofearthenarmor.name=canister of earthen PPE
items.potions.exotic.potionofearthenarmor.desc=Rather than paralyze, this liquid has a hardening effect on the skin which will turn it into temporary natural PPE.

items.potions.exotic.potionofdivineinspiration.name=canister of divine inspiration
items.potions.exotic.potionofdivineinspiration.no_more_points=You can't gain any more bonus talent points.
items.potions.exotic.potionofdivineinspiration.select_tier=Select a talent tier to gain two bonus points in. You must have unlocked the tier to be able to spend the points.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talent Points!
items.potions.exotic.potionofdivineinspiration.desc=The power of holy energy reduced to liquid form, this draught will imbue the drinker with divine power, granting them two bonus talent points in a tier of their choosing.\n\nThis canister can only be used once for each talent tier.

items.potions.exotic.potionofmagicalsight.name=canister of technological sight
items.potions.exotic.potionofmagicalsight.desc=After drinking this, your senses will be briefly heightened to incredible levels, allowing you to see through walls in a 12 tile radius!

items.potions.exotic.potionofmastery.name=canister of mastery
items.potions.exotic.potionofmastery.prompt=Master an Item
items.potions.exotic.potionofmastery.weapon_easier=Your tool becomes easier to wield!
items.potions.exotic.potionofmastery.armor_easier=Your PPE becomes easier to wear!
items.potions.exotic.potionofmastery.desc=Rather than granting raw strength, this canister will instead attune the muscles of the user to a particular item. This will make that item easier to use, as if the drinker had practised with it and built muscle memory.\n\nThe chosen tool or PPE will require 2 less strength to use. This canister can only be used once on each item.

items.potions.exotic.potionofshielding.name=canister of shielding
items.potions.exotic.potionofshielding.desc=Rather than heal, this canister will instead project a durable shield around the user's body, blocking a considerable amount of damage.

items.potions.exotic.potionofshroudingfog.name=canister of shrouding fog
items.potions.exotic.potionofshroudingfog.desc=When exposed to air, the liquid in this spray bottle will produce a thick smoky fog which quickly spreads and blocks the vision of your enemies.

items.potions.exotic.potionofsnapfreeze.name=canister of snap freeze
items.potions.exotic.potionofsnapfreeze.desc=The chemical contained in this canister will rapidly react with the air, instantly freezing and rooting all within its effect.

items.potions.exotic.potionofstamina.name=canister of stamina
items.potions.exotic.potionofstamina.desc=Drinking this oddly sweet liquid will imbue you with a long-lasting boost of energy, allowing you to run at a quickened pace for an extended period of time.

items.potions.exotic.potionofstormclouds.name=canister of storm clouds
items.potions.exotic.potionofstormclouds.desc=Throwing this canister will create a quickly-spreading cloud of concentrated vapor, which will condense and pour down onto the environment. Most terrain will be converted to water, fiery enemies will take damage, fire will be doused, and traps will be overwhelmed and break.



###quest items
items.quest.ceremonialcandle.name=ceremonial candle
items.quest.ceremonialcandle.desc=A set of candles, melted down and fused together through use.\n\nAlone they are worthless, but used with other candles in a pattern, they can focus the energy for a summoning ritual.
items.quest.ceremonialcandle.discover_hint=You can find this item during a specific quest.

items.quest.corpsedust.name=corpse dust
items.quest.corpsedust.chill=A chill runs down your spine.
items.quest.corpsedust.desc=The ball of corpse dust doesn't differ outwardly from a regular dust ball. But you can feel a malevolent energy lurking within it.\n\nGetting rid of it as soon as possible would be a good idea.
items.quest.corpsedust.discover_hint=You can find this item during a specific quest.

items.quest.darkgold.name=dark company scrip ore
items.quest.darkgold.you_now_have=You now have %d dark company scrip ore.
items.quest.darkgold.desc=This metal is called dark not because of its color (it doesn't differ from the normal company scrip), but because it melts under the daylight, making it useless on the surface.
items.quest.darkgold.discover_hint=You can find this item during a specific quest.

items.quest.dwarftoken.name=mechanic token
items.quest.dwarftoken.desc=Many mechanics and some of their larger creations carry these small pieces of metal of unknown purpose. Maybe they are jewelry or maybe some kind of ID. Mechanics are strange folk.
items.quest.dwarftoken.discover_hint=You can find this item during a specific quest.

items.quest.embers.name=elemental embers
items.quest.embers.desc=Special embers which can only be harvested from young fire elementals. They radiate thermal energy.
items.quest.embers.discover_hint=You can find this item during a specific quest.

items.quest.escapecrystal.name=escape crystal
items.quest.escapecrystal.ac_use=USE
items.quest.escapecrystal.desc=A thin technological macro crystal that seems to contain teleportation tech. You can use the crystal at any time to leave the mechanical vault, but you won't be able to take anything out with you!
items.quest.escapecrystal.discover_hint=You can find this item during a specific quest.

items.quest.gooblob.name=blob of goo
items.quest.gooblob.desc=A jiggly blob of goop, split off from Goo as it died. It's almost like a big ball of jelly, though you wouldn't dare eat it.\n\nIt does nothing on its own, but it might be useful when combined with certain canisters, or a explosive charge. At the very least it should convert into a decent amount of energy.
items.quest.gooblob.discover_hint=You can get this item as a drop from certain enemies.

items.quest.metalshard.name=malfunctioning metal shard
items.quest.metalshard.desc=A shard of rusted malfunctioning metal, which broke off THE ROGUE ASSEMBLY MACHINE as it was destroyed. You can feel an inactive malevolent tech within it.\n\nIt does nothing on its own, but it might be useful when combined with certain manuals, or a explosive charge. At the very least it should convert into a decent amount of energy.
items.quest.metalshard.discover_hint=You can get this item as a drop from certain enemies.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ability_name=pierce
items.quest.pickaxe.ability_desc=The Heavy Machinery Operator can _pierce_ an enemy with a pickaxe. This is guaranteed to hit, applies vulnerable for 3 turns, and deals _%1$d-%2$d damage_ to enemies with rigid skin.
items.quest.pickaxe.upgrade_ability_stat_name=Ability Damage
items.quest.pickaxe.desc=This is a sturdy and heavy tool for breaking rocks. You don't need to equip the pickaxe to mine with it, but it can probably be equipped as a tool in a pinch.
items.quest.pickaxe.discover_hint=You can find this item during a specific quest.

items.quest.ratskull.name=giant rat skull
items.quest.ratskull.desc=A surprisingly large rat skull. It would make a great hunting trophy, if you had a wall to mount it on.



###remains
items.remains.remainsitem.ac_use=USE
items.remains.remainsitem.discover_hint=You can find this item in the remains of a specific janitor from a previous lost run.

items.remains.bowfragment.name=rivet gun fragment
items.remains.bowfragment.desc=This broken fragment of wood was once part of a lost Exterminator' spirit rivet gun. You can still feel a little nature energy left in the fragment, you can use the fragment to grow some high grass around you. Doing this will destroy the fragment however.

items.remains.brokenhilt.name=broken hilt
items.remains.brokenhilt.desc=This broken hilt looks like it came from a defeated Heavy Machinery Operator's tool. You can still feel a little martial power left in the hilt, you can use it to get a little bonus damage on your next two melee hits. Doing this will destroy the hilt however.

items.remains.brokenstaff.name=broken power washer
items.remains.brokenstaff.desc=This Bio-Hazard Tech's power washer has been broken in half after its owner met their demise. You can still feel some technological energy left in the power washer, you can use it to give your sprayers a little charge boost. Doing this will destroy the power washer however.

items.remains.cloakscrap.name=scrap of fabric
items.remains.cloakscrap.desc=This scrap of translucent fabric looks like it came from a late Aging Custodian's stealth tarp. You can still feel a little mystical energy left in it, you can use it to give your artifacts a little charge boost. Doing this will destroy the fabric however.

items.remains.sealshard.name=seal shards
items.remains.sealshard.desc=These tiny shards of red wax look like they came from the seal of a fallen Rookie Sweeper. You can still feel a bit of willpower clinging to the seal, you can use it to give yourself a bit of shielding. Doing this will destroy the seal shards however.

items.remains.tornpage.name=torn page
items.remains.tornpage.desc=This page looks like it was ripped out of an expired Sanitation Priest's holy binder. There's still a little divine energy clinging to it, you can use it to regain a little bit of health. Doing this will destroy the torn page however.



###rings
items.rings.ring.diamond=diamond badge
items.rings.ring.opal=opal badge
items.rings.ring.garnet=garnet badge
items.rings.ring.ruby=ruby badge
items.rings.ring.amethyst=amethyst badge
items.rings.ring.topaz=topaz badge
items.rings.ring.onyx=onyx badge
items.rings.ring.tourmaline=tourmaline badge
items.rings.ring.emerald=emerald badge
items.rings.ring.sapphire=sapphire badge
items.rings.ring.quartz=quartz badge
items.rings.ring.agate=agate badge
items.rings.ring.equip_cursed=The badge tightens around your finger painfully!
items.rings.ring.unknown_desc=This metal band is adorned with a large microchip that glitters in the darkness. Who knows what effect it has when worn?
items.rings.ring.known=This is a %s
items.rings.ring.identify=You are now familiar enough with your badge to identify it.
items.rings.ring.cursed_worn=Because this badge is malfunctioning, you are powerless to remove it.
items.rings.ring.curse_known=You can feel a malevolent tech lurking within this badge.
items.rings.ring.not_cursed=This badge is free of malevolent tech.

items.rings.ringofaccuracy.name=badge of precision
items.rings.ringofaccuracy.stats=When worn, this badge will increase your precision by _%s%%._
items.rings.ringofaccuracy.typical_stats=When worn, this badge will typically increase your precision by _%s%%._
items.rings.ringofaccuracy.combined_stats=Your equipped badges are combining their power, increasing your precision by _%s%%_ in total.
items.rings.ringofaccuracy.upgrade_stat_name_1=Precision Boost
items.rings.ringofaccuracy.desc=This badge increases your focus, making it easier for your attacks to find their mark. A malfunctioning badge will instead make it harder for your attacks to connect.

items.rings.ringofarcana.name=badge of arcana
items.rings.ringofarcana.stats=When worn, this badge will increase the power of modifications and safety certifications by _%s%%._
items.rings.ringofarcana.typical_stats=When worn, this badge will typically increase the power of modifications and safety certifications by _%s%%._
items.rings.ringofarcana.combined_stats=Your equipped badges are combining their power, increasing the power of modifications and safety certifications by _%s%%_ in total.
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofarcana.desc=This badge enhances technological modifications on tools and safety certifications on PPE, including malfunctions! It first increases activation chance, and then increases the strength of the effect once activation chance is 100%. A malfunctioning badge will instead weaken modifications, safety certifications, and malfunctions.

items.rings.ringofelements.name=badge of hazmat
items.rings.ringofelements.stats=When worn, this badge will provide _%s%%_ elemental resistance.
items.rings.ringofelements.typical_stats=When worn, this badge will typically provide _%s%%_ elemental resistance.
items.rings.ringofelements.combined_stats=Your equipped badges are combining their power, providing _%s%%_ elemental resistance in total.
items.rings.ringofelements.upgrade_stat_name_1=Resistance
items.rings.ringofelements.desc=This badge provides resistance to most elemental and technological effects, decreasing damage and debuff duration. Naturally a malfunctioning badge will instead worsen these effects.

items.rings.ringofenergy.name=badge of energy
items.rings.ringofenergy.stats=When worn, this badge will increase sprayer, artifact, and elite PPE charge speed by _%s%%._
items.rings.ringofenergy.typical_stats=When worn, this badge will typically increase sprayer, artifact, and elite PPE charge speed by _%s%%._
items.rings.ringofenergy.combined_stats=Your equipped badges are combining their power, increasing charge speed by _%s%%_ in total.
items.rings.ringofenergy.upgrade_stat_name_1=Charge Boost
items.rings.ringofenergy.desc=Your technological equipment will recharge more quickly in the arcane field that radiates from this badge. A malfunctioning badge will instead slow recharge.

items.rings.ringofevasion.name=badge of dodging
items.rings.ringofevasion.stats=When worn, this badge will increase your dodging by _%s%%._
items.rings.ringofevasion.typical_stats=When worn, this badge will typically increase your dodging by _%s%%._
items.rings.ringofevasion.combined_stats=Your equipped badges are combining their power, increasing your dodging by _%s%%_ in total.
items.rings.ringofevasion.upgrade_stat_name_1=Dodging Boost
items.rings.ringofevasion.desc=This badge quickens the wearer's reactions, making it harder to land blows on them. A malfunctioning badge will instead make the user easier to strike.

items.rings.ringofforce.name=badge of brute force
items.rings.ringofforce.stats=When unarmed, at your current strength, this badge will deal _%1$d-%2$d damage._ With a tool equipped, this badge will increase damage by _%3$d._
items.rings.ringofforce.typical_stats=When unarmed, at your current strength, typically this badge will deal _%1$d-%2$d damage._ With a tool equipped, typically this badge will increase damage by _%3$d._
items.rings.ringofforce.combined_stats=Your equipped badges are combining their power, dealing a total of _%1$d-%2$d damage_ without a tool, or increasing damage by _%3$d_ with one.
items.rings.ringofforce.upgrade_stat_name_1=Unarmed Damage
items.rings.ringofforce.upgrade_stat_name_2=Armed Damage Boost
items.rings.ringofforce.upgrade_stat_name_3=Ability Damage
items.rings.ringofforce.ability_name=brawler's stance
items.rings.ringofforce.typical_ability_desc=The Heavy Machinery Operator can adopt a _brawler's stance_ with this badge, causing her regular attacks to always use this badge even with a tool equipped. These attacks will typically deal _%1$d-%2$d damage_ and will also inherit the tool's modification and augmentation. This stance slows tool recharging speed by 50%%.
items.rings.ringofforce.ability_desc=The Heavy Machinery Operator can adopt a _brawler's stance_ with this badge, causing her regular attacks to always use this badge even with a tool equipped. These attacks will deal _%1$d-%2$d damage_ and will also inherit the tool's modification and augmentation. This stance slows tool recharging speed by 50%%.
items.rings.ringofforce.desc=This badge enhances the brute force of the wearer's melee blows. This extra power is fairly weak when wielding tools, but an unarmed attack will be made much stronger. A malfunctioning badge will instead weaken the wearer's blows.
items.rings.ringofforce$brawlersstance.name=brawler's stance
items.rings.ringofforce$brawlersstance.desc=While in this stance the Heavy Machinery Operator's regular attacks will use an equipped badge of brute force even when she has a tool equipped. These attacks gain bonus damage and will still use the tool's augmentation and modification.\n\nMaintaining this stance takes focus however, reducing tool ability recharge speed by 50%.\n\nThis stance can be toggled on or off by using a badge of brute force, but the reduction in charge speed will persist for a little while if the stance is quickly activated and deactivated.

items.rings.ringoffuror.name=badge of overdrive
items.rings.ringoffuror.stats=When worn, this badge will increase the speed of your attacks by _%s%%._
items.rings.ringoffuror.typical_stats=When worn, this badge will typically increase the speed of your attacks by _%s%%._
items.rings.ringoffuror.combined_stats=Your equipped badges are combining their power, increasing the speed of your attacks by _%s%%_ in total.
items.rings.ringoffuror.upgrade_stat_name_1=Attack Speed Boost
items.rings.ringoffuror.desc=This badge grants the wearer an inner fury, allowing them to attack more rapidly. A malfunctioning badge will instead slow the wearer's speed of attack.

items.rings.ringofhaste.name=badge of caffeine rush
items.rings.ringofhaste.stats=When worn, this badge will increase your movement speed by _%s%%._
items.rings.ringofhaste.typical_stats=When worn, this badge will typically increase your movement speed by _%s%%._
items.rings.ringofhaste.combined_stats=Your equipped badges are combining their power, increasing your movement speed by _%s%%_ in total.
items.rings.ringofhaste.upgrade_stat_name_1=Move Speed Boost
items.rings.ringofhaste.desc=This badge reduces the stress of movement on the wearer, allowing them to run at superhuman speeds. A malfunctioning badge will instead weigh the wearer down.

items.rings.ringofmight.name=badge of might
items.rings.ringofmight.stats=When worn, this badge will increase your strength by _%1$d_ and your max HP by _%2$s%%._
items.rings.ringofmight.typical_stats=When worn, this badge will typically increase your strength by _%1$d_ and your max HP by _%2$s%%._
items.rings.ringofmight.combined_stats=Your equipped badges are combining their power, boosting your strength by _%1$d_ and max HP by _%2$s%%_ in total.
items.rings.ringofmight.upgrade_stat_name_1=Strength Boost
items.rings.ringofmight.upgrade_stat_name_2=Max HP Boost
items.rings.ringofmight.desc=This badge enhances the physical traits of the wearer, granting them greater physical strength and constitution. A malfunctioning badge will weaken the wearer.

items.rings.ringofsharpshooting.name=badge of target acquisition
items.rings.ringofsharpshooting.stats=When worn, this badge will boost the damage of your thrown tools as if their level was increased by _%1$d_, and will increase their durability by _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=When worn, this badge will typically boost the damage of your thrown tools as if their level was increased by _%1$d_ and will increase their durability by _%2$s%%._
items.rings.ringofsharpshooting.combined_stats=Your equipped badges are combining their power, boosting effective thrown tool level by _%1$d_ and increasing their durability by _%2$s%%_ in total.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Level Damage Boost
items.rings.ringofsharpshooting.upgrade_stat_name_2=Durability Boost
items.rings.ringofsharpshooting.desc=This badge enhances the wearer's precision and aim, which will make all projectile tools more damaging and durable. A malfunctioning badge will have the opposite effect.

items.rings.ringoftenacity.name=badge of endurance
items.rings.ringoftenacity.stats=When worn, this badge will reduce the damage you take by up to _%s%%._
items.rings.ringoftenacity.typical_stats=When worn, this badge will typically reduce the damage you take by up to _%s%%._
items.rings.ringoftenacity.combined_stats=Your equipped badges are combining their power, reducing the damage you take by up to _%s%%_ in total.
items.rings.ringoftenacity.upgrade_stat_name_1=Max Damage Resist
items.rings.ringoftenacity.desc=When worn, this badge will allow the wearer to resist normally mortal strikes. The more injured the user is, the more resistant they will be to damage. A malfunctioning badge will instead make it easier for enemies to execute the wearer.

items.rings.ringofwealth.name=badge of embezzlement
items.rings.ringofwealth.stats=When worn, this badge will increase your luck by _%s%%._
items.rings.ringofwealth.typical_stats=When worn, this badge will typically increase your luck by _%s%%._
items.rings.ringofwealth.combined_stats=Your equipped badges are combining their power, increasing your luck by _%s%%_ in total.
items.rings.ringofwealth.upgrade_stat_name_1=Luck Boost
items.rings.ringofwealth.desc=This badge acts like a magnet for treasure, increasing the likelihood that enemies and containers will be carrying valuable items. A malfunctioning badge will instead reduce your chance of receiving loot.



###scrolls
items.scrolls.scroll.ac_read=READ
items.scrolls.scroll.kaunan=manual of KAUNAN
items.scrolls.scroll.sowilo=manual of SOWILO
items.scrolls.scroll.laguz=manual of LAGUZ
items.scrolls.scroll.yngvi=manual of YNGVI
items.scrolls.scroll.gyfu=manual of GYFU
items.scrolls.scroll.raido=manual of RAIDO
items.scrolls.scroll.isaz=manual of ISAZ
items.scrolls.scroll.mannaz=manual of MANNAZ
items.scrolls.scroll.naudiz=manual of NAUDIZ
items.scrolls.scroll.berkanan=manual of BERKANAN
items.scrolls.scroll.odal=manual of ODAL
items.scrolls.scroll.tiwaz=manual of TIWAZ
items.scrolls.scroll.unknown_desc=An indecipherable technological rune is written on this memo. Who knows what it will do when read aloud?
items.scrolls.scroll.blinded=You can't read a manual while blinded.
items.scrolls.scroll.no_magic=You can't read a manual while tech immune.
items.scrolls.scroll.cursed=Your malfunctioning binder prevents you from invoking this manual's tech! A safety inspection form might be strong enough to still work though...
items.scrolls.scroll$placeholder.name=manual

items.scrolls.inventoryscroll.warning=Do you really want to cancel this manual usage? The manual wasn't previously identified, so it will be consumed anyway.
items.scrolls.inventoryscroll.yes=Yes, I'm positive
items.scrolls.inventoryscroll.no=No, I changed my mind

items.scrolls.scrollofidentify.name=inventory audit form
items.scrolls.scrollofidentify.inv_title=Identify an item
items.scrolls.scrollofidentify.it_is=Your item has been identified: %s.
items.scrolls.scrollofidentify.desc=This manual permanently reveals all of the secrets of a single item.

items.scrolls.scrolloflullaby.name=break time approval
items.scrolls.scrolloflullaby.sooth=The manual utters a soothing melody. You feel very sleepy.
items.scrolls.scrolloflullaby.desc=Reading this manual emits a soothing melody which will lull all who hear it into a deep technological sleep. For the reader and their allies the sleep is restorative.

items.scrolls.scrollofmagicmapping.name=facility blueprint form
items.scrolls.scrollofmagicmapping.layout=You are now aware of the level layout.
items.scrolls.scrollofmagicmapping.desc=When this manual is read, an image of crystal clarity will be etched into your memory, alerting you to the precise layout of the level and revealing all hidden secrets. The locations of items and creatures will remain unknown.

items.scrolls.scrollofmirrorimage.name=hologram projector manual
items.scrolls.scrollofmirrorimage.copies=The manual forms mirror images of you.
items.scrolls.scrollofmirrorimage.no_copies=The manual attempts to create mirror images of you, but they have nowhere to go.
items.scrolls.scrollofmirrorimage.desc=The authorization code on this manual will create two illusory twins of the reader. These mirror images act as weaker clones of the reader, and will chase down their enemies. They have no durability however, and will fade upon taking damage.

items.scrolls.scrollofretribution.name=union grievance
items.scrolls.scrollofretribution.blast=Powerful technological energy erupts from the manual!
items.scrolls.scrollofretribution.desc=This manual contains destructive energy which channels the reader's suffering outward into a blast of power. The weaker the reader is, the more damage they will deal. At very low health this manual can kill most enemies instantly.\n\nUsing the manual takes a toll on the user however, blinding and weakening them.

items.scrolls.scrollofrage.name=manual of rage
items.scrolls.scrollofrage.roar=The manual emits an enraging roar that echoes throughout the factory!
items.scrolls.scrollofrage.desc=When read aloud, this manual will unleash a great roar that draws all enemies to the reader, and enrages nearby ones.

items.scrolls.scrollofrecharging.name=battery replacement manual
items.scrolls.scrollofrecharging.surge=A surge of energy courses through your body, invigorating your sprayers!
items.scrolls.scrollofrecharging.desc=The raw technological power bound up in this memo will charge up all the user's sprayers over time when released.

items.scrolls.scrollofremovecurse.name=safety inspection form
items.scrolls.scrollofremovecurse.inv_title=Cleanse an item
items.scrolls.scrollofremovecurse.cleansed=Your item glows with a cleansing light, and a malevolent energy disperses!
items.scrolls.scrollofremovecurse.not_cleansed=Your item glows with a cleansing light, but nothing happens.
items.scrolls.scrollofremovecurse.spirit=Your manual frees the tormented spirit!
items.scrolls.scrollofremovecurse.desc=The authorization code on this manual will instantly strip any malfunctions from a single tool, badge, sprayer, PPE, or artifact.

items.scrolls.scrollofteleportation.name=reassignment form
items.scrolls.scrollofteleportation.tele=In a blink of an eye you were teleported to another location of the level.
items.scrolls.scrollofteleportation.no_tele=The teleportation tech fails.
items.scrolls.scrollofteleportation.cant_reach=You can't teleport there.
items.scrolls.scrollofteleportation.prompt=Choose a location to teleport
items.scrolls.scrollofteleportation.desc=The macro on this memo instantly transports the reader to a different location on the factory level. The manual prioritizes areas the reader hasn't been to before, though it is not able to teleport past locked doors or barricades. It can, however, reveal hidden doors that lead to new areas.

items.scrolls.scrollofterror.name=evacuation order
items.scrolls.scrollofterror.none=The manual emits a brilliant flash of red light.
items.scrolls.scrollofterror.one=The manual emits a brilliant flash of red light and the %s flees!
items.scrolls.scrollofterror.many=The manual emits a brilliant flash of red light and the mutated workers flee!
items.scrolls.scrollofterror.desc=When read, this manual will emit a flash of red light that will overwhelm all enemies in your field of view with terror, and they will turn and flee. Attacking a fleeing enemy will shorten the effect.

items.scrolls.scrolloftransmutation.name=part exchange form
items.scrolls.scrolloftransmutation.inv_title=Transmute an item
items.scrolls.scrolloftransmutation.nothing=Nothing interesting happens.
items.scrolls.scrolloftransmutation.morph=Your item morphs into something different!
items.scrolls.scrolloftransmutation.desc=This manual contains powerful transmutation tech. When used on an eligible item it will transform it into a different item of the same type. The tech will even preserve upgrades, modifications, and safety certifications. Manuals and canisters will be transmuted into their exotic equivalent, and vice-versa.

items.scrolls.scrollofupgrade.name=equipment requisition form
items.scrolls.scrollofupgrade.inv_title=Upgrade an item
items.scrolls.scrollofupgrade.weaken_curse=The equipment requisition form weakens the malfunction on your item.
items.scrolls.scrollofupgrade.remove_curse=The equipment requisition form cleanses the malfunction on your item!
items.scrolls.scrollofupgrade.desc=This manual will upgrade a single item or set of thrown tools. Sprayers will increase in power and number of charges, tools and PPE will deal and block more damage, thrown tool sets will be fully repaired and more durable, and the effects of badges will intensify.\n\nIt can even weaken or sometimes totally dispel malfunctions, though it is not as potent as a safety inspection form. Unfortunately, the upgrading tech can also erase modifications or safety certifications on higher level gear.



###exotic scrolls
items.scrolls.exotic.exoticscroll.kaunan=exotic manual of KAUNAN
items.scrolls.exotic.exoticscroll.sowilo=exotic manual of SOWILO
items.scrolls.exotic.exoticscroll.laguz=exotic manual of LAGUZ
items.scrolls.exotic.exoticscroll.yngvi=exotic manual of YNGVI
items.scrolls.exotic.exoticscroll.gyfu=exotic manual of GYFU
items.scrolls.exotic.exoticscroll.raido=exotic manual of RAIDO
items.scrolls.exotic.exoticscroll.isaz=exotic manual of ISAZ
items.scrolls.exotic.exoticscroll.mannaz=exotic manual of MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotic manual of NAUDIZ
items.scrolls.exotic.exoticscroll.berkanan=exotic manual of BERKANAN
items.scrolls.exotic.exoticscroll.odal=exotic manual of ODAL
items.scrolls.exotic.exoticscroll.tiwaz=exotic manual of TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=A glowing indecipherable technological rune is written on this black memo. It seems to be foreign to this land, who knows what it will do when read aloud?
items.scrolls.exotic.exoticscroll.discover_hint=You can craft this item via alchemy.

items.scrolls.exotic.scrollofsirenssong.name=manual of siren's song
items.scrolls.exotic.scrollofsirenssong.prompt=Choose a target
items.scrolls.exotic.scrollofsirenssong.no_target=The manual activates without a target.
items.scrolls.exotic.scrollofsirenssong.cancel=You must choose a target.
items.scrolls.exotic.scrollofsirenssong.desc=Reading this manual emits an alluring melody which will enthrall a targeted enemy, permanently turning them into an ally! Other enemies who hear it will be temporarily charmed.\n\nParticularly strong enemies can resist the enthrall effect, and will be charmed instead.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=enthralled
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=This creature has been bewitched by the tech of a manual of siren's song.\n\nAn enthralled character is permanently your ally, and will fight any enemies they encounter.

items.scrolls.exotic.scrollofantimagic.name=manual of anti-tech
items.scrolls.exotic.scrollofantimagic.desc=The authorization code on this manual will surround you with a technological aura that temporarily blocks all technological effects, harmful or helpful. This includes most technological item effects such as sprayers, manuals, badges, artifacts, modifications, and malfunctions. Elite PPE abilities are strong enough to work regardless however.

items.scrolls.exotic.scrollofchallenge.name=manual of challenge
items.scrolls.exotic.scrollofchallenge.desc=When read aloud, this manual will unleash a great roar that draws enemies to the user while simultaneously creating a small arena around them.\n\nAs long as the reader stays in this arena they will take 33% less damage from all sources (this is applied before other forms of damage reduction), and they will not lose satiety.\n\nThe size of the arena will scale with the size of the area the reader is in. It will be particularly small in some boss areas.
items.scrolls.exotic.scrollofchallenge$challengearena.name=challenge arena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=A technological arena has appeared around you, denoted by a billowing red fog.\n\nWhile standing in the fog, your hunger will not increase and you will take 33%% less damage from all sources. If you have any other sources of damage reduction (such as PPE), they will apply after the 33%% reduction.\n\nTurns remaining: %d.

items.scrolls.exotic.scrollofdivination.name=manual of divination
items.scrolls.exotic.scrollofdivination.nothing_left=There is nothing left to identify!
items.scrolls.exotic.scrollofdivination.desc=This manual will randomly identify four types of item that you don't currently know. The types identified can be a canister's color, a manual's rune, or a badge's microchip. The items identified won't necessarily be ones you're carrying.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Your manual of divination has identified the following items:

items.scrolls.exotic.scrollofdread.name=manual of dread
items.scrolls.exotic.scrollofdread.desc=When read, this manual will emit a flash of red light that will instill incredible terror in all enemies in your field of view. So great is this effect that they will rapidly try to flee from the entire factory, never to be seen again!\n\nJust like with terror, this effect can expire with time, or if the enemy is attacked.\n\nStrong-willed enemies, such as bosses, will be inflicted with regular terror instead.

items.scrolls.exotic.scrollofenchantment.name=manual of modification
items.scrolls.exotic.scrollofenchantment.inv_title=Enchant an item
items.scrolls.exotic.scrollofenchantment.weapon=Select an modification to apply to your tool.
items.scrolls.exotic.scrollofenchantment.armor=Select a safety certification to apply to your PPE.
items.scrolls.exotic.scrollofenchantment.cancel=cancel
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelling will still consume your manual of modification, are you sure?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Yes, I'm sure
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, I changed my mind
items.scrolls.exotic.scrollofenchantment.desc=This manual will infuse a tool or PPE with powerful technological energy. The reader even has some degree of control over which tech is imbued.

items.scrolls.exotic.scrollofforesight.name=manual of foresight
items.scrolls.exotic.scrollofforesight.desc=After reading this manual, the detail of nearby terrain will be constantly fed to the reader's mind in crystal clarity. This effect lasts for a considerable amount of time, and will reveal all hidden doors or traps, making searching unnecessary.

items.scrolls.exotic.scrollofmetamorphosis.name=manual of metamorphosis
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choose a talent to metamorphose.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choose a new talent to replace your metamorphosed talent with.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelling will still consume your manual of metamorphosis, are you sure?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorphose talent
items.scrolls.exotic.scrollofmetamorphosis.desc=This manual contains powerful transmutation tech, which will apply to the caster instead of to an item. The tech of this manual will let you select one talent, and replace it with one of five talents of the same tier from different janitor classes!\n\nThis effect can only apply to class talents, not talents gained from subclasses or PPE abilities. Talents that you cannot use will not be given as options.

items.scrolls.exotic.scrollofmysticalenergy.name=manual of mystical energy
items.scrolls.exotic.scrollofmysticalenergy.desc=The raw technological power bound up in this memo will, when released, charge a user's equipped artifacts over time.

items.scrolls.exotic.scrollofpassage.name=manual of passage
items.scrolls.exotic.scrollofpassage.desc=The macro on this memo instantly transports the reader to the nearest region first floor above them. Very handy for quickly getting to a supply closet.

items.scrolls.exotic.scrollofprismaticimage.name=manual of prismatic image
items.scrolls.exotic.scrollofprismaticimage.desc=The authorization code on this manual will create a colorful illusory twin of the reader. This prismatic image acts as a weaker clone of the reader, with similar defence but lower hp and damage.\n\nThe prismatic image will show itself when enemies are present, and will attempt to defend the reader.\n\nIf a prismatic image already exists, using this manual will fully heal it.

items.scrolls.exotic.scrollofpsionicblast.name=manual of psionic blast
items.scrolls.exotic.scrollofpsionicblast.ondeath=The Psionic Blast tears your mind apart...
items.scrolls.exotic.scrollofpsionicblast.desc=This manual contains incredible destructive energy that can be channeled to destroy the minds of all visible creatures.\n\nThere is significant feedback however, and the reader will also be damaged, blinded, and weakened. The more targets the manual hits, the less self-damage will be taken.



###spells
items.spells.alchemize.name=alchemize
items.spells.alchemize.prompt=Alchemize an Item
items.spells.alchemize.desc=This macro contains transmutative powers similar to those found in an alchemy pot. Each cast allows the user to turn an item (or stack of items) into company scrip or alchemical energy. Turning canisters or manuals into energy will even identify them!\n\nA few Alchemize uses are sold from shops, but many more can be made using alchemy by combining a seed, runestone, and a little alchemical energy.
items.spells.alchemize$wndalchemizeitem.sell=Turn into %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Turn 1 into %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Turn all into %dg
items.spells.alchemize$wndalchemizeitem.energize=Turn into %d energy
items.spells.alchemize$wndalchemizeitem.energize_1=Turn 1 into %d energy
items.spells.alchemize$wndalchemizeitem.energize_all=Turn all into %d energy

items.spells.beaconofreturning.name=beacon of returning
items.spells.beaconofreturning.preventing=The strong tech aura of this place prevents you from using the macro!
items.spells.beaconofreturning.creatures=The Psychic aura of neighbouring creatures doesn't allow you to teleport at this moment.
items.spells.beaconofreturning.set=The beacon was set at your current location.
items.spells.beaconofreturning.wnd_body=Setting will override the location the beacon was previously set to.\n\nReturning will return to your last set location and consume one use of the macro.
items.spells.beaconofreturning.wnd_set=Set
items.spells.beaconofreturning.wnd_return=Return
items.spells.beaconofreturning.desc_set=This beacon was set somewhere on floor %d.
items.spells.beaconofreturning.desc=This intricate macro grants the user the ability to return to a set location, regardless of distance. The macro will only be consumed by returning, it can be set as many times as you like, but it will only remember the most recent location it was set to.

items.spells.curseinfusion.name=malfunction infusion
items.spells.curseinfusion.inv_title=Malfunction an item
items.spells.curseinfusion.desc=This macro infuses a piece of equipment with the same powerful malignant tech present within THE ROGUE ASSEMBLY MACHINE. The item it is used on will immediately be malfunctioning, and any modification or safety certification it may have had will be overridden.\n\nIn the case of tools, PPE, and sprayers, the item will gain upgrades in addition to being malfunctioning. Malfunction infusion upgrades do not stack, and the upgrades are lost if the item becomes uncursed.\n\nMultiple malfunction infusions can also be used to change the malfunction on a tool or PPE.

items.spells.spell.ac_cast=CAST
items.spells.spell.no_magic=You can't cast macros while tech immune.
items.spells.spell.discover_hint=You can craft this item via alchemy.

items.spells.magicalinfusion.name=technological infusion
items.spells.magicalinfusion.inv_title=Infuse an item
items.spells.magicalinfusion.infuse=Your item is infused with arcane energy!
items.spells.magicalinfusion.desc=This macro possesses the same technological power as a equipment requisition form, but in a more stable form.\n\nIn addition to upgrading an item as normal it will never erase an modification, safety certification, or malfunction.

items.spells.magicalporter.name=technological porter
items.spells.magicalporter.inv_title=Port an item
items.spells.magicalporter.nowhere=There is nowhere for you to port an item to.
items.spells.magicalporter.desc=This macro will technologically transport any item it is cast on. Unlike a merchant's beacon however, the items will be transported to the entrance of the next boss floor.

items.spells.phaseshift.name=phase shift
items.spells.phaseshift.no_target=There is nothing to teleport there.
items.spells.phaseshift.desc=This chaotic macro will teleport any character it is aimed at to a random location on the current floor, and stun them for a significant amount of time. Powerful foes will be able to resist the stunning effect. This macro can be directed at a target or at the user themselves.

items.spells.reclaimtrap.name=reclaim trap
items.spells.reclaimtrap.no_trap=There is no trap there.
items.spells.reclaimtrap.desc_trap=The macro is currently ready to trigger a _%s._
items.spells.reclaimtrap.desc=This macro contains remnants of the mechanical energy of THE ROGUE ASSEMBLY MACHINE. When cast on an active trap, the power of the trap will become attached to you, allowing you to use the macro again to expel this power and trigger the trap's effect at any location you like.\n\nHowever, some traps may not function in all places, and only one trap can be stored at a time.

items.spells.recycle.name=recycle
items.spells.recycle.inv_title=Recycle an item
items.spells.recycle.recycled=Your item was recycled into: %s.
items.spells.recycle.desc=This macro contains a lesser form of transmutation tech. While it won't work on equipment, this macro will transform a manual, canister, seed, runestone, or tipped screw into a random item of the same type.

items.spells.summonelemental.name=summon elemental
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.imbue_prompt=Imbue an item
items.spells.summonelemental.desc=This macro channels the energy of the elemental embers used to make it, and will allow you to summon a friendly elemental to fight with you! Only one elemental can be summoned at a time, but the macro can be re-cast to return the elemental to you at no cost.
items.spells.summonelemental.desc_newborn=The macro is currently unimbued, and will summon a _newborn elemental_ without a ranged attack. You can imbue an identified canister of flammable aerosol, canister of liquid nitrogen, battery replacement manual, or part exchange form to power the macro up, causing future summons to be a full power elemental!
items.spells.summonelemental.desc_fire=The macro is currently hot to the touch, it will summon a _fire elemental_. You can imbue a different item, but the macro will lose its current imbue.
items.spells.summonelemental.desc_frost=The macro is currently cold to the touch, it will summon a _frost elemental_. You can imbue a different item, but the macro will lose its current imbue.
items.spells.summonelemental.desc_shock=The macro is currently radiating static energy, it will summon a _shock elemental_. You can imbue a different item, but the macro will lose its current imbue.
items.spells.summonelemental.desc_chaos=The macro is currently radiating chaotic energy, it will summon a _chaos elemental_. You can imbue a different item, but the macro will lose its current imbue.

items.spells.targetedspell.prompt=Choose a target
items.spells.targetedspell.inv_title=Infuse an item

items.spells.telekineticgrab.name=telekinetic grab
items.spells.telekineticgrab.cant_grab=You can't grab that.
items.spells.telekineticgrab.no_target=There's nothing to grab there.
items.spells.telekineticgrab.desc=This macro allows the caster to remotely grab all items at a location, or all thrown tools stuck to an enemy!\n\nIt can't be used to grab items that someone else owns, or to grab containers like chests.

items.spells.unstablespell.name=unstable macro
items.spells.unstablespell.desc=This small black square crystal has shifting runic symbols on each of its surfaces.\n\nWhen activated, it will trigger the effect of a random manual. The manual effect will always be combat focused if there are enemies in your field of view, and will always be non-combat focused otherwise.

items.spells.wildenergy.name=wild energy
items.spells.wildenergy.desc=This macro contains some of the malfunctioning energy which powered THE ROGUE ASSEMBLY MACHINE. When cast, it will recharge your sprayers and worn artifacts, while also triggering a random malfunctioning sprayer effect. You are able to choose a direction for this malfunctioning tech to shoot in, however.


###runestones
items.stones.inventorystone.ac_use=USE

items.stones.runestone$placeholder.name=runestone
items.stones.runestone.discover_hint=You can find this item randomly in the factory, or craft it via alchemy.

items.stones.stoneofaggression.name=stone of aggression
items.stones.stoneofaggression.desc=When this stone is thrown at an ally or enemy, all nearby enemies will prefer to attack that character for a short time. \n\nBoss enemies can resist the effect however, reducing the duration significantly and taking less damage from their minion's attacks.
items.stones.stoneofaggression$aggression.name=targeted
items.stones.stoneofaggression$aggression.desc=Manipulative tech is making all nearby enemies prefer to attack this character.\n\nTurns remaining: %s.

items.stones.stoneofaugmentation.name=stone of augmentation
items.stones.stoneofaugmentation.inv_title=Augment an item
items.stones.stoneofaugmentation.desc=This runestone possesses potent tech which can augment equipment to enhance one property at the cost of another.\n\nUsing on a tool will allow you to enhance either speed or damage. Thrown tools will also gain or lose durability in proportion with their speed.\n\nUsing on PPE will allow you to enhance either defense or dodging.
items.stones.stoneofaugmentation.discover_hint=You can buy this item in a supply closet, or craft it via alchemy.
items.stones.stoneofaugmentation$wndaugment.choice=What would you like to enhance?
items.stones.stoneofaugmentation$wndaugment.speed=Speed
items.stones.stoneofaugmentation$wndaugment.damage=Damage
items.stones.stoneofaugmentation$wndaugment.evasion=Dodging
items.stones.stoneofaugmentation$wndaugment.defense=Defense
items.stones.stoneofaugmentation$wndaugment.none=Remove Augmentation
items.stones.stoneofaugmentation$wndaugment.cancel=Never mind

items.stones.stoneofblast.name=stone of blast
items.stones.stoneofblast.desc=This runestone will instantly explode at the location it is thrown to. Just like a explosive charge, the explosion will deal damage to anything nearby.

items.stones.stoneofblink.name=stone of blink
items.stones.stoneofblink.desc=This runestone will teleport the user to the location it is thrown to.

items.stones.stoneofclairvoyance.name=stone of clairvoyance
items.stones.stoneofclairvoyance.desc=This stone will instantly reveal all tiles in a very wide area around where it is thrown. Its effect will even reach through walls.

items.stones.stoneofdeepsleep.name=stone of deep sleep
items.stones.stoneofdeepsleep.desc=When this stone is thrown at an enemy, it will put them into a deep technological sleep. Technologically slept enemies will sleep forever until disturbed.

items.stones.stoneofdetectmagic.name=stone of detect tech
items.stones.stoneofdetectmagic.inv_title=Detect an item
items.stones.stoneofdetectmagic.detected_none=You don't detect any tech affecting this item.
items.stones.stoneofdetectmagic.detected_both=You detect both positive and malevolent tech affecting this item!
items.stones.stoneofdetectmagic.detected_good=You detect positive tech affecting this item!
items.stones.stoneofdetectmagic.detected_bad=You detect malevolent tech affecting this item!
items.stones.stoneofdetectmagic.desc=This runestone is able to detect tech affecting an item. Using this stone on an unidentified item will tell you if it is affected by a malevolent malfunction and whether it is affected by positive tech such as an modification or upgrades.

items.stones.stoneofdisarming.name=stone of disarming
items.stones.stoneofdisarming.desc=This runestone holds tech that can disable malicious traps hidden throughout the factory. It will disarm up to 9 traps around the area it is thrown at.

items.stones.stoneofenchantment.name=stone of modification
items.stones.stoneofenchantment.inv_title=Enchant an item
items.stones.stoneofenchantment.weapon=Your tool glows in the darkness!
items.stones.stoneofenchantment.armor=Your PPE glows in the darkness!
items.stones.stoneofenchantment.desc=This runestone possesses enchanting tech. Unlike a equipment requisition form, it will not increase the direct power of an item, but will instead imbue a tool or PPE with an modification, granting it a new power.

items.stones.stoneoffear.name=stone of fear
items.stones.stoneoffear.desc=When this stone is thrown onto a character they will be overwhelmed with terror, and will turn and flee. Attacking a fleeing character will shorten the effect.

items.stones.stoneofflock.name=stone of flock
items.stones.stoneofflock.desc=This runestone summons technological sheep for a short time around the location it is thrown to.

items.stones.stoneofintuition.name=stone of intuition
items.stones.stoneofintuition.inv_title=Select an item
items.stones.stoneofintuition.desc=This runestone holds a weaker version of the tech found in manuals of identification. Rather than directly identifying an item, it will work on your intuition, allowing you to attempt to identify the type of a canister, manual, or badge by guessing.
items.stones.stoneofintuition.break_info=You can use stones of intuition twice before one breaks, _your next use won't consume a stone_.
items.stones.stoneofintuition.break_warn=You've used a stone of intuition previously, so _your next use will consume a stone_.
items.stones.stoneofintuition$wndguess.text=Guess what the type of the unidentified item is. If you guess correctly, the type will be identified!
items.stones.stoneofintuition$wndguess.correct=Correct. The item's type has been identified!
items.stones.stoneofintuition$wndguess.incorrect=Your guess was incorrect.
items.stones.stoneofintuition$wndguess.break=Your stone of intuition crumbles to dust...

items.stones.stoneofshock.name=stone of shock
items.stones.stoneofshock.desc=This runestone unleashes a blast of electrical energy which briefly stuns all nearby targets, and grants the thrower sprayer charge for each target hit.


###trinkets
items.trinkets.chaoticcenser.name=chaotic censer
items.trinkets.chaoticcenser.spew=Your censer is about to spew: %s.
items.trinkets.chaoticcenser.desc=After some time in the alchemy pot this incense-burning censer appears to be producing smoke all on its own! These gasses build up and will spew forth from the censer toward enemies at semi-random intervals. It seems capable of producing all sorts of gasses, but you'll get a moment of warning just before the censer activates.
items.trinkets.chaoticcenser.typical_stats_desc=Typically this trinket will spawn a harmful gas near an enemy roughly every _%d_ turns. Gasses will only appear when enemies are present. At higher levels these gases are more likely to be exotic and powerful.
items.trinkets.chaoticcenser.stats_desc=At its current level, this trinket will spawn a harmful gas near an enemy roughly every _%d_ turns. Gasses will only appear when enemies are present. At higher levels these gases are more likely to be exotic and powerful.

items.trinkets.crackedspyglass.name=cracked spyglass
items.trinkets.crackedspyglass.desc=This handheld telescope would be a demonstration of great and precise workmanship, if it weren't for the crack along its front lens. The spyglass seems to be helping you by revealing new items in the factory, but due to its flaw the revealed items are quite hard to see!
items.trinkets.crackedspyglass.typical_stats_desc=Typically this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc=At its current level, this trinket has a _%1$s%% chance_ to create an extra hidden item on each non-boss floor.
items.trinkets.crackedspyglass.stats_desc_upgraded=At its current level, this trinket has a _100%% chance_ to create an extra hidden item on each non-boss floor, and a _%1$s%% chance_ to create a second extra hidden item.

items.trinkets.dimensionalsundial.name=dimensional sundial
items.trinkets.dimensionalsundial.warning=Your sundial isn't casting a shadow, you feel uneasy.
items.trinkets.dimensionalsundial.desc=This small handheld sundial is somehow able to cast a shadow in the depths of the factory, even if you aren't holding it upright. Even more strangely, the shadow's position seems to have no relation to the sun in this world. When no shadow is cast, the sundial seems to attract danger.
items.trinkets.dimensionalsundial.typical_stats_desc=Typically this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).
items.trinkets.dimensionalsundial.stats_desc=At its current level, this trinket will reduce the spawning rate of enemies by _%1$d%%_ during the daytime in real life (8am-8pm), and increase the spawning rate of enemies by _%2$d%%_ at nighttime (8pm-8am).

items.trinkets.exoticcrystals.name=exotic crystals
items.trinkets.exoticcrystals.desc=These small pink crystals have the same shape as crystals of alchemical energy. While they can't be used for energy directly, they seem to be somehow influencing the canisters and manuals you find.
items.trinkets.exoticcrystals.typical_stats_desc=Typically this trinket will replace _%s%%_ of canister or manual drops with their exotic equivalents. This does not affect canisters of steroids, manuals of upgrade, or items that are generated to help solve hazard rooms.
items.trinkets.exoticcrystals.stats_desc=At its current level this trinket will replace _%s%%_ of canister or manual drops with their exotic equivalents. This does not affect canisters of steroids, manuals of upgrade, or items that are generated to help solve hazard rooms.

items.trinkets.eyeofnewt.name=eye of newt
items.trinkets.eyeofnewt.desc=This warning yellow and black newt's eye is a common ingredient, now enhanced into a trinket. The eye seems to be reducing your vision in exchange for letting you see things in other ways.
items.trinkets.eyeofnewt.typical_stats_desc=Typically this trinket will reduce your vision range by _%1$s%%_, but will also grant you thermal imaging on enemies within _%2$d_ tiles.
items.trinkets.eyeofnewt.stats_desc=At its current level this trinket will reduce your vision range by _%1$s%%_, but will also grant you thermal imaging on enemies within _%2$d_ tiles.

items.trinkets.ferrettuft.name=ferret tuft
items.trinkets.ferrettuft.desc=A tuft of silky white ferret fur, held together by a Lime green ribbon tied into a rivet gun. Ferrets are known for their agility, mischievousness, and lack of integrity. Some of that power seems to radiate from the trinket, enhancing the dodging of anything nearby.
items.trinkets.ferrettuft.typical_stats_desc=Typically this trinket will increase the dodging of all characters by _%1$s%%_.
items.trinkets.ferrettuft.stats_desc=At its current level this trinket will increase the dodging of all characters by _%1$s%%_.

items.trinkets.mimictooth.name=mimic tooth
items.trinkets.mimictooth.desc=This large sharp tooth must have been pulled from a very unhappy mimic. It seems to be influencing the mimics of the factory, making them more frequent and dangerous.
items.trinkets.mimictooth.typical_stats_desc=Typically this trinket will make all kinds of mimic _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each factory floor will also have a _%2$s%%_ chance to contain an extra stealthy ebony mimic.
items.trinkets.mimictooth.stats_desc=At its current level this trinket will make all kinds of mimic _%1$sx_ more common and much more difficult to detect, but will also increase the amount of loot they drop. Each factory floor will also have a _%2$s%%_ chance to contain an extra stealthy ebony mimic.

items.trinkets.mossyclump.name=mossy clump
items.trinkets.mossyclump.desc=This clump of wet moss seems to hold onto its moisture no matter how hard you squeeze it. It seems to be technologically tied to the factory itself, making grass and water more likely to appear.
items.trinkets.mossyclump.typical_stats_desc=Typically this trinket will make _%d%%_ of unthemed floors become filled with either water or grass instead.\n\nThis trinket costs a larger amount of energy to upgrade.
items.trinkets.mossyclump.stats_desc=At its current level this trinket will make _%d%%_ of unthemed floors become filled with either water or grass instead.\n\nThis trinket costs a larger amount of energy to upgrade.

items.trinkets.parchmentscrap.name=memo scrap
items.trinkets.parchmentscrap.desc=This little scrap of memo looks like it came from a manual. It has retained some of its tech, and it seems to be influencing tools and PPE found in the factory.
items.trinkets.parchmentscrap.typical_stats_desc=Typically this trinket will make modifications and safety certifications _%dx_ as common, and malfunctions on tools and PPE _%sx_ as common. Malfunctions on sprayers, badges, or artifacts are not affected.\n\nThis trinket costs a larger amount of energy to upgrade.
items.trinkets.parchmentscrap.stats_desc=At its current level this trinket will make modifications and safety certifications _%dx_ as common, and malfunctions on tools and PPE _%sx_ as common. Malfunctions on sprayers, badges, or artifacts are not affected.\n\nThis trinket costs a larger amount of energy to upgrade.

items.trinkets.petrifiedseed.name=petrified seed
items.trinkets.petrifiedseed.desc=This seed has been fossilised, either by slow geological processes or by tech. The seed seems to be technologically influencing the flora of the factory, occasionally replacing plant seeds with runestones.
items.trinkets.petrifiedseed.typical_stats_desc=Typically this trinket will cause trampled grass to drop runestones instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.
items.trinkets.petrifiedseed.stats_desc=At its current level this trinket will cause trampled grass to drop runestones instead of seeds _%1$s%%_ of the time, and will also cause high grass to drop items _%2$s%%_ more often.

items.trinkets.ratskull.name=rat skull
items.trinkets.ratskull.desc=This macabre trinket isn't much larger than the skull of a normal rat, which is somehow a rarity down in this factory. The skull's technological influence seems to attract the more rare denizens of the factory, making them appear far more often.
items.trinkets.ratskull.typical_stats_desc=Typically this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting crystal mimics and armored statues, however.
items.trinkets.ratskull.stats_desc=At its current level this trinket will make rare exotic enemies _%dx_ as likely to appear. The skull is only half as effective at attracting crystal mimics and armored statues, however.

items.trinkets.saltcube.name=salt cube
items.trinkets.saltcube.desc=This large salt crystal was cut into an almost perfect cube shape, and it somehow managed to drain half the water from the alchemy pot instead of dissolving. It seems to be technologically dehydrating and preserving the food you eat, extending the satiety you get, but also lessening your health restoration when not starving.
items.trinkets.saltcube.typical_stats_desc=Typically this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_ unless the floor is locked.
items.trinkets.saltcube.stats_desc=At its current level this trinket will increase the amount of time before you grow hungry by _%1$s%%_, but will also reduce your rate of health regeneration by _%2$s%%_ unless the floor is locked.

items.trinkets.shardofoblivion.name=shard of oblivion
items.trinkets.shardofoblivion.desc=After stewing in the alchemy pot, this small shard of malfunctioning metal has changed to be made of... nothing? Light seems to bend around it, and it hovers in place when you aren't holding it. The shard seems to be technologically drawing power from your ignorance, so it's probably best to not think about it too much.
items.trinkets.shardofoblivion.typical_stats_desc=Typically this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.trinkets.shardofoblivion.stats_desc=At its current level this trinket will increase the rate that enemies drop loot by 20%% for each piece of unidentified equipment you have equipped or recently used, to a max of _%d item(s)_. The shard will also prevent you from identifying equipment, but can be used to manually identify items that are ready for it.
items.trinkets.shardofoblivion.ac_identify=IDENTIFY
items.trinkets.shardofoblivion.identify_prompt=Identify an Item
items.trinkets.shardofoblivion.identify_ready=An item is ready to identify: %s. Use your Shard of Oblivion on it to identify it.
items.trinkets.shardofoblivion.identify_ready_worn=Your worn items are now all ready to identify. Use your Shard of Oblivion on items to identify them.
items.trinkets.shardofoblivion.identify_not_yet=That item isn't ready to be identified yet.
items.trinkets.shardofoblivion.identify=You identify the item!
items.trinkets.shardofoblivion$wandusetracker.name=Unidentified Sprayer Used
items.trinkets.shardofoblivion$wandusetracker.desc=You have recently used an unidentified sprayer, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Unidentified Thrown Tool Used
items.trinkets.shardofoblivion$thrownusetracker.desc=You have recently used an unidentified thrown tool, which counts as one piece of used unidentified equipment for the shard of oblivion for a little while.\n\nTurns remaining: %s.

items.trinkets.thirteenleafclover.name=thirteen leaf clover
items.trinkets.thirteenleafclover.desc=Somehow stewing in the alchemy pot has caused this clover to grow a bunch of extra leaves! It's not really clear if this trinket is lucky or unlucky, perhaps this trinket will make your luck more chaotic?
items.trinkets.thirteenleafclover.typical_stats_desc=Typically this trinket will cause you to deal maximum damage _%1$d%%_ of the time, and minimum damage _%2$d%%_ of the time.
items.trinkets.thirteenleafclover.stats_desc=At its current level this trinket will cause you to deal maximum damage _%1$d%%_ of the time, and minimum damage _%2$d%%_ of the time.

items.trinkets.trapmechanism.name=trap mechanism
items.trinkets.trapmechanism.desc=The core mechanism of one of the factory's pitfall traps, carefully carved out of the floor so it can be carried. It seems to be technologically tied to the factory itself, making hazardous terrain more common but also increasing your affinity towards it.
items.trinkets.trapmechanism.typical_stats_desc=Typically this trinket will make _%1$d%%_ of unthemed floors become filled with either traps or chasms instead. Additionally, _%2$d%%_ of the factory's hidden traps will instead be visible.
items.trinkets.trapmechanism.stats_desc=At its current level this trinket will make _%1$d%%_ of unthemed floors become filled with either traps or chasms instead. Additionally, _%2$d%%_ of the factory's hidden traps will instead be visible.

items.trinkets.vialofblood.name=vial of blood
items.trinkets.vialofblood.desc=This thin vial contains the blood of some denizen of the factory, it moves slowly as you rotate the vial. It seems to be technologically enhancing stronger healing effects, but also delaying them.
items.trinkets.vialofblood.typical_stats_desc=Typically this trinket will increase the overall health you gain from drinking first-aid sprays, waterskins, or wells of health by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with janitor level).
items.trinkets.vialofblood.stats_desc=At its current level this trinket will increase the overall health you gain from drinking first-aid sprays, waterskins, or wells of health by _%1$s%%_. However, these healing effects will also occur more slowly, regenerating a maximum of _%2$s_ HP per turn (this scales with janitor level).

items.trinkets.wondrousresin.name=wondrous resin
items.trinkets.wondrousresin.desc=This shimmering blue resin appears to have the distilled essence of a malfunctioning sprayer's tech. The tech from the alchemy pot has seemed to stabilize it somewhat, and it's now affecting your sprayers.
items.trinkets.wondrousresin.typical_stats_desc=Typically this trinket will brute force malfunctioning sprayer effects to become neutral or positive _%1$s%%_ of the time, and will cause uncursed sprayers to fire an additional neutral or positive malfunctioning spray _%2$s%%_ of the time.\n\nThis trinket costs a larger amount of energy to upgrade.
items.trinkets.wondrousresin.stats_desc=At its current level this trinket will brute force malfunctioning sprayer effects to become neutral or positive _%1$s%%_ of the time, and will cause uncursed sprayers to fire an additional neutral or positive malfunctioning spray _%2$s%%_ of the time.\n\nThis trinket costs a larger amount of energy to upgrade.

items.trinkets.trinketcatalyst.name=technological catalyst
items.trinkets.trinketcatalyst.window_title=create a trinket
items.trinkets.trinketcatalyst.window_text=The water begins to glow as you add the catalyst. There are a few nearby items you could imbue with energy to turn into a technological trinket.
items.trinkets.trinketcatalyst.desc=This ball of technological warning yellow dust glimmers in the darkness of the factory. This catalyst can be used at an alchemy pot with a little alchemical energy to produce a unique trinket item.\n\nTrinkets provide various different effects that slightly alter the factory or its inhabitants. Trinkets can be upgraded with more energy to make their effect more powerful, or dropped to forego the effect entirely.
items.trinkets.trinketcatalyst$randomtrinket.name=random trinket
items.trinkets.trinketcatalyst$randomtrinket.desc=One nearby item is stuck inside a pouch that you can't get open.\n\nThe alchemy process will dissolve the pouch away, but you won't know what trinket you'll get until you do it!

items.trinkets.trinket.discover_hint=This item has a chance to be an option whenever you craft a trinket via alchemy.
items.trinkets.trinket$placeholder.name=trinket

###wands
items.wands.cursedwand.ondeath=You were killed by your own %s.
items.wands.cursedwand.nothing=Nothing happens.
items.wands.cursedwand.mass_invuln=Brilliant light erupts from your sprayer!
items.wands.cursedwand.petrify=You suddenly freeze in place!
items.wands.cursedwand.grass=Grass erupts around you!
items.wands.cursedwand.fire=You smell burning...
items.wands.cursedwand.transmogrify_wand=Your sprayer transmogrifies into a different item!
items.wands.cursedwand.transmogrify_other=Your item transmogrifies into something different!
items.wands.cursedwand.disguise=Your appearance changes before your eyes!
items.wands.cursedwand.supernova=A blazing ball of energy starts to grow. You might want to run!
items.wands.cursedwand.supernova_positive=A blazing ball of energy starts to grow, but it feels safe somehow.
items.wands.cursedwand.sinkhole=The ground starts to give way around you!
items.wands.cursedwand.sinkhole_positive=The ground starts to give way, but feels solid enough beneath you.
items.wands.cursedwand.gravity=Gravity suddenly starts to pull in random directions!
items.wands.cursedwand.gravity_positive=Gravity suddenly starts to pull in random directions, but this doesn't seem to affect you.
items.wands.cursedwand.gravity_end=The gravity chaos ends.

items.wands.damagewand.upgrade_stat_name_1=Tech Damage

items.wands.wand.ac_zap=SPRAY
items.wands.wand.fizzles=Your sprayer fizzles; it must not have enough charge.
items.wands.wand.no_magic=Your sprayer fizzles; you cannot use sprayers while tech immune.
items.wands.wand.self_target=You can't target yourself!
items.wands.wand.identify=You are now familiar enough with your sprayer to identify it.
items.wands.wand.resin_one=This sprayer has gained _1 level_ from arcane resin.
items.wands.wand.resin_many=This sprayer has gained _%d levels_ from arcane resin.
items.wands.wand.cursed=This sprayer is malfunctioning, making its tech chaotic and random.
items.wands.wand.not_cursed=This sprayer is free of malevolent tech.
items.wands.wand.curse_discover=This %s is malfunctioning!
items.wands.wand.prompt=Choose a location to spray
items.wands.wand$placeholder.name=sprayer

items.wands.wandofblastwave.name=sprayer of concussive blast
items.wands.wandofblastwave.staff_name=power washer of concussive blast
items.wands.wandofblastwave.ondeath=You killed yourself with your own Sprayer of Concussive Blast...
items.wands.wandofblastwave.knockback_ondeath=The collision killed you...
items.wands.wandofblastwave.desc=This sprayer is made of a sort of marbled stone, with company scrip trim and a round black microchip at the tip. It feels very weighty in your hand.
items.wands.wandofblastwave.typical_stats_desc=This sprayer shoots a bolt which violently detonates at a target location. The brute force of this blast typically deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.stats_desc=This sprayer shoots a bolt which violently detonates at a target location. The brute force of this blast deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.upgrade_stat_name_2=Knockback
items.wands.wandofblastwave.bmage_desc=When _the Battlemage_ strikes a paralyzed enemy with a power washer of concussive blast, it will consume the paralysis to deal a burst of bonus tech damage. This has a short cooldown per-enemy.
items.wands.wandofblastwave.eleblast_desc=An elemental blast with a power washer of concussive blast deals 67% damage and knocks all enemies outside of the blast area.

items.wands.wandofcorrosion.name=sprayer of acid spray
items.wands.wandofcorrosion.staff_name=power washer of acid spray
items.wands.wandofcorrosion.desc=This sprayer has an ashen body which opens to a brilliant orange microchip.
items.wands.wandofcorrosion.stats_desc=This sprayer shoots a bolt which explodes into a cloud of highly corrosive gas at a targeted location. Anything caught inside this cloud will take increasing damage over time, starting at _%d damage._
items.wands.wandofcorrosion.upgrade_stat_name_1=Acid Spray Damage
items.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volume
items.wands.wandofcorrosion.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of acid spray, the enemy has a chance to become oozed.
items.wands.wandofcorrosion.eleblast_desc=An elemental blast with a power washer of acid spray inflicts enemies with 4 turns of acid spray, starting at 6 damage.

items.wands.wandofcorruption.name=sprayer of override signal
items.wands.wandofcorruption.staff_name=power washer of override signal
items.wands.wandofcorruption.already_corrupted=That character cannot be influenced further.
items.wands.wandofcorruption.desc=This sprayer radiates chaotic dark energy, if that weren't already obvious from the small decorative skull shaped onto its tip.
items.wands.wandofcorruption.stats_desc=This sprayer will release a blast of corrupting energy which will debuff enemies and eventually bend them to your will. Enemies are able to resist the override signal, but weakened enemies are much easier to corrupt than healthy ones.
items.wands.wandofcorruption.upgrade_stat_name_1=Corrupting Power
items.wands.wandofcorruption.upgrade_stat_name_2=Debuff Duration
items.wands.wandofcorruption.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of override signal, the enemy has a chance to become amoked.
items.wands.wandofcorruption.eleblast_desc=An elemental blast with a power washer of override signal inflicts enemies with 5 turns of amok.

items.wands.wandofdisintegration.name=sprayer of plasma cutter
items.wands.wandofdisintegration.staff_name=power washer of plasma cutter
items.wands.wandofdisintegration.desc=This sprayer is made from a solid smooth chunk of obsidian, with a deep purple light running up its side, ending at the tip. It glows with destructive energy, waiting to shoot forward.
items.wands.wandofdisintegration.stats_desc=This sprayer shoots a beam that pierces any obstacle, and will go farther the more it is upgraded. The beam deals _%1$d-%2$d damage,_ and will also deal bonus damage for each enemy and wall it penetrates.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max Range
items.wands.wandofdisintegration.bmage_desc=When wielded by _the Battlemage_, a power washer of plasma cutter has increased attack range, as if it had a projecting modification.
items.wands.wandofdisintegration.eleblast_desc=An elemental blast with a power washer of plasma cutter deals 100% damage and pierces through walls.

items.wands.wandoffireblast.name=sprayer of blowtorch
items.wands.wandoffireblast.staff_name=power washer of blowtorch
items.wands.wandoffireblast.desc=This sprayer is made from red-lacquered wood with warning yellow leaf used liberally to make it look quite regal. It crackles and hisses at the tip, eager to unleash its powerful tech.
items.wands.wandoffireblast.stats_desc=This sprayer blasts out a cone of fire when used. Its next attack will consume _%1$d charges_ and deal _%2$d-%3$d damage._ The more charges the sprayer uses, the larger and stronger the effect.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_2=2 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_3=3 Charge Damage
items.wands.wandoffireblast.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of blowtorch, there is a chance for it to produce an explosion that damages enemies and consumes all nearby fire! This chance increases the more fire is adjacent to the enemy.
items.wands.wandoffireblast.eleblast_desc=An elemental blast with a power washer of blowtorch deals 100% damage, bursts open doors, and sets enemies and terrain on fire.

items.wands.wandoffrost.name=sprayer of liquid nitrogen
items.wands.wandoffrost.staff_name=power washer of liquid nitrogen
items.wands.wandoffrost.desc=This sprayer seems to be made out of some kind of technological ice. It grows brighter towards its rounded tip. It feels very cold when held, but somehow your hand stays warm.
items.wands.wandoffrost.stats_desc=This sprayer shoots blasts of icy energy toward your foes, dealing _%1$d-%2$d damage_ and chilling. The effect seems stronger in water. Enemies that are already chilled or frozen take less damage from this sprayer.
items.wands.wandoffrost.upgrade_stat_name_2=Chill Duration
items.wands.wandoffrost.bmage_desc=When _the Battlemage_ strikes a chilled enemy with a power washer of liquid nitrogen, they have a chance to instantly freeze. This chance becomes greater the more chilled they are.
items.wands.wandoffrost.eleblast_desc=An elemental blast with a power washer of liquid nitrogen deals 100% damage, freezes enemies, and puts out fires.

items.wands.wandoflightning.name=sprayer of lightning
items.wands.wandoflightning.staff_name=power washer of lightning
items.wands.wandoflightning.ondeath=You killed yourself with your own Sprayer of Lightning...
items.wands.wandoflightning.desc=This sprayer is made out of solid metal, making it surprisingly heavy. Two prongs curve together at the tip, and electricity arcs between them.
items.wands.wandoflightning.stats_desc=This sprayer sends powerful lightning arcing through whatever it is shot at, dealing _%1$d-%2$d damage._ This electricity will arc to nearby characters, and spreads more easily in water. The arcs from this sprayer can damage you, but won't hurt your allies.
items.wands.wandoflightning.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of lightning, he has a chance to electrically charge himself for 10 turns. While charged the Battlemage is immune to lightning damage and will arc lightning further.
items.wands.wandoflightning.eleblast_desc=An elemental blast with a power washer of lightning deals 100% damage, stuns enemies for 5 turns, and electrifies water.
items.wands.wandoflightning$lightningcharge.name=Electrically charged
items.wands.wandoflightning$lightningcharge.desc=The Battlemage is currently charged with energy, granting him immunity to his power washer of lightning and increasing the range that lightning can arc from it.\n\nTurns Remaining: %s.

items.wands.wandoflivingearth.name=sprayer of rapid-cure cement
items.wands.wandoflivingearth.staff_name=power washer of rapid-cure cement
items.wands.wandoflivingearth.desc=This sprayer is made from a curious rock, with bands of glowing yellow energy. The rocks seem to shift slightly as you grip the sprayer, as if they can feel your hand.
items.wands.wandoflivingearth.stats_desc=This sprayer sends bolts of technological rock at enemies, dealing _%1$d-%2$d damage._ The rocks will then re-form around the user, granting them PPE in proportion to the damage dealt. If enough PPE is built, it will form into a rock guardian when the sprayer is next zapped.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.wands.wandoflivingearth.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of rapid-cure cement, some of the damage dealt is returned as rock PPE.
items.wands.wandoflivingearth.eleblast_desc=An elemental blast with a power washer of rapid-cure cement deals 50% damage, and heals an active earthen guardian for each enemy hit.
items.wands.wandoflivingearth$rockarmor.name=rock PPE
items.wands.wandoflivingearth$rockarmor.desc=Technological rocks are surrounding your body, when you are attacked they will attempt to block for you, and will reduce the damage you take by 50%%. Each damage blocked scrapes away some of the rock however.\n\nRemaining PPE: %1$d.\n\nIf enough rock is built around you, the next spray from your sprayer of rapid-cure cement will cause the rocks to form up into a guardian which will fight with you.\n\nArmor needed for Guardian: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=This earthen guardian is also benefitting from Power of Many. Turns Remaining: %d.
items.wands.wandoflivingearth$earthguardian.name=earthen guardian
items.wands.wandoflivingearth$earthguardian.desc=The rocks from your sprayer of rapid-cure cement have formed into a protective earthen guardian! This rocky protector will attack nearby enemies, which will brute force them to attack the guardian instead of you. When all nearby threats are gone, the guardian will re-form around you, and will return when you next use your sprayer.
items.wands.wandoflivingearth$earthguardian.wand_info=The guardian's defensive power is tied to the level of your sprayer. It currently blocks _%1$d-%2$d damage._
items.wands.wandoflivingearth$earthguardian.discover_hint=You can find this character with a specific sprayer.

items.wands.wandofmagicmissile.name=sprayer of tech missile
items.wands.wandofmagicmissile.staff_name=power washer of tech missile
items.wands.wandofmagicmissile.desc=This fairly plain sprayer launches missiles of pure technological energy. While the sprayer itself lacks any special effects, it has more available charges and can briefly empower other sprayers when upgraded.
items.wands.wandofmagicmissile.stats_desc=Each bolt from this sprayer deals _%1$d-%2$d damage,_ and will briefly empower other sprayers if it is upgraded.
items.wands.wandofmagicmissile.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of tech missile, all of his sprayers will gain charge in addition to his power washer.
items.wands.wandofmagicmissile.eleblast_desc=An elemental blast with a power washer of tech missile deals 50% damage, and grants the bio-hazard tech 15 turns of recharging.
items.wands.wandofmagicmissile.discover_hint=One of the janitorial crew starts with this item.
items.wands.wandofmagicmissile$magiccharge.name=tech charge
items.wands.wandofmagicmissile$magiccharge.desc=Your sprayer of tech missile has fed power back into your sprayers, boosting the effective level of the next spray they make.\n\nYour sprayers are boosted to: +%d.\n\nTurns of tech charge remaining: %s.

items.wands.wandofprismaticlight.name=sprayer of laser beam
items.wands.wandofprismaticlight.staff_name=power washer of laser beam
items.wands.wandofprismaticlight.desc=This sprayer is made of a solid piece of translucent crystal, like a long chunk of smooth glass. Small bits of colorful light dance around the tip of the sprayer, eager to burst forth.
items.wands.wandofprismaticlight.stats_desc=This sprayer shoots rays of light which cut through the darkness of the factory, revealing hidden areas and traps. The beam can blind enemies, and deals _%1$d-%2$d damage._ Corrupted and overworked employee foes will burn in the bright light of the sprayer, taking bonus damage.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Light Duration
items.wands.wandofprismaticlight.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of laser beam, they will be crippled for a duration that scales with power washer level.
items.wands.wandofprismaticlight.eleblast_desc=An elemental blast with a power washer of laser beam deals 67% damage, reveals all terrain in the blast, and blinds enemies for 5 turns.

items.wands.wandofregrowth.name=sprayer of regrowth
items.wands.wandofregrowth.staff_name=power washer of regrowth
items.wands.wandofregrowth.desc=This sprayer is made from a thin shaft of expertly carved wood. Somehow it is still alive and vibrant, bright green like a young tree's core. "When life ceases new life always begins to grow... The eternal cycle always remains!"
items.wands.wandofregrowth.stats_desc=When used, this sprayer will blast technological regrowth energy outward in a cone, causing grass, roots, and rare plants to spring to life. Its next spray will consume _%1$d charges_. The more charges the sprayer uses, the larger and stronger the effect.
items.wands.wandofregrowth.degradation=After another _%d charges_ this sprayer will start failing to produce plants and fresh grass. This limit is increased by leveling up or upgrading the sprayer.
items.wands.wandofregrowth.upgrade_stat_name_1=Grass Per Charge
items.wands.wandofregrowth.upgrade_stat_name_2=Total Grass Limit
items.wands.wandofregrowth.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of regrowth, and either are standing on grass, he will gain herbal healing in proportion with the damage dealt.
items.wands.wandofregrowth.eleblast_desc=An elemental blast with a power washer of regrowth roots enemies and grows grass randomly over the blasts area.
items.wands.wandofregrowth$dewcatcher.name=Dewcatcher
items.wands.wandofregrowth$dewcatcher.desc=Dewcatchers are wondrous plants that fill themselves with technological dew. They attempt to camouflage as grass to avoid attention, but their bulges of collected dew give them away.
items.wands.wandofregrowth$dewcatcher.discover_hint=You can find this plant with a specific sprayer.
items.wands.wandofregrowth$seedpod.name=Seed Pod
items.wands.wandofregrowth$seedpod.desc=Seed Pods are technological plants that produce seeds from other plant types, rather than any seeds of their own. They somehow manage to spread despite having no seed of their own.
items.wands.wandofregrowth$seedpod.discover_hint=You can find this plant with a specific sprayer.
items.wands.wandofregrowth$lotus.name=Warning Yellow Lotus
items.wands.wandofregrowth$lotus.desc=The warning yellow lotus is a mystical plant that can only be conjured by a powerful sprayer of regrowth. Its aura enhances all plants and plant effects, but it burns through its energy and dies after a short time.
items.wands.wandofregrowth$lotus.wand_info=This lotus was produced by a _+%1$d_ sprayer of regrowth. All plants in its effect will _instantly trigger_ if they are planted on a character. Plants will also have a _%2$d%% chance_ to drop their seed, and tipped screws will use _%3$d%% less durability_.
items.wands.wandofregrowth$lotus.discover_hint=You can find this plant with a specific sprayer, after upgrading it several times.

items.wands.wandoftransfusion.name=sprayer of bio-gel transfer
items.wands.wandoftransfusion.staff_name=power washer of bio-gel transfer
items.wands.wandoftransfusion.ondeath=You killed yourself with your own Sprayer of Bio-Gel Transfer...
items.wands.wandoftransfusion.charged=Your power washer is charged with the life energy of your enemy!
items.wands.wandoftransfusion.desc=A fairly plainly shaped sprayer, it stands out due to its fuchsia hue and pitch black microchip at the tip.
items.wands.wandoftransfusion.stats_desc=When used on allies or charmed enemies, this sprayer will sap _%1$d of the user's health_ to heal or shield the ally for _%2$d health._ When used on enemies, the sprayer briefly charms them while applying _%3$d shielding_ to the user. Hostile overworked employee will take _%4$d-%5$d damage_ instead of being charmed.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Self-Shielding
items.wands.wandoftransfusion.upgrade_stat_name_3=Overworked Employee Damage
items.wands.wandoftransfusion.bmage_desc=When _the Battlemage_ strikes a charmed enemy with a power washer of bio-gel transfer, he will gain shielding and his next spray with the power washer will not cost any health.
items.wands.wandoftransfusion.eleblast_desc=An elemental blast with a power washer of bio-gel transfer charms enemies, heals allies, and deals 100% damage to overworked employee enemies.

items.wands.wandofwarding.name=sprayer of motion sensor
items.wands.wandofwarding.staff_name=power washer of motion sensor
items.wands.wandofwarding.no_more_wards=Your sprayer can't sustain any more wards.
items.wands.wandofwarding.bad_location=You can't place a ward there.
items.wands.wandofwarding.desc=This short metal sprayer has a bright purple microchip floating above its tip.
items.wands.wandofwarding.stats_desc=Rather than directly damaging an enemy, this sprayer will summon stationary wards and sentries. Wards can be summoned anywhere, even through walls if you have vision. This sprayer can sustain _%d energy_ worth of wards at a time.
items.wands.wandofwarding.upgrade_stat_name_1=Ward Damage
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.wands.wandofwarding.bmage_desc=When _the Battlemage_ strikes an enemy with a power washer of motion sensor, all active wards and sentries have a chance to be healed.
items.wands.wandofwarding.eleblast_desc=An elemental blast with a power washer of motion sensor heals all wards and sentries in the blast area.
items.wands.wandofwarding$ward.desc_generic_ward=This ward will automatically spray any enemy which comes into its range of vision.\n\nZapping this ward with your sprayer of motion sensor will upgrade it.\n\nWards have a limited number of sprays before dissipating.
items.wands.wandofwarding$ward.desc_generic_sentry=This sentry has the same firepower as a ward, but has health instead of a set number of charges. It resembles the microchip at the tip of your sprayer of motion sensor.\n\nZapping this sentry with your sprayer of motion sensor will upgrade and heal it.\n\nThis sentry will spend some health each time it sprays an enemy, but can be healed by using your sprayer of motion sensor on it.
items.wands.wandofwarding$ward.name_1=lesser ward
items.wands.wandofwarding$ward.desc_1=This basic ward will automatically spray any enemy which comes into its range of vision, dealing _%1$d-%2$d damage._\n\nZapping this ward with your sprayer of motion sensor will upgrade it.\n\nThis ward will only spray a single time before dissipating.\n\nYour sprayer of motion sensor is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_2=ward
items.wands.wandofwarding$ward.desc_2=This upgraded ward has a more intricate pattern, and can attack multiple times. Each spray from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your sprayer of motion sensor will upgrade it.\n\nThis ward will spray three times before dissipating.\n\nYour sprayer of motion sensor is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_3=greater ward
items.wands.wandofwarding$ward.desc_3=This fully upgraded ward is able to attack more times than its predecessors. Each spray from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your sprayer of motion sensor will upgrade it.\n\nThis ward will spray five times before dissipating.\n\nYour sprayer of motion sensor is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_4=lesser sentry
items.wands.wandofwarding$ward.desc_4=This smaller sentry has the same firepower as a greater ward, but has health instead of a set number of charges. It resembles the microchip at the tip of your sprayer of motion sensor. Each spray from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your sprayer of motion sensor will upgrade and heal it.\n\nThis sentry will spend some health each time it sprays an enemy, but can be healed by using your sprayer of motion sensor on it.\n\nYour sprayer of motion sensor is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_5=sentry
items.wands.wandofwarding$ward.desc_5=This upgraded sentry is larger and more durable than a lesser sentry. Each spray from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your sprayer of motion sensor will upgrade and heal it.\n\nThis sentry will spend some health each time it sprays an enemy, but can be healed by using your sprayer of motion sensor on it.\n\nYour sprayer of motion sensor is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_6=greater sentry
items.wands.wandofwarding$ward.desc_6=This fully upgraded sentry is significantly more durable than its predecessors. Each spray from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your sprayer of motion sensor will heal it.\n\nThis sentry will spend some health each time it sprays an enemy, but can be healed by using your sprayer of motion sensor on it.\n\nYour sprayer of motion sensor is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.discover_hint=You can find this character with a specific sprayer.
items.wands.wandofwarding$ward.dismiss_title=Dismiss this ward?
items.wands.wandofwarding$ward.dismiss_body=You can dispel this ward if you no longer want your sprayer to maintain it. Doing so immediately destroys the ward.\n\nDismiss this ward?
items.wands.wandofwarding$ward.dismiss_confirm=yes
items.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.weapon.curses.annoying.name=annoying %s
items.weapon.curses.annoying.msg_1=OOH, ARE WE FIGHTING SOMETHING!?
items.weapon.curses.annoying.msg_2=YEAH, GET THEM!
items.weapon.curses.annoying.msg_3=HEY, LISTEN!
items.weapon.curses.annoying.msg_4=ARE WE AT THE BOSS YET!?
items.weapon.curses.annoying.msg_5=OUCH, DON'T SWING ME SO HARD!
items.weapon.curses.annoying.msg_6=DIE, INSECT!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=CAN WE TAKE A BREAK!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=WELL STRUCK!
items.weapon.curses.annoying.msg_11=I didn't want to be a tool, I wanted to be a lumberjack's axe.
items.weapon.curses.annoying.msg_12=Remember, overconfidence is a slow and insidious killer.
items.weapon.curses.annoying.msg_13=ALL YOUR BASE ARE BELONG TO US!
items.weapon.curses.annoying.desc=Annoying tools are capable of speech, but they're a bit too energetic. They will often draw attention to you without meaning to.
items.weapon.curses.annoying.elestrike_desc=An elemental strike with an annoying malfunction has a 20% chance to amok each enemy in range for 6 turns.

items.weapon.curses.dazzling.name=dazzling %s
items.weapon.curses.dazzling.desc=Dazzling tools will sometimes flash with dazzling light, blinding everything that can see them.
items.weapon.curses.dazzling.elestrike_desc=An elemental strike with a dazzling malfunction has a 50% chance to blind each enemy in range for 6 turns.

items.weapon.curses.displacing.name=displacing %s
items.weapon.curses.displacing.desc=Displacing tools are infused with chaotic teleportation tech, possessing the ability to warp enemies around the floor randomly.
items.weapon.curses.displacing.elestrike_desc=An elemental strike with a displacing malfunction has a 50% chance to teleport each enemy in range.

items.weapon.curses.explosive.name=explosive %s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.explosive.hot=Hot!
items.weapon.curses.explosive.desc=Explosive tools steadily build up power and explode, damaging anything nearby.
items.weapon.curses.explosive.desc_cool=Your tool is currently cool to the touch.
items.weapon.curses.explosive.desc_warm=Your tool is building energy and getting warm...
items.weapon.curses.explosive.desc_hot=Your tool is hot! It's about to explode!
items.weapon.curses.explosive.elestrike_desc=An elemental strike with an explosive malfunction has a 50% chance to cause an explosion to appear on a random enemy in range.

items.weapon.curses.friendly.name=friendly %s
items.weapon.curses.friendly.desc=Friendly tools are best suited for pacifists, occasionally triggering tech that makes it impossible to fight.
items.weapon.curses.friendly.elestrike_desc=An elemental strike with a friendly malfunction has a 50% chance to charm each enemy in range for 6 turns.

items.weapon.curses.polarized.name=polarized %s
items.weapon.curses.polarized.desc=A polarized tool is affected by tech that causes its attack to either deal 50% more damage, or no damage at all.
items.weapon.curses.polarized.elestrike_desc=An elemental strike with a polarized malfunction has a 50% chance to deal 24-36 damage to each enemy in range.

items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.sacrificial.desc=Sacrificial tools will demand blood from the wearer in return for attacking foes. The more healthy the wearer is, the more blood the malfunction will take.
items.weapon.curses.sacrificial.elestrike_desc=An elemental strike with a sacrificial malfunction causes the janitor and each enemy in range to bleed for 12 HP.

items.weapon.curses.wayward.name=wayward %s
items.weapon.curses.wayward.desc=Wayward tools will sometimes become extremely inaccurate. This tech lasts for a little while when it activates, but can be dispelled by landing a blow with the wayward tool.
items.weapon.curses.wayward.elestrike_desc=An elemental strike with a wayward malfunction has a 50% chance to hex each enemy in range for 6 turns.
items.weapon.curses.wayward$waywardbuff.name=wayward
items.weapon.curses.wayward$waywardbuff.desc=Your wayward tool's tech has activated, making it extremely inaccurate for a short time. Note that this does not affect attacks which are guaranteed to hit, such as surprise attacks. Successfully attacking with the wayward tool will clear this effect immediately.\n\nTurns remaining: %s.

###enchantments
items.weapon.enchantments.blazing.name=blazing %s
items.weapon.enchantments.blazing.desc=This modification causes flames to spit forth from a tool, igniting enemies and dealing bonus damage to enemies that are already aflame.
items.weapon.enchantments.blazing.elestrike_desc=An elemental strike with a blazing modification spreads fire to every tile in range, which lasts 8 turns.

items.weapon.enchantments.blocking.name=blocking %s
items.weapon.enchantments.blocking.desc=Blocking tools have a chance to briefly shield you after attacking with them.
items.weapon.enchantments.blocking.elestrike_desc=An elemental strike with a blocking modification grants the Heavy Machinery Operator an extra 6 shielding for each enemy in range.
items.weapon.enchantments.blocking$blockbuff.name=blocking
items.weapon.enchantments.blocking$blockbuff.desc=Your tool's blocking modification has granted you a brief boost to your defensive power!\n\nShielding remaining: %d\n\nTurns remaining: %s.

items.weapon.enchantments.blooming.name=blooming %s
items.weapon.enchantments.blooming.desc=Blooming tools contain tech which will cause vegetation to sprout on or around those struck by them.
items.weapon.enchantments.blooming.elestrike_desc=An elemental strike with a blooming modification spreads grass to up to 8 tiles in range, and roots all enemies in range for 6 turns.

items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.chilling.desc=Enemies struck with this modification are chilled, slowing their movement and attacks.
items.weapon.enchantments.chilling.elestrike_desc=An elemental strike with a chilling modification spreads chilling air to every tile in range, which lasts 8 turns.

items.weapon.enchantments.kinetic.name=kinetic %s
items.weapon.enchantments.kinetic.desc=When an enemy is killed with a kinetic tool, any excess brute force is stored in the tool and will be applied to the next successful attack.
items.weapon.enchantments.kinetic.elestrike_desc=An elemental strike with a kinetic modification applies 40% of stored damage to each enemy in range, except the primary target.
items.weapon.enchantments.kinetic$conserveddamage.name=conserved damage
items.weapon.enchantments.kinetic$conserveddamage.desc=Your tool has stored the excess brute force from a previous killing blow, and will apply it as bonus damage to your next attack. The energy will slowly fade over time, however.\n\nConserved Damage: %d.

items.weapon.enchantments.corrupting.name=corrupting %s
items.weapon.enchantments.corrupting.desc=This powerful modification possesses the ability to turn enemies to your will. When an enemy is killed with this tool, there is a chance they will become corrupted instead of dying.
items.weapon.enchantments.corrupting.elestrike_desc=An elemental strike with a corrupting modification has a 5-25% chance (based on missing HP) to corrupt each enemy in range, except the primary target.

items.weapon.enchantments.elastic.name=elastic %s
items.weapon.enchantments.elastic.desc=Elastic tools have a chance to send enemies flying back short distances.
items.weapon.enchantments.elastic.elestrike_desc=An elemental strike with an elastic modification knocks all enemies in range back 5 tiles.

items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.grim.desc=This powerful modification possesses the power to instantly execute an enemy. The effect is more likely to occur the weaker the enemy is.
items.weapon.enchantments.grim.elestrike_desc=An elemental strike with a grim modification has a 6-30% chance (based on missing HP) to kill each enemy in range, except the primary target.

items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.lucky.desc=Enemies which are killed by a lucky tool have a chance to drop extra loot.
items.weapon.enchantments.lucky.elestrike_desc=An elemental strike with a lucky modification has a 12.5% chance to spawn loot under each enemy in range. This effect can only trigger once per enemy.

items.weapon.enchantments.projecting.name=projecting %s
items.weapon.enchantments.projecting.desc=With this modification melee tools will gain extra reach. Ranged tools will penetrate walls when aimed at nearby targets.
items.weapon.enchantments.projecting.elestrike_desc=An elemental strike with a projecting modification deals 30% damage to each enemy in range, except the primary target.

items.weapon.enchantments.shocking.name=shocking %s
items.weapon.enchantments.shocking.desc=Electricity arcs from a shocking tool, dealing extra damage to all nearby enemies.
items.weapon.enchantments.shocking.elestrike_desc=An elemental strike with a shocking modification spreads electricity to every tile in range, which lasts 8 turns.

items.weapon.enchantments.unstable.name=unstable %s
items.weapon.enchantments.unstable.desc=This modification radiates chaotic energy, acting as a different modification with each hit.
items.weapon.enchantments.unstable.elestrike_desc=An elemental strike with an unstable modification applies a random modification effect to each enemy in range, except the primary target.

items.weapon.enchantments.vampiric.name=vampiric %s
items.weapon.enchantments.vampiric.desc=This powerful modification leeches life brute force from enemies with each blow, funneling it back into the wearer. The effect is stronger the lower the wearer's health.
items.weapon.enchantments.vampiric.elestrike_desc=An elemental strike with a vampiric modification heals the Heavy Machinery Operator for 2.5 HP for each enemy in range.


###melee weapons
items.weapon.melee.assassinsblade.name=precision scalpel
items.weapon.melee.assassinsblade.stats_desc=This tool is stronger against unaware enemies.
items.weapon.melee.assassinsblade.ability_name=sneak
items.weapon.melee.assassinsblade.typical_ability_desc=The Heavy Machinery Operator can _sneak_ while wielding a precision scalpel. This ability lets the Heavy Machinery Operator instantly blink up to 3 tiles away and typically grants her _%d turns of optical camo._
items.weapon.melee.assassinsblade.ability_desc=The Heavy Machinery Operator can _sneak_ while wielding a precision scalpel. This ability lets the Heavy Machinery Operator instantly blink up to 3 tiles away and grants her _%d turns of optical camo._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.assassinsblade.desc=A small wavy attachment made of obsidian, difficult to use despite being lightweight, but deadly if it finds the right mark.

items.weapon.melee.battleaxe.name=fire axe
items.weapon.melee.battleaxe.stats_desc=This is a rather accurate tool.
items.weapon.melee.battleaxe.ability_name=heavy blow
items.weapon.melee.battleaxe.typical_ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a fire axe. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.battleaxe.ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a fire axe. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.battleaxe.desc=The enormous steel head of this fire axe puts considerable heft behind each wide stroke.

items.weapon.melee.crossbow.name=nail gun
items.weapon.melee.crossbow.typical_stats_desc=Typically this tool enhances thrown screws to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its modification to them.
items.weapon.melee.crossbow.stats_desc=This tool enhances thrown screws to deal _%1$d-%2$d damage_ when it is equipped, and will even grant its modification to them.
items.weapon.melee.crossbow.ability_name=charged shot
items.weapon.melee.crossbow.typical_ability_desc=The Heavy Machinery Operator can _charge_ her nail gun, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped screws will typically deal _+%1$d damage_, and tipped screws will apply their effect in a 7x7 area and typically last for _%2$d more uses_.
items.weapon.melee.crossbow.ability_desc=The Heavy Machinery Operator can _charge_ her nail gun, causing her next regular attack with it to always hit and apply one of three effects: melee attacks will knock enemies away, untipped screws will deal _+%1$d damage_, and tipped screws will apply their effect in a 7x7 area and last for _%2$d more uses_.
items.weapon.melee.crossbow.desc=A fairly intricate tool which shoots bolts at exceptional speeds. While it isn't designed for it, this nail gun's heft and sturdy construction make it a decent melee tool as well.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Ability Boost
items.weapon.melee.crossbow$chargedshot.name=charged
items.weapon.melee.crossbow$chargedshot.desc=The Heavy Machinery Operator is focusing power into her nail gun. The next attack she makes with it will always hit and apply one of three effects:\n- Melee attacks will knock enemies a few tiles away.\n- Untipped screws will deal bonus damage.\n- Tipped screws will gain extra uses and apply their effect in a 7x7 area. Positive screw effects will only affect allies, and harmful effects will only apply to enemies. The Heavy Machinery Operator cannot use this ability to apply positive screw effects to herself.

items.weapon.melee.cudgel.name=cudgel
items.weapon.melee.cudgel.stats_desc=This is a rather accurate tool.
items.weapon.melee.cudgel.ability_name=heavy blow
items.weapon.melee.cudgel.typical_ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a cudgel. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.cudgel.ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a cudgel. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.cudgel.desc=A small brass mallet, made more as a self-defense tool for nobles than as an factory work tool.
items.weapon.melee.cudgel.discover_hint=One of the janitorial crew starts with this item.

items.weapon.melee.dagger.name=screwdriver
items.weapon.melee.dagger.stats_desc=This tool is stronger against unaware enemies.
items.weapon.melee.dagger.ability_name=sneak
items.weapon.melee.dagger.typical_ability_desc=The Heavy Machinery Operator can _sneak_ while wielding a screwdriver. This ability lets the Heavy Machinery Operator instantly blink up to 5 tiles away and typically grants her _%d turns of optical camo._
items.weapon.melee.dagger.ability_desc=The Heavy Machinery Operator can _sneak_ while wielding a screwdriver. This ability lets the Heavy Machinery Operator instantly blink up to 5 tiles away and grants her _%d turns of optical camo._
items.weapon.melee.dagger.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dagger.desc=A simple iron screwdriver with a worn wooden handle.
items.weapon.melee.dagger.discover_hint=One of the janitorial crew starts with this item.

items.weapon.melee.dirk.name=box cutter
items.weapon.melee.dirk.stats_desc=This tool is stronger against unaware enemies.
items.weapon.melee.dirk.ability_name=sneak
items.weapon.melee.dirk.typical_ability_desc=The Heavy Machinery Operator can _sneak_ while wielding a box cutter. This ability lets the Heavy Machinery Operator instantly blink up to 4 tiles away and typically grants her _%d turns of optical camo._
items.weapon.melee.dirk.ability_desc=The Heavy Machinery Operator can _sneak_ while wielding a box cutter. This ability lets the Heavy Machinery Operator instantly blink up to 4 tiles away and grants her _%d turns of optical camo._
items.weapon.melee.dirk.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dirk.desc=A longer thrusting screwdriver, gives a bit more steel to plunge into foes.

items.weapon.melee.flail.name=heavy chain
items.weapon.melee.flail.stats_desc=This is a rather inaccurate tool.\nThis tool cannot surprise attack.
items.weapon.melee.flail.ability_name=spin
items.weapon.melee.flail.spin_warn=You can't spin the heavy chain any more.
items.weapon.melee.flail.typical_ability_desc=The Heavy Machinery Operator can _spin_ a heavy chain to build up power for a short time. Each turn the heavy chain is spun it will typically deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning heavy chain is also guaranteed to hit. Only starting to spin the heavy chain costs a charge.
items.weapon.melee.flail.ability_desc=The Heavy Machinery Operator can _spin_ a heavy chain to build up power for a short time. Each turn the heavy chain is spun it will deal _+%d damage_ on its next regular attack, to a max of 3 times. A spinning heavy chain is also guaranteed to hit. Only starting to spin the heavy chain costs a charge.
items.weapon.melee.flail.desc=A spiked ball attached to a handle by a length of chain. Very unwieldy, but devastating if it lands a solid hit.
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail$spinabilitytracker.desc=The Heavy Machinery Operator is spinning her heavy chain, building damage for her next regular attack with it. Each spin takes one turn but increases damage, to a max of three spins. The heavy chain is also guaranteed to hit while spinning.\n\nCurrent spins: %1$d%%.\nTurns remaining: %2$s.

items.weapon.melee.gauntlet.name=stone work glove
items.weapon.melee.gauntlet.stats_desc=This is a very fast tool.
items.weapon.melee.gauntlet.ability_name=combo strike
items.weapon.melee.gauntlet.typical_ability_desc=The Heavy Machinery Operator can perform a _combo strike_ with a stone work glove. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Heavy Machinery Operator has hit with a regular melee or thrown tool attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.gauntlet.ability_desc=The Heavy Machinery Operator can perform a _combo strike_ with a stone work glove. This attack is guaranteed to hit and deals _+%d damage_ for each time the Heavy Machinery Operator has hit with a regular melee or thrown tool attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.gauntlet.desc=This massive work glove is made of hazard orange fabric with heavy technological stone layered on top. The fabric tightens around you, making the thick stone plates almost like a second skin. Swinging such a heavy tool requires strength, but adds tremendous brute force to your blows.

items.weapon.melee.glaive.name=extendable window squeegee
items.weapon.melee.glaive.stats_desc=This is a rather slow tool.\nThis tool has extra reach.
items.weapon.melee.glaive.ability_name=spike
items.weapon.melee.glaive.typical_ability_desc=The Heavy Machinery Operator can use the tip of a extendable window squeegee to _spike_ an enemy that is in range but not adjacent. This typically deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.glaive.ability_desc=The Heavy Machinery Operator can use the tip of a extendable window squeegee to _spike_ an enemy that is in range but not adjacent. This deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.glaive.desc=A massive polearm consisting of a squeegee attachment on the end of a pole.

items.weapon.melee.gloves.name=studded rubber gloves
items.weapon.melee.gloves.stats_desc=This is a very fast tool.
items.weapon.melee.gloves.ability_name=combo strike
items.weapon.melee.gloves.typical_ability_desc=The Heavy Machinery Operator can perform a _combo strike_ with studded rubber gloves. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Heavy Machinery Operator has hit with a regular melee or thrown tool attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.gloves.ability_desc=The Heavy Machinery Operator can perform a _combo strike_ with studded rubber gloves. This attack is guaranteed to hit and deals _+%d damage_ for each time the Heavy Machinery Operator has hit with a regular melee or thrown tool attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.gloves.desc=These studded rubber gloves don't provide any real protection, but they act as a serviceable tool while keeping the hands free.
items.weapon.melee.gloves.discover_hint=One of the janitorial crew starts with this item.

items.weapon.melee.greataxe.name=chainsaw
items.weapon.melee.greataxe.stats_desc=This tool is incredibly heavy.
items.weapon.melee.greataxe.ability_name=retribution
items.weapon.melee.greataxe.typical_ability_desc=The Heavy Machinery Operator can perform a _retribution_ attack with a chainsaw if she is below 50%% health. This devastating attack typically deals _%1$d-%2$d damage,_ is guaranteed to hit, and is instantaneous if it kills an enemy.
items.weapon.melee.greataxe.ability_desc=The Heavy Machinery Operator can perform a _retribution_ attack with a chainsaw if she is below 50%% health. This devastating attack deals _%1$d-%2$d damage,_ is guaranteed to hit, and is instantaneous if it kills an enemy.
items.weapon.melee.greataxe.desc=Meant to be wielded over the shoulder, this titanic axe is as powerful as it is heavy.

items.weapon.melee.greatshield.name=welding screen
items.weapon.melee.greatshield.typical_stats_desc=Typically this tool blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.greatshield.stats_desc=This tool blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.greatshield.ability_name=guard
items.weapon.melee.greatshield.typical_ability_desc=The Heavy Machinery Operator can _guard_ herself with a welding screen, completely negating all physical or technological attacks made against her typically for _%d turns_. Once the Heavy Machinery Operator has blocked an attack, attacking back or using tech will end guarding.
items.weapon.melee.greatshield.ability_desc=The Heavy Machinery Operator can _guard_ herself with a welding screen, completely negating all physical or technological attacks made against her for _%d turns_. Once the Heavy Machinery Operator has blocked an attack, attacking back or using tech will end guarding.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.greatshield.desc=More like a mobile wall than a shield, this gigantic mass of metal aids defense, but doesn't leave much room for attacking.

items.weapon.melee.greatsword.name=industrial floor buffer
items.weapon.melee.greatsword.ability_name=cleave
items.weapon.melee.greatsword.typical_ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a industrial floor buffer. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.greatsword.ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a industrial floor buffer. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.greatsword.desc=This towering buffer pad inflicts heavy damage by investing its heft into every swing.

items.weapon.melee.handaxe.name=hand axe
items.weapon.melee.handaxe.stats_desc=This is a rather accurate tool.
items.weapon.melee.handaxe.ability_name=heavy blow
items.weapon.melee.handaxe.typical_ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a hand axe. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.handaxe.ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a hand axe. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.handaxe.desc=A light axe, most commonly used for felling trees. The wide attachment works well against foes as well.

items.weapon.melee.katana.name=machete
items.weapon.melee.katana.stats_desc=This tool blocks 0-3 damage.
items.weapon.melee.katana.ability_name=lunge
items.weapon.melee.katana.typical_ability_desc=The Heavy Machinery Operator can _lunge_ with a machete at an enemy 1 tile away. This moves toward the enemy, typically deals _%1$d-%2$d damage_, and is guaranteed to hit.
items.weapon.melee.katana.ability_desc=The Heavy Machinery Operator can _lunge_ with a machete at an enemy 1 tile away. This moves toward the enemy, deals _%1$d-%2$d damage_, and is guaranteed to hit.
items.weapon.melee.katana.desc=A slender heavy-duty mop with a large metal guard above the handle.

items.weapon.melee.longsword.name=heavy push broom
items.weapon.melee.longsword.ability_name=cleave
items.weapon.melee.longsword.typical_ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a heavy push broom. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.longsword.ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a heavy push broom. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.longsword.desc=This heavy push broom's bristled head shines reassuringly, though its size does make it quite heavy.

items.weapon.melee.mace.name=mallet
items.weapon.melee.mace.stats_desc=This is a rather accurate tool.
items.weapon.melee.mace.ability_name=heavy blow
items.weapon.melee.mace.typical_ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a mallet. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.mace.ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a mallet. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.mace.desc=The large iron head of this tool inflicts substantial damage.

items.weapon.melee.magesstaff.name=bio-hazard tech's power washer
items.weapon.melee.magesstaff.ac_imbue=IMBUE
items.weapon.melee.magesstaff.ac_zap=SPRAY
items.weapon.melee.magesstaff.prompt=Select a sprayer
items.weapon.melee.magesstaff.imbue=You imbue your power washer with the %s.
items.weapon.melee.magesstaff.preserved=The previous sprayer was preserved!
