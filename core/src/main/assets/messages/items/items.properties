items.weapon.missiles.shuriken$shurikeninstanttracker.desc=You have recently thrown a circular saw attachment instantly, and must wait before doing it again. Shurikens can still be thrown, but at normal tool speed.\n\nTurns Remaining: %s.

items.weapon.missiles.throwingclub.name=throwing club
items.weapon.missiles.throwingclub.stats_desc=This tool doesn't stick to enemies and can be collected instantly.
items.weapon.missiles.throwingclub.desc=A fairly simple but durable thrown tool, essentially a large rock fastened to a stick.

items.weapon.missiles.throwinghammer.name=throwing hammer
items.weapon.missiles.throwinghammer.stats_desc=This tool doesn't stick to enemies and can be collected instantly.
items.weapon.missiles.throwinghammer.desc=These hefty hammers are designed to be thrown at an enemy. Their smooth all-metal construction means they are quite durable.

items.weapon.missiles.throwingknife.name=throwing knife
items.weapon.missiles.throwingknife.stats_desc=This tool is stronger against unaware enemies.
items.weapon.missiles.throwingknife.desc=These lightweight knives are balanced to arc through the air right into their target.
items.weapon.missiles.throwingknife.discover_hint=One of the janitorial crew starts with this item.

items.weapon.missiles.throwingspear.name=throwing trash picker
items.weapon.missiles.throwingspear.desc=These lightweight spears have thin frames which are designed to be thrown, and not thrusted.

items.weapon.missiles.throwingspike.name=throwing spike
items.weapon.missiles.throwingspike.desc=These durable pointed shafts of metal are meant to be thrown into distant enemies.
items.weapon.missiles.throwingspike.discover_hint=One of the janitorial crew starts with this item.

items.weapon.missiles.throwingstone.name=throwing stone
items.weapon.missiles.throwingstone.desc=These stones are sanded down to make them able to be thrown with more power than a regular stone.
items.weapon.missiles.throwingstone.discover_hint=One of the janitorial crew starts with this item.

items.weapon.missiles.tomahawk.name=hatchet
items.weapon.missiles.tomahawk.stats_desc=This tool inflicts _%1$d-%2$d bleed_ to its target.
items.weapon.missiles.tomahawk.typical_stats_desc=This tool typically inflicts _%1$d-%2$d bleed_ to its target.
items.weapon.missiles.tomahawk.desc=These throwing axes have a serrated edge that tears as they stick to an enemy.

items.weapon.missiles.trident.name=trident
items.weapon.missiles.trident.desc=Massive throwing spears with three deadly prongs on the end. They are powerful, but quite heavy.


items.weapon.spiritbow.name=spirit rivet gun
items.weapon.spiritbow.ac_shoot=SHOOT
items.weapon.spiritbow.prompt=Choose a target
items.weapon.spiritbow.stats=The rivet gun cannot be directly upgraded, but will instead steadily grow stronger as you level up. At your current level, arrows shot from the rivet gun will deal _%1$d-%2$d damage_ and require _%3$d strength_ to use properly.
items.weapon.spiritbow.desc=A rivet gun made out of ancient technological wood. The rivet gun's string and etchings glow with a pale blue light. When the string is pulled this rivet gun will conjure a technological arrow which can be fired at an enemy.
items.weapon.spiritbow.discover_hint=One of the janitorial crew starts with this item.

items.weapon.weapon.identify=You are now familiar enough with your tool to identify it.
items.weapon.weapon.too_heavy=Because of your inadequate strength this tool will hinder your attack speed, precision, and ability to surprise attack.
items.weapon.weapon.excess_str=Because of your excess strength, you will deal _0-%d bonus damage_ with this tool.
items.weapon.weapon.hardening_gone=The hardening on this tool has worn off!
items.weapon.weapon.incompatible=Interaction of different types of tech has negated the modification on this tool!
items.weapon.weapon.cursed_worn=Because this tool is malfunctioning, you are powerless to remove it.
items.weapon.weapon.cursed=You can feel a malevolent tech lurking within this tool.
items.weapon.weapon.weak_cursed=Despite the malfunction, you are able to unequip this tool.
items.weapon.weapon.not_cursed=This tool is free of malevolent tech.
items.weapon.weapon.faster=It is augmented to enhance _speed._
items.weapon.weapon.stronger=It is augmented to enhance _damage._
items.weapon.weapon.enchanted=it has a _%s._
items.weapon.weapon.enchant_hardened=It has been _hardened._
items.weapon.weapon.hardened_no_enchant=This tool has been _hardened,_ but is not currently modified.
items.weapon.weapon$enchantment.enchant=modification
items.weapon.weapon$enchantment.rankings_desc=Killed by an modification
items.weapon.weapon$enchantment.discover_hint=You can find an item with this effect randomly in the factory, or try to apply it to an item yourself.


###misc items
items.amulet.name=infinite precision ball bearing
items.amulet.ac_end=END THE GAME
items.amulet.desc=The Infinite precision ball bearing is the most powerful artifact known to human or mechanic kind. Its shimmering crystals contain incredible and wondrous power.
items.amulet.desc_origins=The origins of the ball bearing are unknown. History says that the King of Mechanics boasted that he had discovered the artifact shortly before the Mechanical civilization cut off all contact. How did he find it? How did The Ultimate Ball Bearing take it from him? Questions for another time perhaps, all that matters now is the ball bearing is yours!
items.amulet.desc_ascent=The origins of the ball bearing are unknown, but clearly it has been heavily influenced by The ultimate ball bearing's power. The factory seems to be bending to The ultimate ball bearing's will as you move through it, making enemies much more plentiful and powerful! You're also no longer able to activate or discard the ball bearing, almost as if it is malfunctioning.
items.amulet.ascent_title=Ascension
items.amulet.ascent_desc=You begin to feel The ultimate ball bearing's great and terrible power radiating from the ball bearing. Ascending back through the factory as a mortal might be more difficult than you thought!\n\nIf you continue ascending with the ball bearing the factory will become more dangerous, teleports between floors will be disabled, and you will only be able to win the game by defeating enemies as you ascend through the factory!\n\nYou can leave the ball bearing here for now if you want to ascend without starting this challenge, or activate the ball bearing before ascending to end the game normally.
items.amulet.ascent_yes=Continue!
items.amulet.ascent_no=Stop for Now
items.amulet.discover_hint=You can find this item at the bottom of the factory...

items.ankh.name=ankh
items.ankh.ac_bless=BLESS
items.ankh.bless=You bless the ankh with technological water.
items.ankh.desc=This ancient symbol of immortality grants the ability to return to life after death. Most items will be dropped where you died, but can be reclaimed if you return to it. Using a full waterskin, the ankh can be blessed with extra strength.
items.ankh.desc_blessed=This ancient symbol of immortality grants the ability to return to life after death. The ankh has been blessed and is now much stronger. The Ankh will sacrifice itself to save you in a moment of deadly peril.
items.ankh.discover_hint=You can buy this item in a supply closet.

items.arcaneresin.name=arcane resin
items.arcaneresin.prompt=Select a sprayer
items.arcaneresin.ac_apply=APPLY
items.arcaneresin.level_too_high=That sprayer is too powerful for resin to improve.
items.arcaneresin.not_enough=You don't have enough resin for that!
items.arcaneresin.apply=You coat your sprayer with resin, increasing its power!
items.arcaneresin.desc=This fine powder shimmers between shades of purple and white. It can act as an amplifier to technological energies, increasing the level of sprayers when it is applied to them!\n\nUpgrading a sprayer costs 1, 2, or 3 resin depending on the sprayer's initial level. Resin can upgrade sprayers to a maximum of +3.\n\nResin upgrades are _overridden by other upgrade sources_ however (such as manuals of upgrade), and do not apply when imbuing a sprayer into the Bio-Hazard Tech's power washer.
items.arcaneresin.discover_hint=You can craft this item via alchemy.

items.brokenseal.name=broken seal
items.brokenseal.ac_affix=AFFIX
items.brokenseal.prompt=Select an PPE
items.brokenseal.unknown_armor=You must identify whether that PPE is malfunctioning or not first.
items.brokenseal.cursed_armor=The seal won't apply to malfunctioning PPE.
items.brokenseal.affix=You affix the seal to your PPE!
items.brokenseal.desc=A wax seal, affixed to PPE as a symbol of valor. It has a faded rune of protection engraved in the center, and is cracked in half across the middle.\n\nA memento from his home, the seal helps the rookie sweeper persevere. While wearing the seal the rookie sweeper will instantly gain shielding when he is about to be damaged to half health or lower.\n\nThe seal can be _affixed to PPE,_ and moved between PPE sets. It can carry a single upgrade with it, so long as that upgrade was applied to the PPE while the seal was attached to it.
items.brokenseal.inscribed=The seal is inscribed with a _%s._
items.brokenseal.choose_title=Choose a Safety Certification
items.brokenseal.choose_desc=Both this PPE and the broken seal are carrying a safety certification. Pick which safety certification should be kept.\n\nArmor Safety Certification: %1$s\nBroken Seal Safety Certification: %2$s\n\nNote that if you pick the safety certification that is currently on the PPE, the seal will not be able to transfer it later.
items.brokenseal.discover_hint=One of the janitorial crew starts with this item.
items.brokenseal$warriorshield.name=Rookie Sweeper Shield
items.brokenseal$warriorshield.desc_active=The Rookie Sweeper's broken seal is currently helping him persevere, granting him shielding on top of his health. There is a cooldown after the shielding initially triggers before it can be used again.\n\nThis shield does not decay over time, but will end if no enemies are nearby for a few turns. When it ends, any unused shielding will reduce the cooldown, up to a max of 50%%.\n\nShield remaining: %1$d.\n\nCurrent Cooldown: %2$d.
items.brokenseal$warriorshield.desc_cooldown=The Rookie Sweeper has recently gained shielding from his broken seal, and must wait until he can benefit from its shielding effect again.\n\nTurns Remaining: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=The Rookie Sweeper's shield cooldown is currently negative, meaning that when his shield activates the cooldown will be lower than the usual 150 turns. The shield cooldown can be reduced to as low as -150 turns, which means it will immediately be available again once it is activated.\n\nCurrent cooldown: %d.

items.dewdrop.name=dewdrop
items.dewdrop.already_full=You already have full health.
items.dewdrop.desc=A crystal clear dewdrop.\n\nDue to the tech of this place, pure water has minor restorative properties.

items.equipableitem.curse_detected=You sense that the item is malfunctioning just before you equip it!
items.equipableitem.unequip_cursed=You can't remove a malfunctioning item!
items.equipableitem.ac_equip=EQUIP
items.equipableitem.ac_unequip=UNEQUIP

items.energycrystal.name=energy crystal
items.energycrystal.desc=A collection of small technological crystals, filled with alchemical energy.\n\nThese crystals are the most common ingredient in alchemy recipes and can be produced at an alchemy pot by scrapping consumable items.

items.gold.name=company scrip
items.gold.desc=A pile of company scrip scrip. Collect company scrip scrip to spend them later in a supply closet.

items.heap.for_sale=%1$dg: %2$s
items.heap.chest=Chest
items.heap.chest_desc=You won't know what's inside until you open it!
items.heap.locked_chest=Locked chest
items.heap.locked_chest_desc=You won't know what's inside until you open it! But to open it you need a warning yellow key.
items.heap.crystal_chest=Crystal chest
items.heap.crystal_chest_desc=You can see _%s_ inside, but to open the chest you need a server room keycard.
items.heap.artifact=an artifact
items.heap.wand=a sprayer
items.heap.ring=a badge
items.heap.tomb=Tomb
items.heap.tomb_desc=This ancient tomb may contain something useful, but its owner will most certainly object to checking.
items.heap.skeleton=Skeletal remains
items.heap.skeleton_desc=This is all that's left of some unfortunate worker. Maybe it's worth checking for any valuables.
items.heap.remains=Janitor's remains
items.heap.remains_desc=This is all that's left from one of your predecessors. Maybe it's worth checking for any valuables.

items.honeypot.name=honeypot
items.honeypot.ac_shatter=SHATTER
items.honeypot.desc=This large honeypot is only really lined with honey, instead it houses a giant bee! These sorts of massive bees usually stay in their hives, perhaps the pot is some sort of specialized trapper's cage? The bee seems pretty content inside the pot with its honey, and buzzes at you warily when you look at it.
items.honeypot$shatteredpot.name=shattered honeypot
items.honeypot$shatteredpot.desc=The pot has been shattered, only the sticky honey that lines its walls is holding it together, and it is slowly coming apart.\n\nDespite its broken state, the bee still seems to want to protect the pot.

items.item.prompt=Choose direction of throw
items.item.ac_drop=DROP
items.item.ac_throw=THROW
items.item.rankings_desc=Killed by: %s
items.item.curse=malfunction
items.item.custom_note_type=This type of item has a custom note: "_%s_"
items.item.custom_note=This item has a custom note: "_%s_"
items.item.discover_hint=You can find this item randomly in the factory.

items.kindofmisc.unequip_title=Unequip one item
items.kindofmisc.unequip_message=You must unequip one of these items first. Select an item to swap with.

items.kindofweapon.swift_equip=You swiftly equip your tool.
items.kindofweapon.equip_cursed=Your grip involuntarily tightens around the tool.
items.kindofweapon.which_equip_msg=Which tool slot would you like to equip this item to?\n\nThe Champion directly attacks with her primary tool, but can use the ability of either tool. Both tools share the same charge count.\n\nThe Champion can also swap her primary and secondary tool instantly.
items.kindofweapon.which_equip_primary=Primary (%s)
items.kindofweapon.which_equip_secondary=Secondary (%s)
items.kindofweapon.empty=empty

items.kingscrown.name=Mechanic King's crown
items.kingscrown.ac_wear=WEAR
items.kingscrown.naked=Unfortunately, the crown cannot transform your underwear.
items.kingscrown.upgraded=The crown glows brightly and then disintegrates as your PPE transforms!
items.kingscrown.ratgraded=Rat King's paws glow brightly as your PPE transforms!
items.kingscrown.desc=The crown of the last mechanical king, it glows with tremendous technological energy.\n\nWhen worn, the crown's tech will flow into the PPE you're currently wearing, transforming it into a _unique epic PPE with special abilities._ The new PPE will keep all the properties of the original PPE.
items.kingscrown.discover_hint=You can get this item as a drop from certain enemies.

items.liquidmetal.name=liquid metal
items.liquidmetal.ac_apply=APPLY
items.liquidmetal.prompt=Select a thrown tool
items.liquidmetal.already_fixed=That thrown tool is already in perfect condition!
items.liquidmetal.apply=You use %d liquid metal to repair your thrown tool.
items.liquidmetal.desc=This technological liquid can fill into the cracks and tears on a thrown tool, restoring it to perfect condition! If a set of tools is missing a tool but otherwise fully repaired, then liquid metal can even be used to replace a missing tool from the set!\n\nA tier 1 tool requires 10 liquid metal to be fully repaired, a tier 5 tool requires 30. Each upgrade also increases the amount of metal needed by 35%.\n\nLiquid metal cannot be used to repair the tips on tipped screws.
items.liquidmetal.discover_hint=You can craft this item via alchemy.

items.lostbackpack.name=lost toolbag
items.lostbackpack.desc=This is your lost inventory. Collect it to reclaim all the items you lost!

items.merchantsbeacon.name=merchant's beacon
items.merchantsbeacon.ac_use=USE
items.merchantsbeacon.desc=This odd piece of mechanical technology allows you to communicate from great distances.\n\nAfter being activated, this beacon will let you sell items to Pixel Mart from anywhere in the factory.\n\nHowever, the tech within the beacon will only last for one session, so use it wisely.

items.stylus.name=arcane stylus
items.stylus.ac_inscribe=INSCRIBE
items.stylus.prompt=Select an PPE
items.stylus.identify=You must identify whether that PPE is malfunctioning first.
items.stylus.cursed=The stylus's tech will not work on malfunctioning PPE.
items.stylus.inscribed=You inscribed your PPE with the stylus.
items.stylus.desc=This arcane stylus is made of some dark, very hard stone. Using it you can inscribe a technological safety certification on your PPE, but you have no power over choosing what safety certification it will be, the stylus will decide it for you.

items.tengusmask.name=Tengu's mask
items.tengusmask.ac_wear=WEAR
items.tengusmask.used=The mask disintegrates as its power flows into you!
items.tengusmask.desc=This mask fell off Tengu's face as he died, you can feel great technological power emanating from it. Was the mask Tengu's source of strength?\n\nWhen worn, the tremendous power of the mask will be transferred into you, enabling you to _choose a subclass for your janitor._\n\nWhich subclass will you choose?
items.tengusmask.discover_hint=You can get this item as a drop from certain enemies.

items.torch.name=torch
items.torch.ac_light=LIGHT
items.torch.desc=An factory work staple, when a factory goes dark, a torch can help lead the way.

items.waterskin.name=waterskin
items.waterskin.ac_drink=DRINK
items.waterskin.collected=You collect the dewdrop into your waterskin.
items.waterskin.full=Your waterskin is full!
items.waterskin.empty=Your waterskin is empty!
items.waterskin.desc=A container for liquid, made from leather and string, sealed with a cork stopper.
items.waterskin.desc_water=Right now the waterskin just contains some plain drinking water. Surely there is something in the factory that the waterskin could store instead.
items.waterskin.desc_heal=The waterskin is currently being used to store healing water. The more full the waterskin is, the more you will be instantly healed when drinking from it. You will only drink as much as you need.
items.waterskin.desc_full=The full waterskin seems to radiate energy, perhaps it can be used to bless another survival item?
items.waterskin.discover_hint=One of the janitorial crew starts with this item.
