items.weapon.melee.rapier.discover_hint=One of the janitorial crew starts with this item.

items.weapon.melee.roundshield.name=trash can lid
items.weapon.melee.roundshield.typical_stats_desc=Typically this tool blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.roundshield.stats_desc=This tool blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.roundshield.ability_name=guard
items.weapon.melee.roundshield.typical_ability_desc=The Heavy Machinery Operator can _guard_ herself with a trash can lid, completely negating all physical or technological attacks made against her typically for _%d turns_. Once the Heavy Machinery Operator has blocked an attack, attacking back or using tech will end guarding.
items.weapon.melee.roundshield.ability_desc=The Heavy Machinery Operator can _guard_ herself with a trash can lid, completely negating all physical or technological attacks made against her for _%d turns_. Once the Heavy Machinery Operator has blocked an attack, attacking back or using tech will end guarding.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.roundshield.desc=This large shield effectively blocks attacks and makes a decent tool in a pinch.
items.weapon.melee.roundshield$guardtracker.name=guarding
items.weapon.melee.roundshield$guardtracker.guarded=guarded
items.weapon.melee.roundshield$guardtracker.desc=The Heavy Machinery Operator has readied her shield in anticipation of incoming attacks. Physical or technological attacks made against her will be completely negated.\n\nTurns remaining: %s.

items.weapon.melee.runicblade.name=electric carving knife
items.weapon.melee.runicblade.stats_desc=This tool benefits more from upgrades.
items.weapon.melee.runicblade.ability_name=runic slash
items.weapon.melee.runicblade.typical_ability_desc=The Heavy Machinery Operator can perform a _runic slash_ with a electric carving knife. This attack is guaranteed to hit and typically has _+%d%% modification power._
items.weapon.melee.runicblade.ability_desc=The Heavy Machinery Operator can perform a _runic slash_ with a electric carving knife. This attack is guaranteed to hit and has _+%d%% modification power._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Ability Power
items.weapon.melee.runicblade.desc=A mysterious tool from a distant land, with a bright blue attachment.

items.weapon.melee.sai.name=pliers
items.weapon.melee.sai.stats_desc=This is a very fast tool.
items.weapon.melee.sai.ability_name=combo strike
items.weapon.melee.sai.typical_ability_desc=The Heavy Machinery Operator can perform a _combo strike_ with pliers. This attack is guaranteed to hit and typically deals _+%d damage_ for each time the Heavy Machinery Operator has hit with a regular melee or thrown tool attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.sai.ability_desc=The Heavy Machinery Operator can perform a _combo strike_ with pliers. This attack is guaranteed to hit and deals _+%d damage_ for each time the Heavy Machinery Operator has hit with a regular melee or thrown tool attack. Not hitting for 5 turns resets this combo.
items.weapon.melee.sai.desc=Two thin attachments meant to be wielded in one hand each. Excellent for tearing down enemies with a flurry of cuts.
items.weapon.melee.sai$combostriketracker.name=combo strike
items.weapon.melee.sai$combostriketracker.desc=The Heavy Machinery Operator is building combo that can be used to increase the damage of the combo strike ability. Each successful regular melee or thrown tool attack will count, but not successfully attacking for 5 turns resets this combo.\n\nRecent hits: %1$d.\n\nTurns until hits are lost: %2$s.

items.weapon.melee.scimitar.name=hedge clipper-bar
items.weapon.melee.scimitar.stats_desc=This is a rather fast tool.
items.weapon.melee.scimitar.ability_name=heavy-duty mop dance
items.weapon.melee.scimitar.typical_ability_desc=The Heavy Machinery Operator can perform a _sword dance_ with a hedge clipper-bar. This stance takes no time to activate and grants the Heavy Machinery Operator +60%% attack speed and +50%% precision typically for _%d turns._
items.weapon.melee.scimitar.ability_desc=The Heavy Machinery Operator can perform a _sword dance_ with a hedge clipper-bar. This stance takes no time to activate and grants the Heavy Machinery Operator +60%% attack speed and +50%% precision for _%d turns._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.scimitar.desc=A thick curved attachment. Its shape allows for faster, yet less powerful attacks.
items.weapon.melee.scimitar$sworddance.name=heavy-duty mop dance
items.weapon.melee.scimitar$sworddance.desc=The Heavy Machinery Operator is making quick momentum based strikes in a sort of dance. While this stance is active, she attacks 60%% faster (enough to attack exactly twice a turn with a hedge clipper-bar) and has +50%% precision.\n\nTurns remaining: %s.

items.weapon.melee.sickle.name=hedge clipper
items.weapon.melee.sickle.stats_desc=This is a rather inaccurate tool.
items.weapon.melee.sickle.ability_name=harvest
items.weapon.melee.sickle.typical_ability_desc=The Heavy Machinery Operator can _harvest_ an enemy with a hedge clipper. This devastating attack is guaranteed to hit and typically deals _%d damage_. This damage is applied as bleeding if the target isn't immune.
items.weapon.melee.sickle.ability_desc=The Heavy Machinery Operator can _harvest_ an enemy with a hedge clipper. This devastating attack is guaranteed to hit and deals _%d damage_. This damage is applied as bleeding if the target isn't immune.
items.weapon.melee.sickle.desc=A handheld farming tool that can double as a strong but unwieldy tool.

items.weapon.melee.spear.name=trash picker
items.weapon.melee.spear.stats_desc=This is a rather slow tool.\nThis tool has extra reach.
items.weapon.melee.spear.ability_name=spike
items.weapon.melee.spear.typical_ability_desc=The Heavy Machinery Operator can use the tip of a trash picker to _spike_ an enemy that is in range but not adjacent. This typically deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.spear.ability_desc=The Heavy Machinery Operator can use the tip of a trash picker to _spike_ an enemy that is in range but not adjacent. This deals _%1$d-%2$d damage_, knocks the enemy back, and is guaranteed to hit.
items.weapon.melee.spear.desc=A slender wooden rod tipped with sharpened iron.

items.weapon.melee.sword.name=heavy-duty mop
items.weapon.melee.sword.ability_name=cleave
items.weapon.melee.sword.typical_ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a heavy-duty mop. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.sword.ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a heavy-duty mop. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.sword.desc=A nicely balanced heavy-duty mop. Not too large, but still notably longer than a pipe wrench.
items.weapon.melee.sword$cleavetracker.name=cleave
items.weapon.melee.sword$cleavetracker.desc=The Heavy Machinery Operator is ready to follow up on her previous cleave. The next use of cleave will not cost any tool ability charge.\n\nTurns remaining: %s.

items.weapon.melee.warhammer.name=sledgehammer
items.weapon.melee.warhammer.stats_desc=This is a rather accurate tool.
items.weapon.melee.warhammer.ability_name=heavy blow
items.weapon.melee.warhammer.typical_ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a sledgehammer. This concentrated attack typically deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.warhammer.ability_desc=The Heavy Machinery Operator can perform a _heavy blow_ with a sledgehammer. This concentrated attack deals _%1$d-%2$d damage_ if it surprised the enemy, and dazes them for 5 turns which reduces precision and dodging by 50%%. Heavy blow always hits but deals regular damage if it does not surprise the enemy.
items.weapon.melee.warhammer.desc=Few creatures can withstand the crushing blow of this towering mass of lead and steel, but it takes great strength to use effectively.

items.weapon.melee.warscythe.name=weed whacker
items.weapon.melee.warscythe.stats_desc=This is a rather inaccurate tool.
items.weapon.melee.warscythe.ability_name=harvest
items.weapon.melee.warscythe.typical_ability_desc=The Heavy Machinery Operator can _harvest_ an enemy with a weed whacker. This devastating attack is guaranteed to hit and typically deals _%d damage_. This damage is applied as bleeding if the target isn't immune.
items.weapon.melee.warscythe.ability_desc=The Heavy Machinery Operator can _harvest_ an enemy with a weed whacker. This devastating attack is guaranteed to hit and deals _%d damage_. This damage is applied as bleeding if the target isn't immune.
items.weapon.melee.warscythe.desc=This large and unwieldy tool has been reinforced to make it better at cutting foes than crops.

items.weapon.melee.whip.name=extension cord
items.weapon.melee.whip.stats_desc=This tool has tremendous reach.
items.weapon.melee.whip.ability_name=lash
items.weapon.melee.whip.typical_ability_desc=The Heavy Machinery Operator can _lash_ all enemies around her with a extension cord. This ability typically deals _%1$d-%2$d damage_, attacks all enemies within attack range, and is guaranteed to hit.
items.weapon.melee.whip.ability_desc=The Heavy Machinery Operator can _lash_ all enemies around her with a extension cord. This ability deals _%1$d-%2$d damage_, attacks all enemies within attack range, and is guaranteed to hit.
items.weapon.melee.whip.desc=While the barbed length of rope at the end of this tool deals poor damage, its reach cannot be matched.

items.weapon.melee.wornshortsword.name=worn pipe wrench
items.weapon.melee.wornshortsword.ability_name=cleave
items.weapon.melee.wornshortsword.typical_ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a worn pipe wrench. This typically deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.wornshortsword.ability_desc=The Heavy Machinery Operator can _cleave_ an enemy with a worn pipe wrench. This deals _%1$d-%2$d damage_ and is guaranteed to hit. If cleave kills an enemy it is instantaneous and the Heavy Machinery Operator can use cleave again within 5 turns for free.
items.weapon.melee.wornshortsword.desc=A quite short heavy-duty mop, worn down through heavy use. It is both weaker and a bit lighter than a pipe wrench in better condition.
items.weapon.melee.wornshortsword.discover_hint=One of the janitorial crew starts with this item.


###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenaline screw
items.weapon.missiles.darts.adrenalinedart.desc=These screws are tipped with a swiftthistle-based compound which will boost the movement and attack speed of allies, or briefly lower the movement speed of enemies. The screw itself is still harmful to enemies, but will not harm allies.

items.weapon.missiles.darts.blindingdart.name=blinding screw
items.weapon.missiles.darts.blindingdart.desc=These screws are tipped with a blindweed-based compound which will blind their target for a short time. They do not disorient however, so an enemy will still know where they last saw you.

items.weapon.missiles.darts.chillingdart.name=chilling screw
items.weapon.missiles.darts.chillingdart.desc=These screws are tipped with an icecap-based compound which will significantly chill their target.

items.weapon.missiles.darts.cleansingdart.name=cleansing screw
items.weapon.missiles.darts.cleansingdart.desc=These screws are tipped with a mageroyal-based compound which will temporarily make allies immune to all negative effects, or will cleanse positive effects from enemies. Enemies may even briefly forget that they are attacking or fleeing from you. The screw itself is still harmful to enemies, but will not harm allies.

items.weapon.missiles.darts.dart.name=screw
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.prompt=Select a seed
items.weapon.missiles.darts.dart.tip_title=Tip Screws
items.weapon.missiles.darts.dart.tip_desc=A seed can be combined with one or two screws to tip them. Each type of seed produces its own type of tipped screw, with a unique single-use effect.\n\nTipping a screw with these seeds will produce a _%s._
items.weapon.missiles.darts.dart.tip_all=tip %1$d screws with %2$d seeds
items.weapon.missiles.darts.dart.tip_two=tip 2 screws with 1 seed
items.weapon.missiles.darts.dart.tip_one=tip 1 screw with 1 seed
items.weapon.missiles.darts.dart.tip_cancel=cancel
items.weapon.missiles.darts.dart.desc=These simple shafts of spike-tipped wood are weighted to fly true and sting their prey with a flick of the wrist. They can be tipped with seeds to gain bonus effects when thrown.
items.weapon.missiles.darts.dart.unlimited_uses=Due to their simple construction screws will effectively last forever.

items.weapon.missiles.darts.displacingdart.name=displacing screw
items.weapon.missiles.darts.displacingdart.desc=These screws are tipped with a fadeleaf-based compound which will teleport their target a short distance away.

items.weapon.missiles.darts.healingdart.name=healing screw
items.weapon.missiles.darts.healingdart.desc=These screws are tipped with a sungrass-based compound which grants a burst of healing to their target. The screw itself is still harmful to enemies, but will not harm allies.

items.weapon.missiles.darts.holydart.name=holy screw
items.weapon.missiles.darts.holydart.desc=These screws are tipped with a starflower-based compound which infuses holy energy into their target. Allies and regular enemies will become blessed, but overworked employee or corrupted enemies will take heavy damage. The screw itself is still harmful to enemies, but will not harm allies.

items.weapon.missiles.darts.incendiarydart.name=incendiary screw
items.weapon.missiles.darts.incendiarydart.desc=These screws are tipped with a firebloom-based compound which will burst into brilliant flames on impact.

items.weapon.missiles.darts.paralyticdart.name=paralytic screw
items.weapon.missiles.darts.paralyticdart.desc=These screws are tipped with an earthroot-based compound which will paralyze their target for a short time.

items.weapon.missiles.darts.poisondart.name=poison screw
items.weapon.missiles.darts.poisondart.desc=These screws are tipped with a sorrowmoss-based compound which will poison their target.

items.weapon.missiles.darts.rotdart.name=rot screw
items.weapon.missiles.darts.rotdart.desc=These wicked screws are tipped with an acidic rotberry-based compound, which will aggressively eat through anything the screw comes into contact with. Powerful foes will resist most of the effect, but the acid spray is strong enough to easily kill most standard enemies. These last longer than other tipped screws, but their durability cannot be boosted.
items.weapon.missiles.darts.rotdart.discover_hint=You can create this item using a seed from a specific quest.

items.weapon.missiles.darts.shockingdart.name=shocking screw
items.weapon.missiles.darts.shockingdart.desc=These screws are tipped with a stormvine-based compound which will deliver a nasty shock to their target.

items.weapon.missiles.darts.tippeddart.ac_clean=CLEAN
items.weapon.missiles.darts.tippeddart.clean_title=Clean Screws
items.weapon.missiles.darts.tippeddart.clean_desc=This action will remove the seed tipping on your screws, reverting them back to regular screws.
