items.armor.clotharmor.name=cotton coveralls
items.armor.clotharmor.desc=This lightweight PPE offers basic protection.
items.armor.clotharmor.discover_hint=One of the janitorial crew starts with this item.

items.armor.duelistarmor.name=foreman's rig
items.armor.duelistarmor.desc=While wearing this hazmat suit and tarp, the Heavy Machinery Operator can perform a special ability.

items.armor.huntressarmor.name=safety inspector's jacket
items.armor.huntressarmor.no_enemies=No enemies in sight
items.armor.huntressarmor.desc=While wearing this tarp, the Exterminator can perform a special ability.

items.armor.leatherarmor.name=heavy-duty apron
items.armor.leatherarmor.desc=PPE made from tanned mutated worker hide. Not as light as cotton coveralls but provides better protection.

items.armor.magearmor.name=lab director's coat
items.armor.magearmor.desc=While wearing this gorgeous robe, the Bio-Hazard Tech can perform a special ability.

items.armor.mailarmor.name=kevlar vest
items.armor.mailarmor.desc=Interlocking metal links make for a tough but flexible suit of PPE.

items.armor.platearmor.name=hazmat suit
items.armor.platearmor.desc=Enormous plates of metal are joined together into a suit that provides unmatched protection to any worker strong enough to bear its staggering weight.

items.armor.roguearmor.name=nightwatch uniform
items.armor.roguearmor.desc=While wearing this dark garb, the Aging Custodian can perform a special ability.

items.armor.scalearmor.name=riot gear
items.armor.scalearmor.desc=The metal scales sewn onto a leather vest create a flexible, yet protective PPE.

items.armor.warriorarmor.name=heavy loader exoskeleton
items.armor.warriorarmor.desc=While wearing this heavy plated PPE, the Rookie Sweeper can perform a special ability.



###artifacts
items.artifacts.alchemiststoolkit.name=chemical mixing kit
items.artifacts.alchemiststoolkit.ac_brew=MIXTURE
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZE
items.artifacts.alchemiststoolkit.not_ready=Your toolkit has not finished warming up.
items.artifacts.alchemiststoolkit.cursed=Your malfunctioning toolkit prevents you from using alchemy!
items.artifacts.alchemiststoolkit.need_energy=You need at least 6 energy for that.
items.artifacts.alchemiststoolkit.energize_desc=Every 6 energy crystals will give the toolkit enough energy to gain a level, which increases the rate that the toolkit generates energy over time, and how quickly it warms up.\n\nHow much energy would you like to use?
items.artifacts.alchemiststoolkit.energize_1=6 energy: +1 level
items.artifacts.alchemiststoolkit.energize_all=%1$d energy: +%2$d levels
items.artifacts.alchemiststoolkit.desc=This toolkit contains a number of reagents and herbs along with a small mixing vial, allowing for alchemy on-the-go. The vial contains what looks like alchemical energy crystals in liquid form.
items.artifacts.alchemiststoolkit.desc_cursed=The malfunctioning toolkit has bound itself to your side, and refuses to let you use alchemy.
items.artifacts.alchemiststoolkit.desc_warming=The toolkit is currently warming up, and will be ready to use after a little while.
items.artifacts.alchemiststoolkit.desc_hint=The equipped toolkit is slowly generating alchemical energy as you gain experience. It looks like the mixture in the vial could be enhanced by adding energy crystals to it.

items.artifacts.artifact.cannot_wear_two=You cannot wear two of the same artifact.
items.artifacts.artifact.equip_cursed=The artifact painfully binds itself to you.
items.artifacts.artifact.curse_known=You can feel a malevolent tech lurking within the artifact.
items.artifacts.artifact.not_cursed=This artifact is free of malevolent tech.
items.artifacts.artifact.need_to_equip=You need to equip your artifact to do that.

items.artifacts.capeofthorns.name=tarp of thorns
items.artifacts.capeofthorns.desc=These collapsed sheets of metal from the THE ROGUE ASSEMBLY MACHINE have formed together into a rigid tarp. It seems to store a deep energy, perhaps it has some of the THE ROGUE ASSEMBLY MACHINE's power?
items.artifacts.capeofthorns.desc_inactive=The tarp feels reassuringly heavy on your shoulders, it seems to be gaining energy from the damage you take.
items.artifacts.capeofthorns.desc_active=The tarp seems to be releasing stored energy, it is radiating a protective power.
items.artifacts.capeofthorns$thorns.inert=Your Tarp becomes inert again.
items.artifacts.capeofthorns$thorns.radiating=Your Tarp begins radiating energy, you feel protected!
items.artifacts.capeofthorns$thorns.levelup=Your Tarp grows stronger!
items.artifacts.capeofthorns$thorns.name=thorns
items.artifacts.capeofthorns$thorns.desc=Your tarp is radiating energy, surrounding you in a field of deflective brute force!\n\nAll damage you receive is reduced while the thorns effect is active. Additionally, if the attacker is next to you, the reduced amount is deflected back at the attacker.\n\nTurns of thorns remaining: %s.

items.artifacts.chaliceofblood.name=suspicious coffee mug
items.artifacts.chaliceofblood.ac_prick=PRICK
items.artifacts.chaliceofblood.yes=Yes, I know what I'm doing
items.artifacts.chaliceofblood.no=No, I changed my mind
items.artifacts.chaliceofblood.prick_warn=Each time you use the chalice it will drain more of your life energy, but will further enhance your natural health regeneration in exchange.\n\nCurrently pricking yourself will deal _%1$d-%2$d damage_, although this damage can be reduced by _both physical and technological blocking or damage reduction._ Without considering damage reduction effects, pricking yourself currently has a _%3$s%% chance_ to drain your life brute force completely.\n\nAre you sure you want to offer the chalice more life energy?
items.artifacts.chaliceofblood.onprick=You prick yourself, and your life essence drains into the chalice.
items.artifacts.chaliceofblood.ondeath=The Chalice sucks your life essence dry...
items.artifacts.chaliceofblood.desc=This shining chrome chalice is oddly adorned with sharp gems at the rim.
items.artifacts.chaliceofblood.desc_cursed=The malfunctioning chalice has bound itself to your hand, and is inhibiting your ability to regenerate health.
items.artifacts.chaliceofblood.desc_1=As you hold the chalice, you feel oddly compelled to prick yourself on the sharp gems.
items.artifacts.chaliceofblood.desc_2=Some of your blood is pooled into the chalice, you can subtly feel the chalice feeding life energy into you, increasing your natural health regeneration. You still want to cut yourself on the chalice, even though you know it will hurt.
items.artifacts.chaliceofblood.desc_3=The chalice is filled to the brim with your life essence. You can feel the chalice pouring life energy back into you.

items.artifacts.cloakofshadows.name=stealth tarp
items.artifacts.cloakofshadows.ac_stealth=STEALTH
items.artifacts.cloakofshadows.cooldown=Your tarp needs %d more rounds to re-energize.
items.artifacts.cloakofshadows.cursed=You cannot use a malfunctioning tarp.
items.artifacts.cloakofshadows.no_charge=Your tarp hasn't recharged enough to be usable yet.
items.artifacts.cloakofshadows.desc=A priceless technological tarp, stolen from the royal armory many years ago by the Aging Custodian. When worn, it can be used to turn completely invisible for a short time.\n\nThe more the tarp is used, the stronger it will become, allowing the Aging Custodian to become invisible more frequently and for longer durations.
items.artifacts.cloakofshadows.discover_hint=One of the janitorial crew starts with this item.
items.artifacts.cloakofshadows$cloakstealth.no_charge=Your tarp has run out of energy.
items.artifacts.cloakofshadows$cloakstealth.levelup=Your tarp grows stronger!
items.artifacts.cloakofshadows$cloakstealth.name=cloaked
items.artifacts.cloakofshadows$cloakstealth.desc=Your stealth tarp is granting you optical camo while you are shrouded by it. You will remain cloaked until it is cancelled or your tarp runs out of charge.\n\nWhile you are invisible enemies are unable to attack or follow you. Physical attacks and technological effects (such as manuals and sprayers) will immediately cancel optical camo.\n\nTurns until charge use: %d.

items.artifacts.driedrose.name=employee of the month plaque
items.artifacts.driedrose.ac_summon=SUMMON
items.artifacts.driedrose.ac_direct=DIRECT
items.artifacts.driedrose.ac_outfit=OUTFIT
items.artifacts.driedrose.spawned=You have already summoned the lost worker.
items.artifacts.driedrose.no_charge=Your rose isn't fully charged yet.
items.artifacts.driedrose.cursed=You cannot use a malfunctioning rose.
items.artifacts.driedrose.no_space=There is no free space near you.
items.artifacts.driedrose.charged=Your rose is fully charged!
items.artifacts.driedrose.desc=Is this the rose that the lost worker mentioned before disappearing? It seems to hold some spiritual power, perhaps it can be used to channel the energy of that lost rookie sweeper.
items.artifacts.driedrose.desc_no_quest=A dried aged rose that is somehow still holding together despite its age.\n\nIt seems to have some spiritual power, but you have no idea how to use it right now.
items.artifacts.driedrose.desc_hint=It seems to be missing some petals. Perhaps reattaching them will strengthen the rose.
items.artifacts.driedrose.desc_cursed=The malfunctioning rose is bound to your hand, it feels eerily cold.
items.artifacts.driedrose.desc_weapon=Lost Worker's tool: %s
items.artifacts.driedrose.desc_armor=Lost Worker's PPE: %s
items.artifacts.driedrose.desc_strength=Lost Worker's strength: %s
items.artifacts.driedrose$petal.name=dried petal
items.artifacts.driedrose$petal.no_rose=You have no rose to add this petal to.
items.artifacts.driedrose$petal.no_room=There is no room left for this petal, so you discard it.
items.artifacts.driedrose$petal.maxlevel=The rose is completed!
items.artifacts.driedrose$petal.levelup=You add the petal to the rose.
items.artifacts.driedrose$petal.desc=A frail dried up petal, which has somehow survived this far into the factory.
items.artifacts.driedrose$wndghosthero.title=Lost Worker's Equipment
items.artifacts.driedrose$wndghosthero.desc=The lost worker is weak on their own, but their form is solid enough to be equipped with a tool and PPE. They will be able to use these items just like you do.\n\nThe lost worker can currently equip items requiring up to _%d strength._
items.artifacts.driedrose$wndghosthero.weapon_prompt=Select a tool
items.artifacts.driedrose$wndghosthero.armor_prompt=Select an PPE
items.artifacts.driedrose$wndghosthero.cant_unique=The lost worker can't use unique items.
items.artifacts.driedrose$wndghosthero.cant_cursed=The lost worker can only use equipment that you're sure isn't malfunctioning.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=The lost worker may not be strong enough to use that.
items.artifacts.driedrose$wndghosthero.cant_strength=The lost worker is not strong enough to use that.

##ghost hero
items.artifacts.driedrose$ghosthero.name=lost maintenance worker
items.artifacts.driedrose$ghosthero.def_verb=dodged
items.artifacts.driedrose$ghosthero.discover_hint=You can find this character with a specific artifact.

items.artifacts.driedrose$ghosthero.hello=Hello again %s.
items.artifacts.driedrose$ghosthero.introduce=My spirit is bound to this rose, it was very precious to me, a gift from my love whom I left on the surface.\n\nI cannot return to him, but thanks to you I have a second chance to complete my journey. When I am able I will respond to your call and fight with you.\n\nAs long as you have the rose I can hear your voice, so you can use it to direct me from afar.\n\nHopefully you may succeed where I failed...

items.artifacts.driedrose$ghosthero.dialogue_sewers_1=These sewers used to be safe, people even lived here in the winter.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=I wonder what happened to the guard patrols, did they give up?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=I had family on the surface, I hope they're safe.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=The guards couldn't defeat these mutated workers, but maybe we can.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=If even the sewers are this dangerous, I wonder what's below...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=What could have caused these rats and crabs to grow so large?
items.artifacts.driedrose$ghosthero.dialogue_prison_1=I've heard stories about this place, nothing good.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=This place was always more of a factory than a prison.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=I can't imagine what went on when this place was abandoned.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=It seems both the prisoners and guards have been turned into mutated workers.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=What could be responsible for all these skeletons?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=These people didn't have to end up like this...
items.artifacts.driedrose$ghosthero.dialogue_caves_1=No human or mechanic has been here for a very long time.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=What would cause the mechanics to abandon a company scrip mine?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=It's a shame all the company scrip here is useless on the surface.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=The creatures here are twisted, just like in the sewers.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Even the bats are bloodthirsty here.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=No sign of any mining equipment, did the mechanics reclaim it all?
items.artifacts.driedrose$ghosthero.dialogue_city_1=The mechanics were industrious, but greedy.
items.artifacts.driedrose$ghosthero.dialogue_city_2=So the mechanical metropolis really has fallen.
items.artifacts.driedrose$ghosthero.dialogue_city_3=I hope the surface never ends up like this place.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Mechanics aren't supposed to look so pale.
items.artifacts.driedrose$ghosthero.dialogue_city_5=I don't know what's worse, the mechanics, or their creations.
items.artifacts.driedrose$ghosthero.dialogue_city_6=It seems the mechanics are mindless mutated workers now as well.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=What is this place?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=This place is terrifying...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=What were the mechanics thinking, toying with power like this?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=The mutated workers here are otherworldly, where did they come from?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Can you feel it? It's like something is watching us.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Thank goodness there are torches, it's so dark here!
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Why is this happening, I thought we succeeded?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=How is that thing still able to influence this world?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=I hope you know what you're doing with that ball bearing.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=I suppose we're not done just yet.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=We've come so far already, we can finish this!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Just a little further, we can make it out of here!

items.artifacts.driedrose$ghosthero.seen_goo_1=Beware Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Many of my friends died to this thing, time for vengeance!
items.artifacts.driedrose$ghosthero.seen_goo_3=Such an abomination cannot be allowed to live!
items.artifacts.driedrose$ghosthero.seen_tengu_1=The one prisoner left is a deadly assassin. Of course...
items.artifacts.driedrose$ghosthero.seen_tengu_2=He's trapped us!
items.artifacts.driedrose$ghosthero.seen_tengu_3=I've heard horror stories about that mask...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Only mechanics would build a mining machine that kills intruders.
items.artifacts.driedrose$ghosthero.seen_dm300_2=That thing is huge...
items.artifacts.driedrose$ghosthero.seen_dm300_3=How has this thing stayed active for so long?
items.artifacts.driedrose$ghosthero.seen_king_1=When people say power corrupts, this is what they mean.
items.artifacts.driedrose$ghosthero.seen_king_2=He's more of a lich than a king now.
items.artifacts.driedrose$ghosthero.seen_king_3=Even in death the mechanics obey their master.
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, this doesn't look good.
items.artifacts.driedrose$ghosthero.seen_yog_2=So that's what a god looks like?
items.artifacts.driedrose$ghosthero.seen_yog_3=This is going to hurt...

items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Good luck...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Tired... for now...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=I will return...
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=I'm sorry... good luck...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finish it off... without me...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... I can't...
items.artifacts.driedrose$ghosthero.blessed_ankh_1=How did you survive that?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=I wish I had one of those...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh my! You're still alive!
items.artifacts.driedrose$ghosthero.player_killed_1=No!...
items.artifacts.driedrose$ghosthero.player_killed_2=I couldn't help them...
items.artifacts.driedrose$ghosthero.player_killed_3=Not like this...

items.artifacts.driedrose$ghosthero.direct_prompt=What should I do?
items.artifacts.driedrose$ghosthero.directed_follow_1=Okay, I'll follow you.
items.artifacts.driedrose$ghosthero.directed_follow_2=I'll fall in behind you.
items.artifacts.driedrose$ghosthero.directed_follow_3=Following you...
items.artifacts.driedrose$ghosthero.directed_follow_4=Okay, let's go!
items.artifacts.driedrose$ghosthero.directed_follow_5=I've got your back.
