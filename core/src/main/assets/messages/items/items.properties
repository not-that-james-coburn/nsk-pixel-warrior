items.weapon.missiles.darts.tippeddart.unlimited_uses=_But these are of such high quality that they will effectively last forever._
items.weapon.missiles.darts.tippeddart.about_to_break=Your screw's tip is about to expire.
items.weapon.missiles.darts.tippeddart.has_broken=Your screw's tip has expired.
items.weapon.missiles.darts.tippeddart.discover_hint=You can buy this item in a supply closet, or create it using a seed.


items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=This tool inflicts cripple on its target.
items.weapon.missiles.bolas.desc=These unusual ranged tools aren't very damaging, but do an excellent job of slowing their target.

items.weapon.missiles.boomerang.name=curved crowbar
items.weapon.missiles.boomerang.desc=Thrown to the enemy this flat curved wooden missile will return to the hands of its thrower.
items.weapon.missiles.boomerang.durability=Due to its solid construction, this curved crowbar will not break from use.

items.weapon.missiles.fishingspear.name=fishing trash picker
items.weapon.missiles.fishingspear.desc=Tiny throwing spears that work well as an improvised tool despite being designed for fishing.

items.weapon.missiles.forcecube.name=compressed scrap block
items.weapon.missiles.forcecube.ondeath=You killed yourself with your own Compressed Scrap Block...
items.weapon.missiles.forcecube.stats_desc=This tool spreads the brute force of its impact over a small area, hitting everything nearby.
items.weapon.missiles.forcecube.desc=These oddly-shaped technological cubes are small enough to hold in your hand, but are incredibly heavy.

items.weapon.missiles.heavyboomerang.name=heavy curved crowbar
items.weapon.missiles.heavyboomerang.stats_desc=This tool circles back to the location it was thrown from after five turns.
items.weapon.missiles.heavyboomerang.desc=This large curved crowbar is difficult to wield effectively, but will deal considerable damage.

items.weapon.missiles.javelin.name=rebar spear
items.weapon.missiles.javelin.desc=These larger throwing spears are weighted to keep the spike at their tip foremost as they sail through the air.

items.weapon.missiles.kunai.name=utility knife
items.weapon.missiles.kunai.stats_desc=This tool is stronger against unaware enemies.
items.weapon.missiles.kunai.desc=These small knives are very powerful in the hands of a skilled user.

